<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Long Silence — Pantheon Gate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#100e16;
  --ink-2:#17131f;
  --parchment:#e9decb;
  --parchment-dim:#b9ac93;
  --gold:#c8a24a;
  --gold-bright:#e6c777;
  --ember:#a1462a;
  --line:#3a3346;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--parchment);font-family:'EB Garamond',serif;}
body{
  background-image:radial-gradient(ellipse at 20% -10%, rgba(200,162,74,0.10), transparent 55%),
                   radial-gradient(ellipse at 90% 5%, rgba(138,107,184,0.08), transparent 55%);
  background-attachment:fixed;
}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:0.04em;}
.wrap{max-width:760px;margin:0 auto;padding:0 24px 100px;}
.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);opacity:0.85;}
header.mast{text-align:center;padding:64px 0 40px;}
header.mast h1{font-size:clamp(32px,6vw,50px);margin:14px 0 6px;color:var(--parchment);text-shadow:0 0 30px rgba(200,162,74,0.15);}
header.mast p.sub{font-style:italic;color:var(--parchment-dim);max-width:480px;margin:0 auto;font-size:16px;}
.rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:22px auto;}
.backlink{display:block;text-align:center;color:var(--parchment-dim);text-decoration:none;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-family:'Cinzel',serif;margin-top:10px;}
.backlink:hover{color:var(--gold-bright);}

/* The map hub is the landing screen and it means the whole picture, full
   viewport, edge to edge — not a bordered widget boxed into the 760px
   .wrap column. body.map-screen (toggled by render(), see renderMapHub())
   hides the mast/footer and lets .map-hub-screen take over the entire
   browser window via position:fixed, independent of .wrap's max-width. */
body.map-screen{overflow:hidden;}
body.map-screen .mast, body.map-screen footer.notice{display:none;}
body.map-screen .wrap{max-width:none;margin:0;padding:0;}
.map-hub-screen{
  position:fixed;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  background:var(--ink);
}

/* Real login is now required before anything else loads — no more
   anonymous-first play. Same "escape .wrap via position:fixed, hide the
   mast/footer via a body class" trick as the map screen, but this one
   crops to fill (background-size:cover with no aspect-ratio lock) since
   there's no hotspot grid to keep aligned here, just a login card
   floating over a hero image. */
body.login-screen{overflow:hidden;}
body.login-screen .mast, body.login-screen footer.notice{display:none;}
body.login-screen .wrap{max-width:none;margin:0;padding:0;}
.login-screen-wrap{
  position:fixed;inset:0;z-index:5;
  display:flex;align-items:center;justify-content:center;
  background:url('https://static.wixstatic.com/media/d6c75e_6e127e24b9ce43e2a468ef72aa9dd73a~mv2.jpg') center/cover no-repeat;
}
.login-card{
  background:rgba(10,8,16,0.74);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  border:1px solid var(--line);border-radius:6px;
  padding:38px 32px;max-width:360px;width:calc(100% - 40px);text-align:center;
}
.login-card h1{font-size:clamp(24px,5vw,32px);margin:0 0 10px;color:var(--parchment);text-shadow:0 0 24px rgba(200,162,74,0.25);}
.login-card .hint{margin:0 0 22px;}
.login-card input{margin-bottom:12px;}
.login-divider{display:flex;align-items:center;gap:10px;color:var(--parchment-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;margin:20px 0;}
.login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--line);}

.card{background:linear-gradient(180deg,var(--ink-2),var(--ink));border:1px solid var(--line);border-radius:4px;padding:28px;margin-bottom:24px;}
.card h2{font-size:18px;color:var(--gold-bright);margin:0 0 8px;}
.card .hint{color:var(--parchment-dim);font-style:italic;font-size:14px;margin:0 0 20px;}

.choice-row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
.choice{background:rgba(0,0,0,0.25);border:1px solid var(--line);border-radius:4px;padding:22px 18px;text-align:center;cursor:pointer;width:190px;transition:border-color .15s, transform .15s;}
.choice:hover{border-color:var(--gold);transform:translateY(-2px);}
.choice.selected{border-color:var(--gold-bright);background:rgba(200,162,74,0.08);box-shadow:0 0 0 1px var(--gold-bright);}
.choice .art{margin:0 auto 12px;display:flex;align-items:center;justify-content:center;height:104px;}
.choice .label{font-family:'Cinzel',serif;font-size:12.5px;letter-spacing:0.06em;color:var(--parchment);}
.choice .blurb{font-size:12px;color:var(--parchment-dim);font-style:italic;margin-top:4px;}

.swatch-row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
.swatch{width:44px;height:44px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s;}
.swatch:hover{transform:scale(1.08);}
.swatch.selected{border-color:var(--gold-bright);box-shadow:0 0 0 3px rgba(230,199,119,0.25);}

input[type=text],input[type=email]{
  background:rgba(0,0,0,0.3);border:1px solid var(--line);color:var(--parchment);padding:12px 14px;
  font-family:'EB Garamond',serif;font-size:16px;border-radius:3px;width:100%;max-width:320px;margin:0 auto 16px;display:block;
}
input:focus{outline:none;border-color:var(--gold);}
button{background:var(--gold);color:var(--ink);border:none;padding:12px 26px;font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;border-radius:3px;cursor:pointer;display:block;margin:0 auto;}
button:hover:not(:disabled){background:var(--gold-bright);}
button:disabled{opacity:0.4;cursor:not-allowed;}
button.secondary{background:transparent;border:1px solid var(--gold);color:var(--gold-bright);}
.status{font-size:13px;color:var(--parchment-dim);font-style:italic;text-align:center;margin-top:14px;min-height:18px;}
.status.ok{color:var(--gold-bright);}
.status.err{color:var(--ember);}

.guardian-display{text-align:center;padding:10px 0 20px;}
.guardian-display .art{margin:0 auto 14px;filter:drop-shadow(0 0 22px rgba(200,162,74,0.22));}
.guardian-display h2{font-size:26px;color:var(--parchment);margin:0 0 4px;}
.stage-badge{display:inline-block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;
  color:var(--gold-bright);border:1px solid var(--gold);border-radius:20px;padding:4px 14px;margin-bottom:6px;}
.species-line{color:var(--parchment-dim);font-style:italic;font-size:14px;margin-bottom:20px;}

.bond-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 6px;flex-wrap:wrap;}
.bond-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:var(--parchment-dim);}
.bond-value{font-family:'Cinzel',serif;font-size:20px;color:var(--gold-bright);}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px;margin:20px 0 4px;}
.stat-tile{border:1px solid var(--line);border-radius:3px;padding:12px 8px;text-align:center;}
.stat-tile .num{font-family:'Cinzel',serif;font-size:19px;color:var(--gold-bright);}
.stat-tile .label{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--parchment-dim);margin-top:3px;}

.marks-note{text-align:center;color:var(--parchment-dim);font-style:italic;font-size:14px;margin:20px 0 0;}

/* Map hub — real map artwork as the background, with fully invisible
   clickable regions positioned by percentage over each illustrated
   location and its label banner. No visible button chrome by design —
   the art itself is the only affordance ("place the nodes... then hide
   the nodes so that they are only clicking on the map background"). */
.map-hub{
  position:relative;overflow:hidden;
  /* As large as the viewport allows while staying locked to the source
     art's exact 1408x768 ratio — the hotspot percentages below were
     measured against that ratio, so this can't crop/stretch to fill the
     screen the way a plain background-size:cover would; it has to grow
     within it instead. Whichever dimension is the tighter fit wins. */
  width:min(100vw, calc(100vh * 1408 / 768));
  aspect-ratio:1408/768;
  background:url('https://static.wixstatic.com/media/d6c75e_11a7f28595a041d49639dce6f72788d7~mv2.jpg') center/cover no-repeat;
}
.map-hotspot{
  position:absolute;background:transparent;border:none;padding:0;margin:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
/* The global button/button:hover rules above (background:var(--gold) /
   var(--gold-bright)) win a specificity tie against plain .map-hotspot on
   hover/active/focus — that's the solid gold fill that was blotting out
   the map art under whichever region the cursor sat over. Force it
   transparent in every interactive state so the art is always visible. */
.map-hotspot:hover,.map-hotspot:active,.map-hotspot:focus{background:transparent!important;}
.map-hotspot:focus-visible{outline:2px solid rgba(230,199,119,0.55);outline-offset:2px;}

.phase-note{text-align:center;color:var(--parchment-dim);font-size:12.5px;font-style:italic;margin-bottom:18px;}
.phase-note strong{color:var(--gold-bright);font-style:normal;}

.pantheon-group{margin-bottom:18px;}
.pantheon-group h3{font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--gold);opacity:0.85;margin:0 0 8px;text-align:left;}
.deity-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;cursor:pointer;transition:border-color .15s;}
.deity-row:hover{border-color:var(--gold);}
.deity-row .name{font-family:'Cinzel',serif;font-size:13.5px;color:var(--parchment);}
.mark-badge{font-size:10px;letter-spacing:0.06em;text-transform:uppercase;font-family:'Cinzel',serif;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--parchment-dim);}
.mark-badge.full{color:var(--ink);background:var(--gold-bright);border-color:var(--gold-bright);}
.mark-badge.partial{color:var(--gold-bright);border-color:var(--gold);}

.challenge-text{font-style:italic;font-size:16px;line-height:1.6;color:var(--parchment);text-align:center;margin:0 0 22px;padding:0 6px;}
textarea{background:rgba(0,0,0,0.3);border:1px solid var(--line);color:var(--parchment);padding:12px 14px;
  font-family:'EB Garamond',serif;font-size:16px;border-radius:3px;width:100%;max-width:520px;margin:0 auto 16px;display:block;min-height:110px;resize:vertical;}
textarea:focus{outline:none;border-color:var(--gold);}

.verdict-card{text-align:center;}
.verdict-badge{display:inline-block;font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;border-radius:20px;padding:5px 16px;margin-bottom:14px;}
.verdict-badge.full{color:var(--ink);background:var(--gold-bright);}
.verdict-badge.partial{color:var(--gold-bright);border:1px solid var(--gold);}
.verdict-text{font-style:italic;font-size:16px;line-height:1.6;color:var(--parchment);margin:0 0 18px;}
.gain-note{font-size:13px;color:var(--parchment-dim);margin-bottom:22px;}

.essence-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 18px;}
.essence-label{font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--parchment-dim);}
.essence-value{font-family:'Cinzel',serif;font-size:15px;color:var(--moon);}

.tier-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;margin-bottom:8px;cursor:pointer;transition:border-color .15s;}
.tier-row:hover{border-color:var(--gold);}
.tier-row.locked{opacity:0.4;cursor:not-allowed;}
.tier-row .tname{font-family:'Cinzel',serif;font-size:13.5px;color:var(--parchment);}
.tier-row .taff{font-size:11px;color:var(--parchment-dim);font-style:italic;}

.mark-check{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;cursor:pointer;}
.mark-check.picked{border-color:var(--gold-bright);background:rgba(200,162,74,0.08);}
.mark-check .mname{font-size:14px;color:var(--parchment);}

.hp-row{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;}
.hp-name{font-family:'Cinzel',serif;font-size:13px;color:var(--parchment);}
.hp-bar-track{background:rgba(0,0,0,0.4);border:1px solid var(--line);border-radius:20px;height:10px;overflow:hidden;margin-bottom:18px;}
.hp-bar-fill{height:100%;background:linear-gradient(90deg,var(--ember),var(--gold-bright));transition:width .35s ease;}
.hp-bar-fill.opponent{background:linear-gradient(90deg,var(--amethyst,#8a6bb8),var(--moon));}
.battle-arena{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;}
.battle-side{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;}
.battle-sprite{display:flex;align-items:flex-end;justify-content:center;height:100px;margin-bottom:6px;}
.battle-vs{flex:none;font-family:'Cinzel',serif;font-size:14px;color:var(--parchment-dim);padding:0 2px;align-self:flex-start;margin-top:40px;}
@media (max-width:520px){.battle-arena{gap:6px;} .battle-sprite{height:70px;}}
.hp-wrap{position:relative;}
.hp-wrap.flash-hit{animation:hitFlash 0.45s ease;}
.hp-wrap.control-hit .hp-bar-track{box-shadow:0 0 0 1px var(--moon);}
@keyframes hitFlash{ 0%{filter:brightness(1);} 25%{filter:brightness(2) saturate(1.5);transform:translateX(-2px);} 50%{transform:translateX(2px);} 100%{filter:brightness(1);transform:translateX(0);} }
.dmg-float{position:absolute;right:4px;top:-6px;font-family:'Cinzel',serif;font-size:15px;color:var(--ember);pointer-events:none;animation:dmgFloat 0.9s ease forwards;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
.dmg-float.crit{color:var(--gold-bright);font-size:18px;}
.dmg-float.control{color:var(--moon);font-size:13px;}
.dmg-float.heal{color:#7fbf6a;}
.dmg-float.burntick{color:var(--ember);font-size:13px;}
.dmg-float.stunlabel{left:4px;right:auto;color:var(--moon);font-size:12px;letter-spacing:0.06em;text-transform:uppercase;}
@keyframes dmgFloat{ 0%{opacity:1;transform:translateY(0);} 100%{opacity:0;transform:translateY(-28px);} }

/* Particle bursts — real sprite art (CC0, Kenney's Particle Pack), not
   plain CSS shapes. Each sprite is a grayscale glow/smoke/spark texture
   with its own alpha falloff; a div masks that texture and fills it with
   a solid color via CSS mask-image, so the same 14 small PNGs (shipped in
   particle-fx/) can be tinted to any affinity or status color at runtime
   — one asset, any color, same trick used for the evolution glow aura
   elsewhere in this file. Per-particle trajectory is set inline via
   --tx/--ty custom props so one shared keyframe animation drives every
   burst. Falls back to a plain tinted square on browsers without mask
   support (all evergreen browsers support it) — border-radius keeps that
   fallback at least dot-shaped. */
.particle{position:absolute;top:50%;left:50%;width:var(--p-size,20px);height:var(--p-size,20px);margin:calc(var(--p-size,20px) / -2) 0 0 calc(var(--p-size,20px) / -2);border-radius:50%;background-color:var(--p-color,#e6c777);pointer-events:none;animation-name:particleBurst;animation-timing-function:ease-out;animation-fill-mode:forwards;
  -webkit-mask-image:var(--p-sprite);mask-image:var(--p-sprite);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  filter:drop-shadow(0 0 4px var(--p-color,#e6c777));}
@keyframes particleBurst{
  0%{transform:translate(0,0) scale(1);opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(0.4);opacity:0;}
}
.status-badge{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:34px;height:34px;margin-left:-17px;pointer-events:none;animation:badgePop 0.9s ease forwards;
  background-color:var(--p-color,#e6c777);
  -webkit-mask-image:var(--p-sprite);mask-image:var(--p-sprite);
  -webkit-mask-size:contain;mask-size:contain;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
  -webkit-mask-position:center;mask-position:center;
  filter:drop-shadow(0 0 3px var(--p-color,#e6c777));}
@keyframes badgePop{ 0%{opacity:0;transform:translate(-50%,4px) scale(0.6);} 30%{opacity:1;transform:translate(-50%,-4px) scale(1.15);} 70%{opacity:1;transform:translate(-50%,-8px) scale(1);} 100%{opacity:0;transform:translate(-50%,-16px) scale(1);} }

.move-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0;}
.move-btn{background:transparent;border:1px solid var(--gold);color:var(--gold-bright);padding:10px 18px;font-family:'Cinzel',serif;font-size:11.5px;letter-spacing:0.08em;text-transform:uppercase;border-radius:3px;cursor:pointer;}
.move-btn:hover:not(:disabled){background:rgba(200,162,74,0.12);}
.move-btn:disabled{opacity:0.35;cursor:not-allowed;}

.battle-log{max-height:150px;overflow-y:auto;border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font-size:13px;color:var(--parchment-dim);text-align:left;}
.battle-log .entry{margin-bottom:5px;}
.battle-log .crit{color:var(--gold-bright);}
.battle-log .entry.burntick{color:var(--ember);font-style:italic;}
.battle-log .entry.stunskip{color:var(--moon);font-style:italic;}

.affinity-glow{border-radius:50%;filter:drop-shadow(0 0 26px var(--glow-color, transparent));}

/* ---------------- circles ---------------- */
.circle-banner{margin:0 auto;display:block;}
.circle-list-row{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--line);border-radius:3px;margin-bottom:8px;}
.circle-list-row .cinfo{flex:1;text-align:left;}
.circle-list-row .cname{font-family:'Cinzel',serif;font-size:14px;color:var(--parchment);}
.circle-list-row .cblurb{font-size:12.5px;color:var(--parchment-dim);font-style:italic;margin-top:2px;}
.circle-list-row .ccount{font-size:11px;color:var(--parchment-dim);margin-top:3px;letter-spacing:0.06em;text-transform:uppercase;}
.circle-list-row .ractions{display:flex;flex-direction:column;gap:6px;}
.circle-list-row .ractions button{padding:8px 12px;font-size:10.5px;white-space:nowrap;}
.role-badge{display:inline-block;font-family:'Cinzel',serif;font-size:9.5px;letter-spacing:0.1em;text-transform:uppercase;border-radius:20px;padding:3px 10px;}
.role-badge.high_priest, .role-badge.high_priestess{color:var(--ink);background:var(--gold-bright);}
.role-badge.magus{color:var(--gold-bright);border:1px solid var(--gold);}
.role-badge.initiate{color:var(--parchment-dim);border:1px solid var(--line);}
.roster-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;}
.roster-row .rname{font-size:14px;color:var(--parchment);}
.roster-row .ractions{display:flex;gap:6px;flex-wrap:wrap;}
.roster-row .ractions button{padding:6px 10px;font-size:10px;}
.request-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;}
.request-row .ractions button{padding:6px 10px;font-size:10px;}
.shape-pick-row{display:flex;gap:14px;justify-content:center;margin-bottom:22px;flex-wrap:wrap;}
.shape-pick{cursor:pointer;text-align:center;padding:10px;border:1px solid var(--line);border-radius:4px;width:80px;transition:border-color .15s;}
.shape-pick:hover{border-color:var(--gold);}
.shape-pick.selected{border-color:var(--gold-bright);box-shadow:0 0 0 1px var(--gold-bright);}
.affinity-pick-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:22px;}
.affinity-pick{cursor:pointer;text-align:center;padding:8px 4px;border:1px solid var(--line);border-radius:4px;width:74px;transition:border-color .15s;}
.affinity-pick:hover{border-color:var(--gold);}
.affinity-pick.selected{border-color:var(--gold-bright);box-shadow:0 0 0 1px var(--gold-bright);}
.affinity-pick .dot{width:20px;height:20px;border-radius:50%;margin:0 auto 6px;}
.affinity-pick .aname{font-size:10.5px;color:var(--parchment-dim);text-transform:capitalize;}
.cap-pick-row{display:flex;gap:10px;justify-content:center;margin-bottom:22px;}
.cap-pick{cursor:pointer;padding:10px 18px;border:1px solid var(--line);border-radius:3px;font-family:'Cinzel',serif;font-size:13px;color:var(--parchment);transition:border-color .15s;}
.cap-pick:hover{border-color:var(--gold);}
.cap-pick.selected{border-color:var(--gold-bright);background:rgba(200,162,74,0.08);color:var(--gold-bright);}
.section-label{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--parchment-dim);text-align:center;margin:0 0 12px;}
.msg-list{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:4px;}
.msg-row{margin-bottom:12px;text-align:left;}
.msg-row.mine{text-align:right;}
.msg-meta{font-size:10.5px;color:var(--parchment-dim);letter-spacing:0.04em;margin-bottom:2px;}
.msg-body{display:inline-block;background:rgba(200,162,74,0.08);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--parchment);max-width:85%;text-align:left;}
.msg-row.mine .msg-body{background:rgba(200,162,74,0.16);border-color:var(--gold);}

/* ---------------- altar ---------------- */
.altar-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0;}
.altar-plot{aspect-ratio:1;border:1px dashed var(--line);border-radius:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;font-size:10px;line-height:1.3;color:var(--parchment-dim);}
.altar-plot.empty.clickable{cursor:pointer;transition:border-color .15s;}
.altar-plot.empty.clickable:hover{border-color:var(--gold);}
.altar-plot.seed{border-style:solid;border-color:var(--line);background:rgba(122,148,87,0.14);}
.altar-plot.seed.ready{border-color:var(--gold-bright);cursor:pointer;color:var(--gold-bright);}
.altar-plot.decoration{border-style:solid;border-color:var(--gold);background:rgba(200,162,74,0.1);color:var(--parchment);}
.altar-picker{border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:16px;}
.altar-catalog-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:3px;margin-bottom:6px;}
.altar-catalog-row .aname{font-size:13.5px;color:var(--parchment);}
.altar-catalog-row .adesc{font-size:11.5px;color:var(--parchment-dim);font-style:italic;}
.altar-grid.palt{grid-template-columns:repeat(3,1fr);max-width:340px;margin-left:auto;margin-right:auto;}
.altar-plot .pickup-btn{margin-top:4px;padding:2px 6px;font-size:9px;}

footer.notice{text-align:center;color:var(--parchment-dim);font-size:12px;font-style:italic;margin-top:50px;opacity:0.65;}

async function loadSpeciesCatalog(){
  const { data, error } = await supabaseClient
    .from('species_catalog')
    .select('key, label, blurb, sort_order, active, egg_image_url, hatchling_image_url, fledged_image_url, ascendant_image_url, sovereign_image_url')
    .eq('active', true)
    .order('sort_order', { ascending: true });
  if(error){ console.error('species_catalog load failed', error); return; }
  if(!data || !data.length) return; // keep the DEFAULT_SPECIES fallback rather than showing an empty picker

  data.forEach(s => {
    art[s.key] = { egg: s.egg_image_url, hatchling: s.hatchling_image_url, fledged: s.fledged_image_url, ascendant: s.ascendant_image_url, sovereign: s.sovereign_image_url };

function imgFor(species, stage, size){
  size = size || 130;
  const override = SPECIES_ART[species] && SPECIES_ART[species][stage];
  if(override){
    return `<img src="${esc(override)}" alt="" style="max-width:${size}px;max-height:${size}px;width:auto;height:auto;object-fit:contain;display:block;margin:0 auto;">`;
  }
  if(BUNDLED_SPECIES_IDS.has(species)){
    return `<img src="familiar_${species}_${stage}.png" alt="" style="max-width:${size}px;max-height:${size}px;width:auto;height:auto;object-fit:contain;display:block;margin:0 auto;">`;
  }
  return `<div style="width:${size}px;height:${size}px;max-width:${size}px;display:flex;align-items:center;justify-content:center;margin:0 auto;border:1px dashed var(--line);border-radius:6px;color:var(--parchment-dim);font-size:11px;text-align:center;padding:4px;">No art set</div>`;
}

/* Battle-screen opponent portrait — same idea as imgFor() but for a
   Gauntlet/Campaign foe, which has no local bundled art at all. If the
   admin hasn't set an image_url for this opponent, fall back to an
   affinity-tinted placeholder circle (using the same hitColor() palette
   already used for hit-particle colors) instead of a blank box, so the
   battle screen always shows *something* on both sides. */
function opponentImgFor(url, affinity, size){
  size = size || 130;
  if(url){
    return `<img src="${esc(url)}" alt="" style="max-width:${size}px;max-height:${size}px;width:auto;height:auto;object-fit:contain;display:block;margin:0 auto;">`;
  }
  const tint = (typeof hitColor === 'function' ? hitColor(affinity) : '#8899aa');
  return `<div style="width:${Math.round(size*0.75)}px;height:${Math.round(size*0.75)}px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 35% 30%, ${tint}55, ${tint}22 60%, transparent 75%);border:1px solid ${tint}88;display:flex;align-items:center;justify-content:center;color:${tint};font-size:11px;text-align:center;padding:4px;">${esc(affinity||'')}</div>`;
}

async function loadCustomDeitiesIntoCatalog(){
  const { data: pantheonRows } = await supabaseClient.from('custom_pantheons').select('id, label').eq('active', true);
  (pantheonRows || []).forEach(row => { if(!CATALOG[row.id]) CATALOG[row.id] = { label: row.label, deities: [] }; });

  const { data: deityRows } = await supabaseClient.from('custom_deities').select('id, pantheon_id, name').eq('active', true);
  (deityRows || []).forEach(row => {
    const pantheon = CATALOG[row.pantheon_id];
    if(!pantheon) return;
    if(pantheon.deities.some(d => d[0] === row.id)) return;
    pantheon.deities.push([row.id, row.name]);
  });
}

let siteBackgrounds = {}; // page_key -> background_url
async function loadSiteBackgrounds(){
  const { data, error } = await supabaseClient.from('site_backgrounds').select('page_key, background_url');
  if(error){ console.error('site_backgrounds load failed', error); return; }
  (data || []).forEach(row => { if(row.background_url) siteBackgrounds[row.page_key] = row.background_url; });

// Applied to a screen's outer .card (or equivalent) so every screen can
// carry its own art instead of the flat card color. The gradient layers
// UNDER the image (declared first, painted last/on top per CSS's
// background-image stacking) so player-set art never fights with text
// legibility — same idea as the .card's own default gradient, just with
// a photo showing through it.
// extraStyle (optional) is any additional inline CSS a particular card
// already needed (e.g. "text-align:center;") — merged into the same
// style attribute rather than emitting two, since HTML doesn't allow
// duplicate attributes on one element.
function bgAttr(pageKey, extraStyle){
  const url = siteBackgrounds[pageKey];
  const bg = url ? `background-image:linear-gradient(180deg,rgba(23,19,31,0.55),rgba(16,14,22,0.82)),url('${esc(url)}');background-size:cover;background-position:center;` : '';
  const combined = (extraStyle || '') + bg;
  return combined ? ` style="${combined}"` : '';
}

  const url = siteBackgrounds[pageKey];

// ---------------- login (real accounts only — no more anonymous play) ----------------
// boot() is the very first thing this page does. Real login (Google or an
// emailed magic link) is required before anything else loads — no more
// "Enter the Gate" title screen, no more signInAnonymously() fallback,
// and no more "Claim this Seeker" upgrade-later flow, since every session
// already has a real identity from the moment a guardian can exist at
// all. gate.html keeps its own separate Google/email login for exactly
// this reason; this is the same pattern, just this page's own copy of it
// so this page never has to send anyone through gate.html to sign in.
async function boot(){
  if(SUPABASE_URL.indexOf('PASTE_YOUR') === 0){
    document.getElementById('app').innerHTML = '<div class="card"><p class="hint" style="margin:0;">Backend not configured yet.</p></div>';
    return;
  }
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  // Run alongside getSession() rather than after it — awaited together so
  // the very first paint (the login screen) already has its background,
  // instead of flashing plain and then filling in a moment later.
  const [{ data: { session: existing } }] = await Promise.all([
    supabaseClient.auth.getSession(),
    loadSiteBackgrounds().catch(e => console.error('site backgrounds load failed', e))
  ]);
  session = existing;
  // Always land on the login screen first, even with a valid persisted
  // session — a returning player gets a one-click "Continue" there rather
  // than the app silently skipping past it. (This is also where a
  // password-reset link's recovery session lands, so there's always
  // somewhere visible to notice you're signed in before anything else
  // happens.)
  renderLoginScreen();

  // Covers both redirect-back paths (Google OAuth and the magic-link
  // email) landing on a page load that already found no session above —
  // supabase-js resolves the token from the URL asynchronously, so this
  // fires afterward rather than being caught by the getSession() call.
  supabaseClient.auth.onAuthStateChange(async (_event, newSession) => {
    if(newSession && !session){
      session = newSession;
      await afterLogin();
    } else if(!newSession && session){
      session = null;
      guardian = null;
      petitionView = null; combatView = null; craftView = null; redeemView = null;
      expeditionView = null; pvpView = null; circleView = null; personalAltarView = null;
      profileView = null; shrineView = null; mailView = null; backpackView = null;
      checkinView = null; promoView = null; campaignView = null; guardianHomeView = null;
      shopView = null; profileReleaseConfirm = false; hallOfAncestors = null; hallOfAncestorsOpen = false;
      profilePasswordOpen = false;
      renderLoginScreen();
    }
  });
}

// A returning player with a still-valid session clicks through from the
// login screen's "Continue" rather than the page silently doing it for
// them — see boot()'s comment on why that screen always shows first now.
async function continueSession(){
  await afterLogin();
}

async function afterLogin(){
  document.body.classList.remove('login-screen');
  document.getElementById('app').innerHTML = '<div class="card"><p class="hint" style="margin:0;text-align:center;">Finding your way through the Gate…</p></div>';
  await loadCustomDeitiesIntoCatalog().catch(e => console.error('custom deities fold-in failed', e));
  await loadSpeciesCatalog().catch(e => console.error('species catalog load failed', e));
  loadSeasonInfo().catch(e => console.error('season pool load failed', e));
  await loadGuardian();
  if(guardian) await loadMarks();
  loadMoonPhase().catch(e => console.error('moon phase load failed', e));
  // For-sale flags need to be known site-wide, not just inside the Shop —
  // Petition Hall and Redeem both filter on them (see renderPetitionPicker/
  // renderRedeem) and can be reached without ever opening the Shop first.
  loadShopCatalog().then(() => { if(petitionView || redeemView) render(); }).catch(e => console.error('shop catalog preload failed', e));
  render();

  // Stripe lands back here now (create-checkout's success_url/cancel_url
  // point at this page, not gate.html) — land on the Shop with the
  // result instead of just the bare map.
  const params = new URLSearchParams(window.location.search);
  const checkoutResult = params.get('checkout');
  if(checkoutResult && guardian){
    window.history.replaceState({}, '', window.location.pathname);
    await openShop();
    shopStatusMsg = checkoutResult === 'success' ? 'Payment received — your unlock should be active now.' : 'Checkout cancelled — nothing was charged.';
    render();
  }
}

function renderLoginScreen(){
  document.body.classList.add('login-screen');
  const app = document.getElementById('app');
  const bg = bgAttrPlain('login');

  // A still-valid session gets a one-click way through instead of the
  // full sign-in form — see boot()'s comment on why this screen always
  // shows first now.
  if(session){
    app.innerHTML = `
      <div class="login-screen-wrap"${bg}>
        <div class="login-card">
          <h1>The Long Silence</h1>
          <p class="hint">Welcome back, ${esc(session.user.email || 'traveler')}.</p>
          <button onclick="continueSession()">Continue</button>
          <button class="secondary" style="margin-top:12px;" onclick="signOutOfGate()">Sign in as someone else</button>
        </div>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <div class="login-screen-wrap"${bg}>
      <div class="login-card">
        <h1>The Long Silence</h1>
        <p class="hint">Somewhere past the Gate, an egg is waiting for a keeper. Sign in to claim it.</p>
        <button onclick="loginWithGoogle()">Sign in with Google</button>
        <div class="login-divider">or</div>
        <input type="email" id="loginEmail" placeholder="you@example.com">
        <input type="password" id="loginPassword" placeholder="Password (leave blank to use a sign-in link instead)">
        <button class="secondary" onclick="loginWithPassword()">Sign in with password</button>
        <button class="secondary" style="margin-top:10px;" onclick="loginWithMagicLink()">Email me a sign-in link</button>
        <div class="login-divider">new here?</div>
        <button class="secondary" onclick="loginWithSignup()">Create an account with a password</button>
        <div class="status" id="loginStatus"></div>
        <p class="hint" style="margin-top:14px;margin-bottom:0;"><a href="#" onclick="forgotPassword();return false;" style="color:inherit;text-decoration:underline;">Forgot your password?</a></p>
      </div>
    </div>
  `;
}

async function loginWithGoogle(){
  await supabaseClient.auth.signInWithOAuth({
    provider: 'google',

}

async function loginWithMagicLink(){
  const email = document.getElementById('loginEmail').value.trim();
  const status = document.getElementById('loginStatus');
  if(!email){ status.className = 'status err'; status.textContent = 'Enter an email first.'; return; }
  status.className = 'status';
  status.textContent = 'Sending…';
  const { error } = await supabaseClient.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  status.className = error ? 'status err' : 'status ok';
  status.textContent = error ? error.message : 'Check your email for a sign-in link.';
}

async function loginWithPassword(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const status = document.getElementById('loginStatus');
  if(!email || !password){ status.className = 'status err'; status.textContent = 'Enter both email and password.'; return; }
  status.className = 'status';
  status.textContent = 'Signing in…';
  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
  if(error){ status.className = 'status err'; status.textContent = error.message; return; }
  session = data.session;
  await afterLogin();
}

// Email/password sign-up — a second account-creation path alongside
// Google and the magic link, for anyone who'd rather set a password up
// front. Requires the Email provider's password sign-in to be turned on
// in the Supabase Dashboard (Authentication → Providers → Email).
async function loginWithSignup(){
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  const status = document.getElementById('loginStatus');
  if(!email || !password){ status.className = 'status err'; status.textContent = 'Enter both an email and a password first.'; return; }
  if(password.length < 6){ status.className = 'status err'; status.textContent = 'Password needs to be at least 6 characters.'; return; }
  status.className = 'status';
  status.textContent = 'Creating your account…';
  const { data, error } = await supabaseClient.auth.signUp({
    email, password,
    options: { emailRedirectTo: window.location.origin + window.location.pathname }
  });
  if(error){ status.className = 'status err'; status.textContent = error.message; return; }
  if(data.session){
    session = data.session;
    await afterLogin();
  } else {
    status.className = 'status ok';
    status.textContent = 'Account created — check your email to confirm it, then sign in with your password.';
  }
}

async function forgotPassword(){
  const email = document.getElementById('loginEmail').value.trim();
  const status = document.getElementById('loginStatus');
  if(!email){ status.className = 'status err'; status.textContent = 'Enter your email above first.'; return; }
  status.className = 'status';
  status.textContent = 'Sending a reset link…';
  const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname
  });
  status.className = error ? 'status err' : 'status ok';
  status.textContent = error ? error.message : 'Check your email for a password reset link — it signs you in, then set a new password from your Profile.';
}

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

const CHECKIN_CURRENCY_LABELS = { essence: 'Essence', favor: 'Favor', god_shards: 'God Shards', god_tokens: 'God Tokens', key_of_night: 'Key of Night', petition_credits: 'Petition Credits' };

async function tendGuardian(){
  // tend_guardian is the once-a-day Check-in mechanic (streak +
  // calendar-reward, admin-configurable via daily_checkin_rewards) —
  // unrelated now to Bond, which grows through the separate, repeatable
  // doTendBond() below. Kept as its own function/RPC name since the SQL
  // side never changed, only which screen calls it.
  const status = document.getElementById('checkinStatus');
  if(status){ status.className = 'status'; status.textContent = 'Checking in…'; }
  const { data, error } = await supabaseClient.rpc('tend_guardian', { p_guardian_id: guardian.id });
  if(error){
    if(status){ status.className = 'status err'; status.textContent = 'Failed: ' + error.message; }
    return;
  }
  if(!data || !data.tended){
    if(status){ status.className = 'status'; status.textContent = 'Already checked in today — come back tomorrow.'; }
    return;
  }
  await loadGuardian(); // refetches every currency field fresh rather than guessing which ones the reward touched
  render();
  const s2 = document.getElementById('checkinStatus');
  if(s2){
    s2.className = 'status ok';
    const gainParts = (data.rewards || []).filter(r => r.amount > 0).map(r => `+${r.amount} ${CHECKIN_CURRENCY_LABELS[r.currency] || r.currency}`);
    const milestoneLabels = (data.rewards || []).filter(r => r.label && r.label !== 'Daily tending').map(r => r.label);
    let msg = `Checked in. ${gainParts.join(', ') || 'Streak continues.'} — ${data.streak} day streak.`;
    if(milestoneLabels.length) msg += ' ' + milestoneLabels.join(', ') + '!';
    s2.textContent = msg;
  }
}

async function doTendBond(){
  // The frequent, low-stakes counterpart to Check-in: +1 Bond on a
  // 5-minute cooldown (tend_bond, migration 0041) instead of a once-a-day
  // gate — addressing "tending... should not be so horribly strict on how
  // many times one can tend their familiar."
  const status = document.getElementById('bondStatus');
  if(status){ status.className = 'status'; status.textContent = 'Spending a moment together…'; }
  const { data, error } = await supabaseClient.rpc('tend_bond', { p_guardian_id: guardian.id });
  if(error){
    if(status){ status.className = 'status err'; status.textContent = 'Failed: ' + error.message; }
    return;
  }
  if(!data || !data.tended){
    const secs = (data && data.secondsLeft) || 0;
    const mins = Math.max(1, Math.ceil(secs / 60));
    if(status){ status.className = 'status'; status.textContent = `Give it a little longer — about ${mins} minute${mins === 1 ? '' : 's'} left.`; }
    return;
  }
  await loadGuardian();
  render();
  const s2 = document.getElementById('bondStatus');
  if(s2){ s2.className = 'status ok'; s2.textContent = 'Bond deepens.'; }
}

async function loadProfileMessageStatus(){

    supabaseClient.from('pricing_settings').select('included_messages_per_month').eq('id', 1).maybeSingle(),
    supabaseClient.from('message_usage').select('count').eq('user_id', session.user.id).eq('period', period).maybeSingle(),
    supabaseClient.from('profiles').select('bonus_messages').eq('id', session.user.id).maybeSingle()
  ]);
  profileMessageStatus = {
    includedPerMonth: priceRow ? (priceRow.included_messages_per_month || 0) : 0,
    usedThisMonth: usageRow ? usageRow.count : 0,
    bonusMessages: profileRow ? (profileRow.bonus_messages || 0) : 0

// Same "included_messages_per_month <= 0 means unlimited" convention as
// gate.html's own messagesRemainingLabel().
function profileMessagesRemainingLabel(){
  if(!profileMessageStatus) return 'Loading…';
  if(!profileMessageStatus.includedPerMonth || profileMessageStatus.includedPerMonth <= 0){
    return profileMessageStatus.bonusMessages > 0 ? ('Unlimited + ' + profileMessageStatus.bonusMessages + ' bonus') : 'Unlimited';
  }
  const includedLeft = Math.max(0, profileMessageStatus.includedPerMonth - profileMessageStatus.usedThisMonth);
  const total = includedLeft + profileMessageStatus.bonusMessages;
  return total + ' message' + (total === 1 ? '' : 's') + ' left this month';
}

async function savePassword(){
  const pw = document.getElementById('newPassword').value;
  const confirmPw = document.getElementById('newPasswordConfirm').value;
  const status = document.getElementById('passwordStatus');
  if(!pw || pw.length < 6){ status.className = 'status err'; status.textContent = 'Password needs to be at least 6 characters.'; return; }
  if(pw !== confirmPw){ status.className = 'status err'; status.textContent = "Passwords don't match."; return; }
  status.className = 'status';
  status.textContent = 'Saving…';
  const { error } = await supabaseClient.auth.updateUser({ password: pw });
  if(error){ status.className = 'status err'; status.textContent = error.message; return; }
  status.className = 'status ok';
  status.textContent = 'Password saved — you can sign in with it next time.';
}

/* ---------------- shrine (Map hub's "Temple of the Gods" hotspot) ----------------
   Read-only list of deities the player is actually entitled to chat with
   — via the same entitlements table redeem/gate.html already use, NOT
   guardian_marks (a full mark and chat access are two separate systems).
   "Available at the Temple" happens by redeeming a God Token at Chained
   Gods, buying access, or a subscription — not by petitioning. Each row
   also shows whether that deity's blessing (deity_blessings, applied
   automatically on a full mark) has actually landed, and links out to
   gate.html — now deep-link-aware — to actually talk to them. */

async function loadShrineEntitlements(){
  const { data, error } = await supabaseClient
    .from('entitlements')
    .select('scope_type, scope_id, expires_at')
    .eq('user_id', session.user.id);
  if(error){ console.error('entitlements load failed', error); shrineEntitlements = []; return; }
  shrineEntitlements = data || [];
}

function isDeityUnlocked(pantheonId, deityId){
  const now = Date.now();
  return shrineEntitlements.some(e => {
    if(e.expires_at && new Date(e.expires_at).getTime() <= now) return false;
    if(e.scope_type === 'all') return true;
    if(e.scope_type === 'pantheon') return e.scope_id === pantheonId;
    if(e.scope_type === 'deity') return e.scope_id === deityId;
    return false;
  });
}

function renderShrine(){
  const app = document.getElementById('app');
  const groups = Object.keys(CATALOG).map(pid => {
    const unlocked = CATALOG[pid].deities.filter(([id]) => isDeityUnlocked(pid, id));
    if(!unlocked.length) return '';
    const rows = unlocked.map(([id, name]) => {
      const m = markFor(pid, id);
      const blessed = m && m.mark_type === 'full';
      const badge = blessed ? `<span class="mark-badge full">blessing received</span>` : `<span class="mark-badge">no blessing yet</span>`;
      return `<div class="deity-row" style="cursor:default;">
        <span class="name">${esc(name)}</span>
        <div style="display:flex;align-items:center;gap:8px;">
          ${badge}
          <a class="secondary" style="padding:4px 10px;font-size:11px;text-decoration:none;display:inline-block;" href="gate.html?pantheon=${encodeURIComponent(pid)}&deity=${encodeURIComponent(id)}">Chat</a>
        </div>
      </div>`;
    }).join('');
    return `<div class="pantheon-group"><h3>${esc(CATALOG[pid].label)}</h3>${rows}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="card"${bgAttr('shrine')}>
      <h2 style="text-align:center;">The Temple of the Gods</h2>
      <p class="hint" style="text-align:center;">${groups
        ? 'Every god who has granted you an audience — chat any time, and see whether their blessing has found your guardian yet.'
        : 'No gods have granted you an audience yet. Unlock one through the Gate, or redeem a God Token at Chained Gods.'}</p>
      ${groups}
      <button class="secondary" style="margin-top:10px;" onclick="backFromShrine()">Back to the map</button>
    </div>
  `;
}

function renderBackpack(){
  const app = document.getElementById('app');

  const craftRows = craftInventory.map(it => {
    const catalogItem = craftCatalog.find(c => c.key === it.item_key);

    return `<div class="roster-row"><div><div class="rname">${esc(name)}</div><div class="cblurb">${it.consumed_at ? 'Used/Applied' : 'Held'}</div></div></div>`;
  }).join('') || '<p class="hint">No crafted items yet.</p>';

  const arenaRows = arenaInventory.map(it => {

    const owned = new Set(a.fragmentsOwned || []);
    const complete = owned.size >= a.total_fragments;
    return `<div class="roster-row"><div><div class="rname">${esc(a.name)}</div><div class="cblurb">${complete ? 'Complete' : owned.size + '/' + a.total_fragments + ' fragments'}</div></div></div>`;
  }).join('') || '<p class="hint">No artifact fragments found yet.</p>';

  const backpackBg = bgAttr('backpack');
  app.innerHTML = `
    <div class="card"${backpackBg}>
      <h2 style="text-align:center;">Backpack</h2>
      <p class="hint" style="text-align:center;">Everything your guardian is holding, in one place. Use or manage items from their home screens — Crafting, the Arena, Expeditions.</p>
    </div>
    <div class="card"${backpackBg}><h2>Crafted Items</h2>${craftRows}<button class="secondary" style="margin-top:10px;" onclick="openCraft()">Go to Crafting</button></div>
    <div class="card"${backpackBg}><h2>Arena Items</h2>${arenaRows}<button class="secondary" style="margin-top:10px;" onclick="openPvpArena()">Go to the Arena</button></div>
    <div class="card"${backpackBg}><h2>Artifact Fragments</h2>${artifactRows}<button class="secondary" style="margin-top:10px;" onclick="openExpedition()">Go to Expeditions</button></div>
    <div class="card"${backpackBg}><button class="secondary" onclick="backFromBackpack()">Back to the map</button></div>
  `;
}

/* ---------------- promo (Map hub's "Promo" hotspot, separate from Mail) ----------------
   promo_events (0024) is admin-only at the RLS level by design — events
   are auto-granted, not claimed. list_visible_promo_events() (0041) is a
   SECURITY DEFINER read exposing non-draft events, so this screen has

   collect (there's nothing to collect — it's already been granted). */

async function openPromo(){
  promoView = { step: 'home' };
  render();
  await loadPromoEvents();
  if(promoView) render();
}

function backFromPromo(){
  promoView = null;
  render();

async function loadPromoEvents(){
  if(!currencyDefs.length){
    const { data, error } = await supabaseClient.from('currency_definitions').select('key, name, icon');
    if(!error) currencyDefs = data || [];
  }
  const { data, error } = await supabaseClient.rpc('list_visible_promo_events');
  if(error){ console.error('promo events load failed', error); promoEvents = []; return; }
  promoEvents = data || [];
}

function renderPromo(){
  const app = document.getElementById('app');
  const rows = promoEvents.map(e => {
    const cur = currencyDefs.find(c => c.key === e.currency_key);
    const curLabel = cur ? `${cur.icon || ''} ${cur.name}`.trim() : e.currency_key;
    const when = e.starts_at ? new Date(e.starts_at).toLocaleDateString() : '';

      <div><div class="rname">${esc(e.name)}${e.status === 'ended' ? ' (ended)' : ''}</div>

    <div class="card"${bgAttr('promo')}>

      ${rows}
      <button class="secondary" style="margin-top:14px;" onclick="backFromPromo()">Back to the map</button>
    </div>
  `;
}

/* ---------------- shop (opened from Profile — real-money purchasing) ----------------
   Pantheons, individual gods, the flat subscription, named subscription
   tiers, and message packs. Calls the exact same create-checkout edge
   function gate.html's Shop/paywall buttons always have, with the exact
   same {type, scopeId} body — this only had to be a new frontend for it,
   not a new backend. "Already unlocked" reuses shrineEntitlements/
   isDeityUnlocked (Shrine already loads and maintains that). */

function shopFmtUsd(cents){ return '$' + (cents / 100).toFixed(2); }
// Admin-set image_url (0043) — plain URL, no validation, same convention
// as custom_deities.portrait_url. Empty string when unset so callers can
// just splice it into a template without an extra null check.
function shopThumb(url){
  return url ? `<img src="${esc(url)}" alt="" style="width:36px;height:36px;object-fit:cover;border-radius:4px;border:1px solid var(--line);flex-shrink:0;">` : '';
}
// Circle/Personal Altar grid tiles are small and the label text sits
// directly on them, so an image goes on as a background (with a dark
// overlay for legibility) rather than an inline thumbnail like shopThumb().
function altarPlotStyle(url){
  return url ? ` style="background-image:linear-gradient(rgba(16,14,22,0.45),rgba(16,14,22,0.72)),url('${esc(url)}');background-size:cover;background-position:center;"` : '';
}
function shopIsFree(deityId){ const s = shopDeitySettings[deityId]; return s ? s.is_free : false; }
function shopDeityForSale(deityId){ const s = shopDeitySettings[deityId]; return s ? s.for_sale : true; }
function shopPantheonForSale(pid){ const s = shopPantheonSettings[pid]; return s ? s.for_sale : true; }
function shopDeityPrice(deityId){ const s = shopDeitySettings[deityId]; return (s && s.price_cents != null) ? s.price_cents : shopPricing.deity; }
function shopPantheonPrice(pid){ const s = shopPantheonSettings[pid]; return (s && s.price_cents != null) ? s.price_cents : shopPricing.pantheon; }

function shopIsAgeRestricted(pantheonId, deityId){
  const ds = deityId ? shopDeitySettings[deityId] : null;
  const ps = shopPantheonSettings[pantheonId];
  return !!(ds && ds.age_restricted) || !!(ps && ps.age_restricted);
}
function shopAgeWarningText(pantheonId, deityId){
  const ds = deityId ? shopDeitySettings[deityId] : null;
  const ps = shopPantheonSettings[pantheonId];
  if(ds && ds.age_restricted && ds.age_warning) return ds.age_warning;
  if(ps && ps.age_restricted && ps.age_warning) return ps.age_warning;
  return 'This content is intended for mature audiences.';
}
// Same localStorage keys as gate.html's own age gate, deliberately — a
// warning cleared on one page stays cleared on the other.
function shopAgeVerified(){ return localStorage.getItem('pg_age_verified') === 'true'; }
function shopAgeWarnedKey(id){ return 'pg_age_warned_' + id; }
function shopAgeWarned(id){ return localStorage.getItem(shopAgeWarnedKey(id)) === 'true'; }

async function openShop(){
  shopView = { step: 'browse' };
  shopStatusMsg = '';
  shopDeitySearch = '';
  render();
  await Promise.all([loadShopCatalog(), loadShrineEntitlements()]);
  if(shopView) render();
}

function backFromShop(){
  shopView = null;
  render();
}

async function loadShopCatalog(){
  const [{ data: priceRow }, { data: deityRows }, { data: pantheonRows }, { data: items, error: itemsErr }, { data: tiers, error: tiersErr }] = await Promise.all([
    supabaseClient.from('pricing_settings').select('deity_price_cents, pantheon_price_cents, subscription_price_cents, included_messages_per_month, message_pack_size, message_pack_price_cents').eq('id', 1).maybeSingle(),
    supabaseClient.from('deity_settings').select('deity_id, price_cents, is_free, for_sale, age_restricted, age_warning'),
    supabaseClient.from('pantheon_settings').select('pantheon_id, price_cents, for_sale, age_restricted, age_warning'),
    supabaseClient.from('store_items').select('id, name, description, price_cents, image_url').eq('active', true).order('sort_order', { ascending: true }),
    supabaseClient.from('subscription_tiers').select('id, name, description, price_cents, image_url').eq('active', true).order('sort_order', { ascending: true })
  ]);
  if(priceRow){
    shopPricing = {
      deity: priceRow.deity_price_cents, pantheon: priceRow.pantheon_price_cents, subscription: priceRow.subscription_price_cents,
      includedPerMonth: priceRow.included_messages_per_month, packSize: priceRow.message_pack_size, packPrice: priceRow.message_pack_price_cents
    };
  }
  shopDeitySettings = {};
  (deityRows || []).forEach(r => { shopDeitySettings[r.deity_id] = r; });
  shopPantheonSettings = {};
  (pantheonRows || []).forEach(r => { shopPantheonSettings[r.pantheon_id] = r; });
  if(itemsErr) console.error('store_items fetch failed', itemsErr);
  if(tiersErr) console.error('subscription_tiers fetch failed', tiersErr);
  shopStoreItems = items || [];
  shopSubscriptionTiers = tiers || [];
}

function renderShop(){
  if(shopView.step === 'ageGate') return renderShopAgeGate();
  return renderShopBrowse();
}

function shopBuyPantheon(pid, label){
  if(shopIsAgeRestricted(pid, null) && !(shopAgeVerified() && shopAgeWarned(pid))){
    shopView = { step: 'ageGate', pending: { type: 'pantheon', scopeId: pid, label, pantheonId: pid, deityId: null, warningText: shopAgeWarningText(pid, null) } };
    render();
    return;
  }
  shopStartCheckout('pantheon', pid);
}

function shopBuyDeity(deityId, label, pantheonId){
  if(shopIsAgeRestricted(pantheonId, deityId) && !(shopAgeVerified() && shopAgeWarned(deityId))){
    shopView = { step: 'ageGate', pending: { type: 'deity', scopeId: deityId, label, pantheonId, deityId, warningText: shopAgeWarningText(pantheonId, deityId) } };
    render();
    return;
  }
  shopStartCheckout('deity', deityId);
}

function renderShopAgeGate(){
  const app = document.getElementById('app');
  const v = shopView.pending;
  const needsBirthdate = !shopAgeVerified();
  app.innerHTML = `
    <div class="card"${bgAttr('shop', 'text-align:center;')}>
      <h2>Age restricted</h2>
      <p class="hint">${esc(v.label)}: ${esc(v.warningText)}</p>
      ${needsBirthdate ? `<input type="date" id="shopAgeBirthdate" style="max-width:220px;">` : ''}
      <div class="status" id="shopAgeGateStatus"></div>
      <button onclick="confirmShopAgeGate()">I confirm I am 18 or older</button>
      <button class="secondary" style="margin-top:10px;" onclick="cancelShopAgeGate()">Cancel</button>
    </div>
  `;
}

function cancelShopAgeGate(){
  shopView = { step: 'browse' };
  render();
}

function confirmShopAgeGate(){
  const status = document.getElementById('shopAgeGateStatus');
  const pending = shopView.pending;
  if(!shopAgeVerified()){
    const val = document.getElementById('shopAgeBirthdate').value;
    if(!val){ status.className = 'status err'; status.textContent = 'Enter your birthdate to continue.'; return; }
    const today = new Date();
    const birthdate = new Date(val);
    let age = today.getFullYear() - birthdate.getFullYear();
    const m = today.getMonth() - birthdate.getMonth();
    if(m < 0 || (m === 0 && today.getDate() < birthdate.getDate())) age--;
    if(age < 18){ status.className = 'status err'; status.textContent = 'You must be 18 or older to view this content.'; return; }
    localStorage.setItem('pg_age_verified', 'true');
  }
  localStorage.setItem(shopAgeWarnedKey(pending.deityId || pending.pantheonId), 'true');
  shopStartCheckout(pending.type, pending.scopeId);
}

async function shopStartCheckout(type, scopeId){
  const status = document.getElementById('shopAgeGateStatus') || document.getElementById('shopStatus');
  if(status){ status.className = 'status'; status.textContent = 'Opening checkout…'; }
  try{
    const resp = await fetch(FUNCTIONS_URL + '/create-checkout', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ type, scopeId })
    });
    const data = await resp.json();
    if(data.ok && data.url){
      window.location.href = data.url;
    } else if(status){
      status.className = 'status err';
      status.textContent = data.error || 'Could not start checkout.';
    }
  }catch(e){
    if(status){ status.className = 'status err'; status.textContent = 'Could not reach checkout: ' + e.message; }
  }
}

function filterShopDeities(val){
  shopDeitySearch = val;
  renderShopBrowse();
}

function renderShopBrowse(){
  const app = document.getElementById('app');
  const search = shopDeitySearch.trim().toLowerCase();

  const tierRows = shopSubscriptionTiers.map(t => `
    <div class="roster-row">
      <div style="display:flex;align-items:center;gap:8px;">${shopThumb(t.image_url)}<div><div class="rname">${esc(t.name)} — ${shopFmtUsd(t.price_cents)}/mo</div>
      <div class="cblurb">${esc(t.description || '')}</div></div></div>
      <button class="secondary" onclick="shopStartCheckout('tier','${esc(t.id)}')">Subscribe</button>
    </div>`).join('');

  const packRows = shopStoreItems.map(i => `
    <div class="roster-row">
      <div style="display:flex;align-items:center;gap:8px;">${shopThumb(i.image_url)}<div><div class="rname">${esc(i.name)} — ${shopFmtUsd(i.price_cents)}</div>
      <div class="cblurb">${esc(i.description || '')}</div></div></div>
      <button class="secondary" onclick="shopStartCheckout('store_item','${esc(i.id)}')">Buy</button>
    </div>`).join('');

  const pantheonRows = Object.keys(CATALOG).map(pid => {
    const owned = shrineEntitlements.some(e => (e.scope_type === 'all') || (e.scope_type === 'pantheon' && e.scope_id === pid));
    if(owned || !shopPantheonForSale(pid)) return '';
    const label = CATALOG[pid].label;
    return `<div class="roster-row">
      <div><div class="rname">${esc(label)}</div>
      <div class="cblurb">Unlocks every god in this pantheon at once.</div></div>
      <button class="secondary" onclick="shopBuyPantheon('${esc(pid)}','${esc(label)}')">${shopFmtUsd(shopPantheonPrice(pid))}</button>
    </div>`;
  }).join('') || '<p class="hint">Every pantheon is already unlocked.</p>';

  const deityRows = Object.keys(CATALOG).flatMap(pid => CATALOG[pid].deities
    .filter(([id, name]) => !search || name.toLowerCase().includes(search))
    .filter(([id]) => !isDeityUnlocked(pid, id))
    .filter(([id]) => shopIsFree(id) === false && shopDeityForSale(id) !== false)
    .map(([id, name]) => `<div class="roster-row">
      <div><div class="rname">${esc(name)}</div><div class="cblurb">${esc(CATALOG[pid].label)}</div></div>
      <button class="secondary" onclick="shopBuyDeity('${esc(id)}','${esc(name)}','${esc(pid)}')">${shopFmtUsd(shopDeityPrice(id))}</button>
    </div>`)
  ).join('') || '<p class="hint">No matching gods — everything shown is already unlocked, free, or not currently for sale.</p>';

  app.innerHTML = `
    <div class="card"${bgAttr('shop')}>
      <h2 style="text-align:center;">Shop</h2>
      <div class="status" id="shopStatus">${esc(shopStatusMsg)}</div>
      ${tierRows ? `<h3>Subscriptions</h3>${tierRows}` : ''}
      <div class="roster-row">
        <div><div class="rname">Full site access — ${shopFmtUsd(shopPricing.subscription)}/mo</div>
        <div class="cblurb">Every pantheon, every god, for as long as it's active.</div></div>
        <button class="secondary" onclick="shopStartCheckout('all', null)">Subscribe</button>
      </div>
      <div class="roster-row">
        <div><div class="rname">Message pack — ${shopPricing.packSize} messages — ${shopFmtUsd(shopPricing.packPrice)}</div>
        <div class="cblurb">Bonus messages that never expire, on top of whatever's included monthly.</div></div>
        <button class="secondary" onclick="shopStartCheckout('messages', null)">Buy</button>
      </div>
      ${packRows}

      <h3 style="margin-top:22px;">Pantheons</h3>
      ${pantheonRows}

      <h3 style="margin-top:22px;">Individual gods</h3>
      <input type="text" placeholder="Search by name…" value="${esc(shopDeitySearch)}" oninput="filterShopDeities(this.value)">
      <div style="max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:4px;padding:10px;">${deityRows}</div>

      <button class="secondary" style="margin-top:18px;" onclick="backFromShop()">Back to the map</button>
    </div>
  `;
}

/* ---------------- campaign (Map hub's "The Divine Realms" title hotspot, Phase 4) ----------------
   Chapters made of encounters — combat (reuses the existing Gauntlet
   battle engine via combatView, tagged with source:'campaign', see the
   edits near renderLoadoutPicker/startBattle/renderBattleResult below)
   or narrative (a simple choice screen, same shape as Expeditions).
   Level gates which chapters are open; clearing an encounter — first
   time or a grind replay — feeds XP back into that same level. */

async function openCampaign(){
  campaignView = { step: 'browse' };
  campaignMsg = '';
  render();
  await loadCampaignData();
  if(campaignView) render();
}

function backFromCampaign(){
  campaignView = null;
  campaignData = null;
  campaignMsg = '';
  render();
}

async function loadCampaignData(){
  try{
    const resp = await fetch(FUNCTIONS_URL + '/campaign', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'list', guardianId: guardian.id })
    });
    const data = await resp.json();
    if(!data.ok){ console.error('campaign list load failed', data.error); return; }
    campaignData = data;
  }catch(e){ console.error('campaign list load failed', e); }
}

function renderCampaign(){
  if(campaignView.step === 'browse') return renderCampaignBrowse();
  if(campaignView.step === 'choice') return renderCampaignChoice();
  if(campaignView.step === 'choiceResult') return renderCampaignChoiceResult();
}

function renderCampaignBrowse(){
  const app = document.getElementById('app');
  if(!campaignData){
    app.innerHTML = `<div class="card"${bgAttr('campaign', 'text-align:center;')}><h2>The Divine Realms</h2><p class="hint">Loading…</p></div>`;
    return;
  }
  // Locked chapters are fully hidden, not just greyed out — clear/level
  // up to reveal the next one.
  const chapters = campaignData.chapters.filter(c => c.unlocked).map(c => {
    const rows = c.encounters.map(e => {
      const icon = e.encounterType === 'combat' ? '⚔️' : '📜';
      const statusBadge = e.cleared ? `<span class="mark-badge full">cleared ×${e.clearCount}</span>` : `<span class="mark-badge">new</span>`;
      const xpNote = e.cleared ? `+${e.replayXpReward} XP replay` : `+${e.xpReward} XP`;
      const actionLabel = e.encounterType === 'combat' ? 'Fight' : 'Choose';
      const onclick = e.encounterType === 'combat'
        ? `selectCampaignEncounter('${esc(e.key)}','${esc(e.name)}')`
        : `openCampaignChoice('${esc(e.key)}')`;
      return `<div class="roster-row">
        <div><div class="rname">${icon} ${esc(e.name)}${e.encounterType === 'combat' && e.creatureName ? ' — ' + esc(e.creatureName) : ''}</div>
        <div class="cblurb">${esc(e.description || '')} — ${esc(xpNote)}${e.hasReward && !e.cleared ? ' + a reward' : ''}</div></div>
        <div class="ractions">${statusBadge}<button class="secondary" onclick="${onclick}">${actionLabel}</button></div>
      </div>`;
    }).join('') || '<p class="hint">Nothing here yet.</p>';
    return `<div class="pantheon-group"><h3>${esc(c.name)}</h3><p class="hint" style="margin:-4px 0 8px;">${esc(c.description || '')}</p>${rows}</div>`;
  }).join('') || '<p class="hint">No chapters yet — check back soon.</p>';

  const campaignBg = bgAttr('campaign', 'text-align:center;');
  app.innerHTML = `
    <div class="card"${campaignBg}>
      <h2>The Divine Realms</h2>
      <div class="essence-row"><span class="essence-label">Level</span><span class="essence-value">${campaignData.level}</span></div>
      <p class="hint">${campaignData.xp} XP earned</p>
      ${campaignMsg ? `<p class="status ok" style="display:block;">${esc(campaignMsg)}</p>` : ''}
    </div>
    <div class="card"${bgAttr('campaign')}>
      ${chapters}
      <button class="secondary" style="margin-top:10px;" onclick="backFromCampaign()">Back to the map</button>
    </div>
  `;
}

function selectCampaignEncounter(encounterKey, encounterName){
  combatView = { step: 'loadout', source: 'campaign', encounterKey, encounterName };
  loadoutPicks = [];
  render();
}

function openCampaignChoice(encounterKey){
  const encounter = campaignData.chapters.flatMap(c => c.encounters).find(e => e.key === encounterKey);
  if(!encounter) return;
  campaignView = { step: 'choice', encounterKey, name: encounter.name, prompt: encounter.prompt, choices: encounter.choices || [] };
  render();
}

function renderCampaignChoice(){
  const app = document.getElementById('app');
  const v = campaignView;
  const buttons = v.choices.map((c, i) => `<button class="secondary" style="margin:4px 0;display:block;width:100%;" onclick="submitCampaignChoice(${i})">${esc(c)}</button>`).join('');
  app.innerHTML = `
    <div class="card"${bgAttr('campaign')}>
      <h2 style="text-align:center;">${esc(v.name)}</h2>
      <p class="challenge-text">${esc(v.prompt)}</p>
      <div style="max-width:420px;margin:0 auto;">${buttons}</div>
      <div class="status" id="campaignChoiceStatus"></div>
      <button class="secondary" style="margin-top:14px;" onclick="backFromCampaignChoice()">Back</button>
    </div>
  `;
}

function backFromCampaignChoice(){
  campaignView = { step: 'browse' };
  render();
}

async function submitCampaignChoice(choiceIndex){
  const status = document.getElementById('campaignChoiceStatus');
  if(status){ status.className = 'status'; status.textContent = 'Deciding…'; }
  try{
    const resp = await fetch(FUNCTIONS_URL + '/campaign', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'resolve-encounter', guardianId: guardian.id, encounterKey: campaignView.encounterKey, choiceIndex })
    });
    const data = await resp.json();
    if(!data.ok){ if(status){ status.className = 'status err'; status.textContent = data.error || 'Could not resolve that.'; } return; }
    campaignView = { step: 'choiceResult', correct: data.correct, correctIndex: data.correctIndex, choices: campaignView.choices, xpSummary: campaignXpSummary(data) };
    if(data.correct) await loadGuardian();
    render();
  }catch(e){
    if(status){ status.className = 'status err'; status.textContent = 'Could not reach the relay: ' + e.message; }
  }
}

function renderCampaignChoiceResult(){
  const app = document.getElementById('app');
  const v = campaignView;
  app.innerHTML = `
    <div class="card verdict-card"${bgAttr('campaign')}>
      <div class="verdict-badge ${v.correct ? 'full' : 'partial'}">${v.correct ? 'Correct' : 'Not quite'}</div>
      ${v.correct ? `<p class="verdict-text">${esc(v.xpSummary)}</p>` : `<p class="verdict-text">The right choice was: "${esc(v.choices[v.correctIndex] ?? '')}"</p>`}
      <button onclick="finishCampaignChoice()">Continue</button>
    </div>
  `;
}

async function finishCampaignChoice(){
  campaignView = { step: 'browse' };
  campaignMsg = '';
  render();
  await loadCampaignData();
  if(campaignView) render();
}

// Shared by both encounter types — grant_xp's own return shape, plus
// whatever the encounter's own reward_key granted (narrative encounters
// pass it through resolve-encounter's encounterReward; combat encounters
// use the same helper from claimCampaignVictory()).
function campaignXpSummary(data){
  const xp = data.xp;
  if(!xp || !xp.ok) return 'Cleared it.';
  let msg = `+${xp.xpGained} XP.`;
  if(xp.levelsGained > 0) msg += ` Level up — now Level ${xp.level}!`;
  const rewardNames = (xp.rewards || []).filter(r => r.type === 'reward').map(r => r.name).filter(Boolean);
  if(rewardNames.length) msg += ' ' + rewardNames.join(', ') + '!';
  if(data.encounterReward && data.encounterReward.granted) msg += ` Also received ${data.encounterReward.name || 'a reward'}.`;
  return msg;
}

function renderPetitionPicker(){

async function beginPetition(pantheonId, deityId){
  const status = document.getElementById('pickerStatus');
  if(status){ status.className = 'status'; status.textContent = 'The Gate listens…'; }

  try{
    const resp = await fetch(FUNCTIONS_URL + '/petition', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'begin', guardianId: guardian.id, pantheonId, deityId })
    });
    const data = await resp.json();
    if(!data.ok){
      if(status){ status.className = 'status err'; status.textContent = data.error || 'Could not open a trial.'; }
      return;
    }
    petitionView = {
      step: 'challenge',
      attemptId: data.attemptId,
      deityName: data.deityName,
      pantheonId, deityId,
      challenge: data.challenge,
      phase: data.phase
    };
    answerDraft = '';
    render();
  }catch(e){
    if(status){ status.className = 'status err'; status.textContent = 'Could not reach the relay: ' + e.message; }
  }
}

function renderPetitionChallenge(){
  const app = document.getElementById('app');
  const v = petitionView;
  const hintBlock = v.hint
    ? `<p class="hint" id="hintBox" style="font-style:italic;">"${esc(v.hint)}"</p>`
    : `<div id="hintBox"></div>`;
  app.innerHTML = `
    <div class="card"${bgAttr('oracle')}>
      <h2 style="text-align:center;">${esc(v.deityName)} sets a trial</h2>
      <p class="hint" style="text-align:center;">Write whatever answer feels honest to your guardian's keeper — there's no wrong format. Any genuine attempt earns at least a partial mark; a real show of understanding, courage, or wit earns the full one.</p>
      <p class="challenge-text">"${esc(v.challenge)}"</p>
      ${hintBlock}
      <button class="secondary" id="hintBtn" style="margin-bottom:10px;" ${v.hint ? 'disabled' : ''} onclick="getPetitionHint()">${v.hint ? 'Hint revealed' : 'Ask for a hint'}</button>
      <textarea id="answerBox" placeholder="Answer as your guardian's keeper…" oninput="onAnswerInput()">${esc(answerDraft)}</textarea>
      <button id="answerBtn" ${answerDraft.trim().length < 2 ? 'disabled' : ''} onclick="submitPetitionAnswer()">Offer your answer</button>
      <div class="status" id="answerStatus"></div>
      <button class="secondary" style="margin-top:10px;" onclick="abandonPetition()">Withdraw — choose a different god instead</button>
    </div>
  `;
}

async function getPetitionHint(){
  const btn = document.getElementById('hintBtn');
  const box = document.getElementById('hintBox');
  if(btn) btn.disabled = true;
  if(box){ box.className = 'hint'; box.style.fontStyle = 'italic'; box.textContent = 'Listening for a whisper…'; }
  try{
    const resp = await fetch(FUNCTIONS_URL + '/petition', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'hint', attemptId: petitionView.attemptId })
    });
    const data = await resp.json();
    if(!data.ok){
      if(box){ box.className = 'status err'; box.textContent = data.error || 'No hint came through.'; }
      if(btn) btn.disabled = false;
      return;
    }
    petitionView.hint = data.hint;
    render();
  }catch(e){
    if(box){ box.className = 'status err'; box.textContent = 'Could not reach the relay: ' + e.message; }
    if(btn) btn.disabled = false;
  }
}

async function abandonPetition(){
  const v = petitionView;
  if(!v || !v.attemptId) return;
  try{
    await fetch(FUNCTIONS_URL + '/petition', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'abandon', attemptId: v.attemptId })
    });
  }catch(e){
    console.error('abandon petition failed', e);
  }
  // Withdrawing doesn't cost the moon-phase attempt either way — leave
  // silently even if the network call above failed; worst case the old
  // trial just gets resumed next time, same as before this existed.
  petitionView = null;
  answerDraft = '';
  render();
}

function onAnswerInput(){
  const el = document.getElementById('answerBox');
  answerDraft = el ? el.value : '';
  const btn = document.getElementById('answerBtn');
  if(btn) btn.disabled = answerDraft.trim().length < 2;
}

async function submitPetitionAnswer(){
  const status = document.getElementById('answerStatus');
  const btn = document.getElementById('answerBtn');
  const answer = answerDraft.trim();
  if(answer.length < 2){
    status.className = 'status err';
    status.textContent = 'Say something first.';
    return;
  }
  if(btn) btn.disabled = true;
  status.className = 'status';
  status.textContent = `${petitionView.deityName} weighs your answer…`;

  try{
    const resp = await fetch(FUNCTIONS_URL + '/petition', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'answer', attemptId: petitionView.attemptId, answer })
    });
    const data = await resp.json();
    if(!data.ok){
      status.className = 'status err';
      status.textContent = data.error || 'The verdict did not come through.';
      if(btn) btn.disabled = false;
      return;
    }

    // Reflect the result locally without a full reload.
    const stageBefore = guardian.stage;
    guardian.bond = data.bond;
    guardian.stage = data.newStage;
    if(data.statGain > 0){
      guardian.vitality += data.statGain;
      guardian.might += data.statGain;
      guardian.ward += data.statGain;
      guardian.swiftness += data.statGain;
      guardian.cunning += data.statGain;
    }
    const existing = markFor(petitionView.pantheonId, petitionView.deityId);
    if(existing){ existing.mark_type = data.markType; }
    else{ marks.push({ pantheon_id: petitionView.pantheonId, deity_id: petitionView.deityId, mark_type: data.markType }); }

    petitionView = {
      step: 'verdict',
      deityName: petitionView.deityName,
      verdict: data.verdict,
      verdictText: data.verdictText,
      statGain: data.statGain,
      newStage: data.newStage,
      grew: data.newStage !== stageBefore,
      extraReward: data.extraReward || null
    };
    render();
  }catch(e){
    status.className = 'status err';
    status.textContent = 'Could not reach the relay: ' + e.message;
    if(btn) btn.disabled = false;
  }
}

function renderPetitionVerdict(){
  const app = document.getElementById('app');
  const v = petitionView;
  const gain = v.statGain > 0
    ? `All five stats rose by ${v.statGain}.`
    : 'No further stat gain from this mark — it was already earned.';
  const growthLine = v.grew ? `<p class="gain-note">Your guardian has grown to <strong style="color:var(--gold-bright);">${esc(STAGE_LABEL[v.newStage] || v.newStage)}</strong>.</p>` : '';
  // Reward differentiation (0043) — an admin-optional extra on top of the
  // stat/XP/blessing split above, so full vs partial can carry a visible
  // difference beyond the numbers.
  const rewardLine = (v.extraReward && v.extraReward.granted)
    ? `<p class="gain-note">Your ${v.verdict === 'full' ? 'full' : 'partial'} mark also earned <strong style="color:var(--gold-bright);">${esc(v.extraReward.name || 'a reward')}</strong>.</p>`
    : '';
  app.innerHTML = `
    <div class="card verdict-card"${bgAttr('oracle')}>
      <div class="verdict-badge ${v.verdict}" id="verdictBadge" style="position:relative;">${v.verdict === 'full' ? 'Full mark' : 'Partial mark'}</div>
      <p class="verdict-text">"${esc(v.verdictText)}" <span style="opacity:0.7;">— ${esc(v.deityName)}</span></p>
      <p class="gain-note">${esc(gain)} Bond deepens by 1.</p>
      ${growthLine}
      ${rewardLine}
      <button onclick="finishPetition()">Return to your guardian</button>
    </div>
  `;
  const badge = document.getElementById('verdictBadge');
  if(badge){
    if(v.verdict === 'full'){
      spawnParticles(badge, { count: 16, distance: 46, duration: 900, color: '#ffd76a', size: 22, sprite: 'particle-fx/fx_starburst.png' });
    }else{
      spawnParticles(badge, { count: 8, distance: 28, duration: 750, color: '#9fd7ff', size: 18, sprite: 'particle-fx/fx_glow_ring.png' });
    }
  }
}

async function finishPetition(){
  petitionView = null;
  answerDraft = '';
  render();
}
