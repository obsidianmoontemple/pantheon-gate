/* Admin-editable roster (gauntlet_opponents) — display only, same as
   circleShopItems: loaded once and cached. The server (combat/index.ts)
   reads this same table fresh on every request and is the only place
   stats or outcomes are actually decided; this copy just needs the
   key/name/affinity/tier to draw the picker correctly. */
let PROVING_TIERS = [];

async function loadGauntletOpponents(){
  if(PROVING_TIERS.length) return;
  const { data, error } = await supabaseClient.from('gauntlet_opponents').select('key, name, affinity, tier, image_url').eq('active', true).order('tier', { ascending: true });
  if(error){ console.error('gauntlet opponents load failed', error); return; }
  PROVING_TIERS = data || [];
}

function openProving(){
  combatView = { step: 'pick' };

}

function cancelCombat(){

}

// Backing out of a campaign encounter's loadout picker (or bailing after a
// campaign loss) returns to the campaign browse screen rather than the
// guardian home cancelCombat() falls through to — campaignView is still
// sitting on { step: 'browse' } underneath, so this just clears combatView
// and lets render()'s priority order surface it again.
function backFromCampaignCombat(){
  combatView = null;
  loadoutPicks = [];

function renderCombat(){
  if(combatView.step === 'pick') return renderProvingPicker();

function isPicked(pantheonId, deityId){
  return loadoutPicks.some(p => p.pantheonId === pantheonId && p.deityId === deityId);
}

function toggleLoadoutPick(pantheonId, deityId){
  if(isPicked(pantheonId, deityId)){
    loadoutPicks = loadoutPicks.filter(p => !(p.pantheonId === pantheonId && p.deityId === deityId));
  } else if(loadoutPicks.length < 5){
    loadoutPicks.push({ pantheonId, deityId });
  }
  renderLoadoutPicker();
}

function deityDisplayName(pantheonId, deityId){
  const pantheon = CATALOG[pantheonId];
  const found = pantheon && pantheon.deities.find(d => d[0] === deityId);
  return found ? found[1] : deityId;
}

function renderLoadoutPicker(){

  const isCampaign = combatView.source === 'campaign';
  const opponentLabel = isCampaign ? combatView.encounterName : PROVING_TIERS.find(t => t.key === combatView.opponentKey).name;
  const fullMarks = marks.filter(m => m.mark_type === 'full');

  const rows = fullMarks.length
    ? fullMarks.map(m => {

      }).join('')
    : '<p class="hint" style="text-align:center;">No full marks yet — you can still fight with Basic Strike alone, it will just be a harder climb.</p>';

  app.innerHTML = `

async function startBattle(){

    : { action: 'start', guardianId: guardian.id, opponentKey: combatView.opponentKey, loadout: loadoutPicks };
  try{
    const resp = await fetch(FUNCTIONS_URL + '/combat', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify(startBody)
    });
    const data = await resp.json();
    if(!data.ok){
      if(status){ status.className = 'status err'; status.textContent = data.error || 'Could not begin.'; }
      return;
    }
    combatView = {
      step: 'battle',
      source: isCampaign ? 'campaign' : 'gauntlet',
      encounterKey: isCampaign ? combatView.encounterKey : undefined,
      encounterName: isCampaign ? combatView.encounterName : undefined,
      battleId: data.battleId,

      opponentAffinity: data.opponentAffinity,
      opponentImageUrl: data.opponentImageUrl,
      guardianHp: data.guardianHp, guardianMaxHp: data.guardianMaxHp,

function renderBattleScreen(){
  const app = document.getElementById('app');
  const v = combatView;
  const gPct = Math.max(0, Math.round((v.guardianHp / v.guardianMaxHp) * 100));
  const oPct = Math.max(0, Math.round((v.opponentHp / v.opponentMaxHp) * 100));
  const moveButtons = v.moves.map((label, i) =>
    `<button class="move-btn" onclick="actMove(${i})">${esc(label)}</button>`
  ).join('');
  const logHtml = v.log.slice().reverse().map(entry => {
    const lines = entry.events.map(e => {
      const who = e.actor === 'guardian' ? esc(guardian.name) : esc(v.opponentName);
      if(e.move === undefined && e.burnTick !== undefined){
        return `<div class="entry burntick">Round ${entry.round}: ${who} takes ${e.burnTick} burn damage.</div>`;
      }
      if(e.move === undefined && e.stunned){
        return `<div class="entry stunskip">Round ${entry.round}: ${who} is stunned and cannot act!</div>`;
      }
      const tag = e.crit ? ' (critical!)' : (e.control ? ' (swiftness shaved)' : '');
      const extra = (e.healed ? ` (+${e.healed} lifesteal)` : '') + (e.stunned ? ' (stunned!)' : '') + (e.burn ? ' (burning)' : '');
      return `<div class="entry${e.crit ? ' crit' : ''}">Round ${entry.round}: ${who} used ${esc(e.move)}${tag} — ${e.damage} damage${extra}.</div>`;
    }).join('');
    return lines;
  }).join('');

  app.innerHTML = `
    <div class="card"${bgAttr('combat')}>
      <h2 style="text-align:center;">${esc(guardian.name)} vs. ${esc(v.opponentName)}</h2>
      <div class="battle-arena">
        <div class="battle-side">
          <div class="battle-sprite">${imgFor(guardian.species, guardian.stage, 110)}</div>
          <div class="hp-wrap" id="gHpWrap">
            <div class="hp-row"><span class="hp-name">${esc(guardian.name)}</span><span class="hp-name" id="gHpText">${v.guardianHp} / ${v.guardianMaxHp}</span></div>
            <div class="hp-bar-track"><div class="hp-bar-fill" id="gHpFill" style="width:${gPct}%;"></div></div>
          </div>
        </div>
        <div class="battle-vs">VS</div>
        <div class="battle-side">
          <div class="battle-sprite">${opponentImgFor(v.opponentImageUrl, v.opponentAffinity, 110)}</div>
          <div class="hp-wrap" id="oHpWrap">
            <div class="hp-row"><span class="hp-name">${esc(v.opponentName)}</span><span class="hp-name" id="oHpText">${v.opponentHp} / ${v.opponentMaxHp}</span></div>
            <div class="hp-bar-track"><div class="hp-bar-fill opponent" id="oHpFill" style="width:${oPct}%;"></div></div>
          </div>
        </div>
      </div>

      <div class="move-row" id="moveRow">${moveButtons}</div>
      <div class="status" id="battleStatus"></div>
      <div class="battle-log">${logHtml || '<div class="entry">The trial has not yet begun its first round.</div>'}</div>
    </div>
  `;
}

function sleep(ms){ return new Promise(res => setTimeout(res, ms)); }

/* Direct DOM manipulation for the impact beat — deliberately not a
   render() call, so the HP bars can animate in sequence before the
   authoritative state lands and the screen redraws (or moves to the
   result screen). No new art, just motion — same placeholder-first
   approach as everything else on this page.

   spawnParticles() is the shared burst primitive every beat below uses —
   real sprite art (CC0, Kenney's Particle Pack, particle-fx/), masked and
   tinted per moment/affinity via CSS, animated with plain DOM elements
   rather than a canvas/WebGL engine. Keeps this cheap on mobile and needs
   no new libraries or runtime — a spike into a full particle engine
   (Effekseer, WebGL) confirmed it works but at ~1.4MB of runtime plus a
   3D-camera integration this 2D battle screen doesn't have a natural home
   for; this gets most of the visual payoff for a fraction of the weight. */
// celebrate(): a generic burst on the whole #app container, for reward
// moments that immediately re-render to a different screen (hatching,
// claiming mail, clearing a campaign encounter) — those can't anchor a
// burst to a specific element the way combat's HP-bar wraps do, since the
// element they'd want to celebrate on doesn't exist until after render().
function celebrate(opts){
  const app = document.getElementById('app');
  if(!app) return;
  app.style.position = 'relative';
  spawnParticles(app, opts);
}

function spawnParticles(wrap, opts){
  if(!wrap) return;
  opts = opts || {};
  const n = opts.count || 5;
  const dist = opts.distance || 30;
  const dur = opts.duration || 700;
  for(let i = 0; i < n; i++){
    const angle = (Math.PI * 2 * i / n) + (Math.random() * 0.6 - 0.3);
    const d = dist * (0.55 + Math.random() * 0.6);
    const tx = Math.cos(angle) * d;
    const ty = Math.sin(angle) * d - (opts.lift || 0);
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.setProperty('--tx', tx.toFixed(1) + 'px');
    p.style.setProperty('--ty', ty.toFixed(1) + 'px');
    p.style.setProperty('--p-color', opts.color || '#e6c777');
    p.style.setProperty('--p-size', (opts.size || 20) + 'px');
    p.style.setProperty('--p-sprite', "url('" + (opts.sprite || 'particle-fx/fx_burst.png') + "')");
    p.style.animationDuration = dur + 'ms';
    wrap.appendChild(p);
    setTimeout(() => p.remove(), dur + 60);
  }
}

// Each affinity gets one signature sprite + its existing AFFINITY_COLORS
// tint (same colors used for the evolution glow and circle banners
// elsewhere in this file) — fire throws a flame, sea a ripple, storm a
// lightning crack, earth dust, death/shadow smoke (two different plumes),
// war a jagged impact burst, light a soft glow ring. Affinity-less basic
// strikes fall back to a neutral gold burst sprite.
const AFFINITY_SPRITES = {
  fire: 'particle-fx/fx_flame.png', sea: 'particle-fx/fx_ripple.png', storm: 'particle-fx/fx_lightning.png',
  earth: 'particle-fx/fx_dust.png', death: 'particle-fx/fx_smoke_thick.png', shadow: 'particle-fx/fx_smoke_thin.png',
  war: 'particle-fx/fx_impact.png', light: 'particle-fx/fx_glow_ring.png'
};
function hitColor(affinity){
  return AFFINITY_COLORS[affinity] || '#c8a24a';
}
function hitSprite(affinity){
  return AFFINITY_SPRITES[affinity] || 'particle-fx/fx_burst.png';
}

function animateHit(side, damage, crit, control, hpAfter, maxHp, affinity){
  const fill = document.getElementById(side === 'guardian' ? 'gHpFill' : 'oHpFill');
  const text = document.getElementById(side === 'guardian' ? 'gHpText' : 'oHpText');
  const wrap = document.getElementById(side === 'guardian' ? 'gHpWrap' : 'oHpWrap');
  if(fill) fill.style.width = Math.max(0, Math.round((hpAfter / maxHp) * 100)) + '%';
  if(text) text.textContent = hpAfter + ' / ' + maxHp;
  if(!wrap) return;
  wrap.classList.remove('flash-hit'); void wrap.offsetWidth; wrap.classList.add('flash-hit');
  const num = document.createElement('div');
  num.className = 'dmg-float' + (crit ? ' crit' : '') + (control ? ' control' : '');
  num.textContent = (crit ? 'CRIT ' : '') + '-' + damage;
  wrap.appendChild(num);
  setTimeout(() => num.remove(), 900);

  if(crit){
    spawnParticles(wrap, { count: 6, color: '#e6c777', size: 46, distance: 48, duration: 750, sprite: 'particle-fx/fx_starburst.png' });
  } else if(control){
    spawnParticles(wrap, { count: 4, color: 'var(--moon)', size: 38, distance: 28, duration: 750, sprite: 'particle-fx/fx_streak.png' });
  } else {
    spawnParticles(wrap, { count: 4, color: hitColor(affinity), size: 40, distance: 32, duration: 650, sprite: hitSprite(affinity) });
  }
}

// Burn ticking at the top of a round — no attacker, the affliction just
// bites. A smoldering ember puff, ember-colored regardless of the move
// that originally applied it.
function animateBurnTick(side, amount, hpAfter, maxHp){
  const fill = document.getElementById(side === 'guardian' ? 'gHpFill' : 'oHpFill');
  const text = document.getElementById(side === 'guardian' ? 'gHpText' : 'oHpText');
  const wrap = document.getElementById(side === 'guardian' ? 'gHpWrap' : 'oHpWrap');
  if(fill) fill.style.width = Math.max(0, Math.round((hpAfter / maxHp) * 100)) + '%';
  if(text) text.textContent = hpAfter + ' / ' + maxHp;
  if(!wrap) return;
  wrap.classList.remove('flash-hit'); void wrap.offsetWidth; wrap.classList.add('flash-hit');
  const num = document.createElement('div');
  num.className = 'dmg-float burntick';
  num.textContent = '-' + amount;
  wrap.appendChild(num);
  setTimeout(() => num.remove(), 900);
  spawnParticles(wrap, { count: 3, color: '#c05a34', size: 32, distance: 20, duration: 700, lift: 10, sprite: 'particle-fx/fx_ember.png' });
}

// A stunned turn — no damage, the side just loses its action. A moon-tinted
// binding-rune ring plus a text badge in place of a damage number.
function animateStunSkip(side){
  const wrap = document.getElementById(side === 'guardian' ? 'gHpWrap' : 'oHpWrap');
  if(!wrap) return;
  wrap.classList.remove('flash-hit'); void wrap.offsetWidth; wrap.classList.add('flash-hit');
  const num = document.createElement('div');
  num.className = 'dmg-float stunlabel';
  num.textContent = 'STUNNED';
  wrap.appendChild(num);
  setTimeout(() => num.remove(), 900);
  spawnParticles(wrap, { count: 4, color: 'var(--moon)', size: 38, distance: 28, duration: 750, sprite: 'particle-fx/fx_rune.png' });
}

// Lifesteal — the actor's own bar rises. Upward green glow rings instead of
// an outward burst, so it reads as "recovering" rather than "getting hit".
function animateHeal(side, amount, hpAfter, maxHp){
  const fill = document.getElementById(side === 'guardian' ? 'gHpFill' : 'oHpFill');
  const text = document.getElementById(side === 'guardian' ? 'gHpText' : 'oHpText');
  const wrap = document.getElementById(side === 'guardian' ? 'gHpWrap' : 'oHpWrap');
  if(fill) fill.style.width = Math.max(0, Math.round((hpAfter / maxHp) * 100)) + '%';
  if(text) text.textContent = hpAfter + ' / ' + maxHp;
  if(!wrap) return;
  const num = document.createElement('div');
  num.className = 'dmg-float heal';
  num.textContent = '+' + amount;
  wrap.appendChild(num);
  setTimeout(() => num.remove(), 900);
  spawnParticles(wrap, { count: 3, color: '#7fbf6a', size: 36, distance: 18, duration: 850, lift: 18, sprite: 'particle-fx/fx_glow_rings.png' });
}

// A status proc riding along on a normal hit (stun/burn just applied to the
// target, before it ever ticks/skips a turn) — a small floating tinted
// sprite badge, no HP change of its own. Matches the burn/stun particle
// sprites above so the same affliction always reads the same way.
function animateStatusProc(side, kind){
  const wrap = document.getElementById(side === 'guardian' ? 'gHpWrap' : 'oHpWrap');
  if(!wrap) return;
  const badge = document.createElement('div');
  badge.className = 'status-badge';
  badge.style.setProperty('--p-color', kind === 'burn' ? '#c05a34' : 'var(--moon)');
  badge.style.setProperty('--p-sprite', "url('" + (kind === 'burn' ? 'particle-fx/fx_ember.png' : 'particle-fx/fx_rune.png') + "')");
  wrap.appendChild(badge);
  setTimeout(() => badge.remove(), 950);
}

async function actMove(moveIndex){
  const status = document.getElementById('battleStatus');
  const row = document.getElementById('moveRow');
  if(row) Array.from(row.querySelectorAll('button')).forEach(b => b.disabled = true);
  if(status){ status.className = 'status'; status.textContent = 'The blow lands…'; }

  try{
    const resp = await fetch(FUNCTIONS_URL + '/combat', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'act', battleId: combatView.battleId, moveIndex })
    });
    const data = await resp.json();
    if(!data.ok){
      if(status){ status.className = 'status err'; status.textContent = data.error || 'The round did not resolve.'; }
      if(row) Array.from(row.querySelectorAll('button')).forEach(b => b.disabled = false);
      return;
    }

    let gHp = combatView.guardianHp, oHp = combatView.opponentHp;
    for(const ev of data.events){
      // Burn tick: no attacker, actor is simply taking its own DoT damage.
      if(ev.move === undefined && ev.burnTick !== undefined){
        if(ev.actor === 'guardian') gHp = Math.max(0, gHp - ev.burnTick); else oHp = Math.max(0, oHp - ev.burnTick);
        animateBurnTick(ev.actor, ev.burnTick, ev.actor === 'guardian' ? gHp : oHp,
          ev.actor === 'guardian' ? combatView.guardianMaxHp : combatView.opponentMaxHp);
        await sleep(550);
        continue;
      }
      // Stunned skip: actor loses the whole turn, no damage either way.
      if(ev.move === undefined && ev.stunned){
        animateStunSkip(ev.actor);
        await sleep(550);
        continue;
      }
      // A landed move: actor deals damage to the other side.
      const targetIsOpponent = ev.actor === 'guardian';
      if(targetIsOpponent) oHp = Math.max(0, oHp - ev.damage); else gHp = Math.max(0, gHp - ev.damage);
      animateHit(
        targetIsOpponent ? 'opponent' : 'guardian', ev.damage, ev.crit, ev.control,
        targetIsOpponent ? oHp : gHp,
        targetIsOpponent ? combatView.opponentMaxHp : combatView.guardianMaxHp,
        ev.affinity
      );
      await sleep(650);

      // Secondary effects riding this same move, layered on after the beat.
      if(ev.stunned){ animateStatusProc(targetIsOpponent ? 'opponent' : 'guardian', 'stun'); await sleep(350); }
      if(ev.burn){ animateStatusProc(targetIsOpponent ? 'opponent' : 'guardian', 'burn'); await sleep(350); }
      if(ev.healed){
        if(ev.actor === 'guardian'){
          gHp = Math.min(combatView.guardianMaxHp, gHp + ev.healed);
          animateHeal('guardian', ev.healed, gHp, combatView.guardianMaxHp);
        } else {
          oHp = Math.min(combatView.opponentMaxHp, oHp + ev.healed);
          animateHeal('opponent', ev.healed, oHp, combatView.opponentMaxHp);
        }
        await sleep(400);
      }
    }

    combatView.guardianHp = data.guardianHp;
    combatView.opponentHp = data.opponentHp;
    combatView.log.push({ round: data.round, events: data.events });

    if(data.finished){
      combatView = {
        step: 'result',
        source: combatView.source,
        encounterKey: combatView.encounterKey,
        encounterName: combatView.encounterName,
        result: data.result,
        essenceGained: data.essenceGained,
        rankUp: data.rankUp,
        opponentName: combatView.opponentName
      };
    }
    render();
  }catch(e){
    if(status){ status.className = 'status err'; status.textContent = 'Could not reach the relay: ' + e.message; }
    if(row) Array.from(row.querySelectorAll('button')).forEach(b => b.disabled = false);
  }
}

function renderBattleResult(){
  const app = document.getElementById('app');
  const v = combatView;
  const win = v.result === 'win';
  const isCampaign = v.source === 'campaign';

  // Campaign fights never pay Essence/rank here — combat/index.ts
  // deliberately skips that payout on source:'campaign' wins, deferring to
  // claimCampaignVictory() below, which verifies the win through
  // /campaign resolve-encounter before granting XP (and, on a first
  // clear, the encounter's reward). A campaign loss has nothing to claim.
  const bodyHtml = isCampaign
    ? (win
        ? `<p class="verdict-text">${esc(guardian.name)} bested the ${esc(v.opponentName)}.</p>
           <div class="status" id="campaignClaimStatus"></div>
           <button onclick="claimCampaignVictory()">Claim your reward</button>`
        : `<p class="verdict-text">${esc(v.opponentName)} proved too much this time.</p>
           <button onclick="backFromCampaignCombat()">Return to your guardian</button>`)
    : `<p class="verdict-text">${win ? `${esc(guardian.name)} bested the ${esc(v.opponentName)}.` : `${esc(v.opponentName)} proved too much this time.`}</p>
       <p class="gain-note">Essence gained: ${v.essenceGained}.${v.rankUp ? ' A new trial ground has opened.' : ''}</p>
       <button onclick="finishCombat()">Return to your guardian</button>`;

  app.innerHTML = `
    <div class="card verdict-card"${bgAttr('combat')}>
      <div class="verdict-badge ${win ? 'full' : 'partial'}">${win ? 'Victory' : 'Defeat'}</div>
      ${bodyHtml}
    </div>
  `;
}

async function finishCombat(){
  combatView = null;
  loadoutPicks = [];
  await loadGuardian();
  render();
}

// Cashes in a won campaign combat encounter. combat/index.ts already left
// the finished `battles` row unclaimed (campaign_reward_claimed: false);
// /campaign's resolve-encounter action re-verifies that win server-side
// before granting XP/rewards, so this can't be replayed to farm XP.
async function claimCampaignVictory(){
  const status = document.getElementById('campaignClaimStatus');
  if(status){ status.className = 'status'; status.textContent = 'Claiming…'; }
  const encounterKey = combatView.encounterKey;
  try{
    const resp = await fetch(FUNCTIONS_URL + '/campaign', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'resolve-encounter', guardianId: guardian.id, encounterKey })
    });
    const data = await resp.json();
    if(!data.ok){
      if(status){ status.className = 'status err'; status.textContent = data.error || 'Could not claim that.'; }
      return;
    }
    combatView = null;
    loadoutPicks = [];
    await loadGuardian();
    await openCampaign();
    campaignMsg = campaignXpSummary(data);
    render();
    celebrate({ count: 16, distance: 50, duration: 900, color: '#ffd76a', size: 22, sprite: 'particle-fx/fx_starburst.png' });
  }catch(e){
    if(status){ status.className = 'status err'; status.textContent = 'Could not reach the relay: ' + e.message; }
  }
}

async function circleFetch(action, extra){
  try{
    const resp = await fetch(FUNCTIONS_URL + '/circle', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify(Object.assign({ action }, extra || {}))
    });
    return await resp.json();
  }catch(e){
    return { ok: false, error: 'Could not reach the relay: ' + e.message };
  }
}

function roleLabel(role){
  return { high_priest: 'High Priest', high_priestess: 'High Priestess', magus: 'Magus', initiate: 'Initiate' }[role] || role;
}

function bannerSVG(shape, primary, secondary, size){
  size = size || 120;
  const gid = 'bgrad' + (bannerIdCounter++);
  const grad = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="${primary}"/><stop offset="100%" stop-color="${secondary}"/>
  </linearGradient></defs>`;
  let shapeEl;
  if(shape === 'roundel'){
    shapeEl = `<circle cx="50" cy="55" r="48" fill="url(#${gid})" stroke="#c8a24a" stroke-width="2"/>`;
  } else if(shape === 'pennant'){
    shapeEl = `<rect x="8" y="4" width="14" height="106" fill="#5a4e38"/>
      <polygon points="22,14 96,55 22,96" fill="url(#${gid})" stroke="#c8a24a" stroke-width="2"/>`;
  } else {
    shapeEl = `<path d="M50 3 L92 18 L92 54 C92 88 71 108 50 116 C29 108 8 88 8 54 L8 18 Z" fill="url(#${gid})" stroke="#c8a24a" stroke-width="2"/>`;
  }
  return `<svg class="circle-banner" width="${size}" height="${Math.round(size*1.1)}" viewBox="0 0 100 120">${grad}${shapeEl}</svg>`;
}

async function openCircle(){
  if(session.user.is_anonymous){
    circleView = { step: 'locked' };
    render();
    return;
  }
  circleView = { step: 'loading' };
  render();
  await loadMyCircle();
}

async function loadMyCircle(){
  circleStatus = '';
  const data = await circleFetch('my-circle');
  if(!data.ok){
    circleStatus = data.error || 'Could not load your Circle.';
    circleView = { step: 'browse' };
    await loadBrowseCircles();
    return;
  }
  myCircle = data;
  if(data.circle){
    await loadCircleShopItems();
    circleView = { step: 'home' };
    render();
  }else{
    circleView = { step: 'browse' };
    await loadBrowseCircles();
  }
}

async function loadBrowseCircles(){
  const data = await circleFetch('browse');
  browseCircles = data.ok ? (data.circles || []) : [];
  if(!data.ok) circleStatus = data.error || 'Could not load Circles.';
  render();
  loadCircleActivityFeed();
}

// Global ping (0043) — a public, chronological record of circle events
// (founding today; invasion_declared/invasion_resolved/takeover reserved
// for that system), for scouting/targeting alongside the live browse list
// above. Read directly — circle_activity_feed is public-select, same
// trust model as `circles` itself.
let circleActivityFeed = [];
async function loadCircleActivityFeed(){
  const { data, error } = await supabaseClient
    .from('circle_activity_feed')
    .select('event_type, payload, created_at, circle_id, circles(name)')
    .order('created_at', { ascending: false })
    .limit(12);
  if(error){ console.error('circle_activity_feed load failed', error); return; }
  circleActivityFeed = data || [];
  if(circleView && circleView.step === 'browse') render();
}
function circleActivityLine(row){
  const name = (row.circles && row.circles.name) || (row.payload && row.payload.name) || 'A Circle';
  if(row.event_type === 'founded') return `${esc(name)} was founded.`;
  if(row.event_type === 'invasion_declared') return `${esc(name)} declared an invasion.`;
  if(row.event_type === 'invasion_resolved') return `${esc(name)}'s invasion was resolved.`;
  if(row.event_type === 'takeover') return `${esc(name)} was taken over.`;
  return `${esc(name)} — ${esc(row.event_type)}.`;
}

}

function backToCircleFromForm(){

}

function renderCircle(){
  if(circleView.step === 'locked') return renderCircleLocked();
  if(circleView.step === 'loading') return renderCircleLoading();

  if(circleView.step === 'messages') return renderCircleMessages();

/* ---------------- circle messaging (Phase 4c) ----------------
   No edge function involved here — reads and writes both go straight
   through supabaseClient, gated entirely by the circle_messages RLS
   policies (see migration 0016). Circle Chat = recipient_user_id null;
   Direct Messages = a thread with one specific fellow member. */

function rosterNameMap(){
  const map = {};
  ((myCircle && myCircle.roster) || []).forEach(m => { map[m.user_id] = (m.guardians && m.guardians.name) || 'Unknown'; });
  return map;
}

async function openCircleMessages(){
  if(!myCircle || !myCircle.circle) return;
  circleView = { step: 'messages' };
  messagesTab = 'feed';
  dmPeerId = null;
  messageDraft = '';
  render();
  await refreshFeedMessages();
  startMessagesPolling();
}

function backToCircleHomeFromMessages(){
  stopMessagesPolling();
  circleView = { step: 'home' };
  render();
}

function startMessagesPolling(){
  stopMessagesPolling();
  messagesPollTimer = setInterval(() => {
    if(!circleView || circleView.step !== 'messages'){ stopMessagesPolling(); return; }
    if(messagesTab === 'feed') refreshFeedMessages();
    else if(dmPeerId) refreshDmMessages(dmPeerId);
  }, 5000);
}
function stopMessagesPolling(){
  if(messagesPollTimer){ clearInterval(messagesPollTimer); messagesPollTimer = null; }
}

async function refreshFeedMessages(){
  if(!myCircle || !myCircle.circle) return;
  const { data, error } = await supabaseClient
    .from('circle_messages')
    .select('id, sender_id, content, created_at')
    .eq('circle_id', myCircle.circle.id)
    .is('recipient_user_id', null)
    .order('created_at', { ascending: true })
    .limit(200);
  if(error){ console.error('circle feed load failed', error); return; }
  feedMessages = data || [];
  if(circleView && circleView.step === 'messages' && messagesTab === 'feed') renderCircleMessages();
}

async function refreshDmMessages(peerId){
  if(!myCircle || !myCircle.circle || !peerId || !session) return;
  const me = session.user.id;
  const { data, error } = await supabaseClient
    .from('circle_messages')
    .select('id, sender_id, recipient_user_id, content, created_at, read_at')
    .eq('circle_id', myCircle.circle.id)
    .or(`and(sender_id.eq.${me},recipient_user_id.eq.${peerId}),and(sender_id.eq.${peerId},recipient_user_id.eq.${me})`)
    .order('created_at', { ascending: true })
    .limit(200);
  if(error){ console.error('dm load failed', error); return; }
  dmMessages = data || [];

  const unreadIds = dmMessages.filter(m => m.recipient_user_id === me && !m.read_at).map(m => m.id);
  if(unreadIds.length){
    await supabaseClient.from('circle_messages').update({ read_at: new Date().toISOString() }).in('id', unreadIds);
  }
  if(circleView && circleView.step === 'messages' && messagesTab === 'dm' && dmPeerId === peerId) renderCircleMessages();
}

function switchMessagesTab(tab){
  messagesTab = tab;
  dmPeerId = null;
  render();
  if(tab === 'feed') refreshFeedMessages();
}

async function pickDmPeer(peerId){
  dmPeerId = peerId;
  messagesTab = 'dm';
  render();
  await refreshDmMessages(peerId);
}

function onMessageInput(){ const el = document.getElementById('messageInput'); if(el) messageDraft = el.value; }

function setMessagesStatus(text, ok){

  el.className = 'status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  el.textContent = text;

async function sendCircleMessage(){
  const text = (messageDraft || '').trim();
  if(!text) return;
  if(messagesTab === 'dm' && !dmPeerId){ setMessagesStatus('Pick someone to message first.', false); return; }

  const row = {
    circle_id: myCircle.circle.id,
    sender_id: session.user.id,
    recipient_user_id: messagesTab === 'dm' ? dmPeerId : null,
    content: text
  };
  const { error } = await supabaseClient.from('circle_messages').insert(row);
  if(error){ setMessagesStatus(error.message, false); return; }

  messageDraft = '';
  const box = document.getElementById('messageInput');
  if(box) box.value = '';
  if(messagesTab === 'feed') await refreshFeedMessages();
  else await refreshDmMessages(dmPeerId);
}

function renderCircleMessages(){
  const app = document.getElementById('app');
  const roster = (myCircle && myCircle.roster) || [];
  const me = session.user.id;
  const nameById = rosterNameMap();

  const peerRows = roster.filter(m => m.user_id !== me).map(m => `
    <div class="roster-row" style="cursor:pointer;${dmPeerId === m.user_id ? 'border-color:var(--gold-bright);' : ''}" onclick="pickDmPeer('${m.user_id}')">
      <div class="rname">${esc(nameById[m.user_id])}</div>
    </div>
  `).join('') || '<p class="hint">No one else here yet.</p>';

  const feedRows = feedMessages.map(m => `
    <div class="msg-row ${m.sender_id === me ? 'mine' : ''}">
      <div class="msg-meta">${esc(nameById[m.sender_id] || 'Unknown')} · ${new Date(m.created_at).toLocaleString()}</div>
      <div class="msg-body">${esc(m.content)}</div>
    </div>
  `).join('') || '<p class="hint">No messages yet — say hello.</p>';

  const dmRows = dmMessages.map(m => `
    <div class="msg-row ${m.sender_id === me ? 'mine' : ''}">
      <div class="msg-meta">${esc(nameById[m.sender_id] || 'Unknown')} · ${new Date(m.created_at).toLocaleString()}</div>
      <div class="msg-body">${esc(m.content)}</div>
    </div>
  `).join('') || '<p class="hint">No messages yet.</p>';

  const canSend = messagesTab === 'feed' || (messagesTab === 'dm' && dmPeerId);

  app.innerHTML = `
    <div class="card"${bgAttr('circle')}>
      <h2 style="text-align:center;">${esc(myCircle.circle.name)} — Messages</h2>
      <div class="choice-row" style="margin-bottom:16px;">
        <div class="choice ${messagesTab === 'feed' ? 'selected' : ''}" style="width:140px;" onclick="switchMessagesTab('feed')"><div class="label">Circle Chat</div></div>
        <div class="choice ${messagesTab === 'dm' ? 'selected' : ''}" style="width:140px;" onclick="switchMessagesTab('dm')"><div class="label">Direct Messages</div></div>
      </div>

      ${messagesTab === 'dm' ? `<p class="section-label">Whisper to</p><div style="margin-bottom:16px;">${peerRows}</div>` : ''}

      <div class="msg-list">${messagesTab === 'feed' ? feedRows : (dmPeerId ? dmRows : '<p class="hint">Pick someone above to message.</p>')}</div>

      ${canSend ? `
        <div style="display:flex;gap:10px;margin-top:14px;">
          <input type="text" id="messageInput" maxlength="500" placeholder="Say something…" value="${esc(messageDraft)}" oninput="onMessageInput()" onkeydown="if(event.key==='Enter') sendCircleMessage();" style="margin:0;flex:1;">
          <button onclick="sendCircleMessage()">Send</button>
        </div>
      ` : ''}
      <div class="status" id="messagesStatus"></div>
      <button class="secondary" style="margin-top:16px;" onclick="backToCircleHomeFromMessages()">Back to your Circle</button>
    </div>
  `;
}

function formatRemaining(msRemaining){
  if(msRemaining <= 0) return 'Ready';
  const totalMin = Math.ceil(msRemaining / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  if(h >= 24){
    const d = Math.floor(h / 24);
    return `${d}d ${h % 24}h`;
  }
  if(h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

  circleView = { step: 'altar' };
  altarCircleId = circleId;

  altarPickerTab = 'plant';

  render();
  await refreshAltar();
  startAltarTicking();

  altarData = data.ok ? data : null;
  if(circleView && circleView.step === 'altar') render();
}

function startAltarTicking(){
  stopAltarTicking();
  // Just a re-render so plot countdowns stay roughly live — refreshAltar()
  // only needs to run when something actually changed server-side.
  altarTickTimer = setInterval(() => {
    if(!circleView || circleView.step !== 'altar'){ stopAltarTicking(); return; }
    render();
  }, 30000);
}
function stopAltarTicking(){
  if(altarTickTimer){ clearInterval(altarTickTimer); altarTickTimer = null; }
}

  stopAltarTicking();

function setAltarStatus(text, ok){

  el.textContent = text;
}

function onAltarPlotClick(plotIndex){
  if(!altarData || !altarData.isOwnCircle) return;
  const plot = (altarData.plots || []).find(p => p.plot_index === plotIndex) || { content_type: 'empty' };
  if(plot.content_type === 'decoration') return; // no remove/rearrange yet
  if(plot.content_type === 'seed'){
    const remaining = plot.ready_at ? (new Date(plot.ready_at) - new Date()) : 0;
    if(remaining <= 0) doHarvestPlot(plotIndex);
    return;
  }
  altarPickerPlot = (altarPickerPlot === plotIndex) ? null : plotIndex;
  altarPickerTab = 'plant';
  render();
}

async function doPlantSeed(seedKey){
  const data = await circleFetch('altar-plant', { plotIndex: altarPickerPlot, seedKey });
  if(!data.ok){ setAltarStatus(data.error || 'Could not plant.', false); return; }

async function doPlaceDecoration(decorationKey){

async function doHarvestPlot(plotIndex){

async function doBuyDecoration(key){

// Picks a placed decoration back up into an empty plot — still owned,
// can be placed again elsewhere. Addresses the altar's original
// "no rearrange/remove yet" limitation.

function onOfferAmountInput(){ const el = document.getElementById('offerAmountInput'); if(el) offerAmountDraft = el.value; }

async function doLeaveOffering(){
  const amount = parseAmount(offerAmountDraft);
  if(!amount){ setAltarStatus('Enter a positive whole number first.', false); return; }
  const data = await circleFetch('altar-offer', { circleId: altarCircleId, amount });
  if(!data.ok){ setAltarStatus(data.error || 'Could not leave an offering.', false); return; }

  setAltarStatus(`Left an offering of ${amount} Essence.`, true);
  await loadGuardian();
  await refreshAltar();

function renderCircleAltar(){
  const app = document.getElementById('app');
  if(!altarData){
    app.innerHTML = `<div class="card"><p class="status">Approaching the altar…</p></div>`;
    return;
  }
  const c = altarData.circle;
  const isOwn = altarData.isOwnCircle;
  const plots = altarData.plots || [];
  const unlockedKeys = new Set((altarData.unlocks || []).map(u => u.decoration_key));
  const placedKeys = new Set(plots.filter(p => p.content_type === 'decoration').map(p => p.content_key));
  const decoByKey = {};
  (altarData.decorationCatalog || []).forEach(d => { decoByKey[d.key] = d; });
  const seedByKey = {};
  (altarData.seedCatalog || []).forEach(s => { seedByKey[s.key] = s; });

  const gridCells = Array.from({ length: 20 }, (_, i) => {
    const plot = plots.find(p => p.plot_index === i) || { plot_index: i, content_type: 'empty' };
    let cls = 'altar-plot ' + plot.content_type;
    let label = '';
    let clickable = false;
    let plotStyle = '';
    if(plot.content_type === 'empty'){
      label = isOwn ? '+' : '';
      clickable = isOwn;
      if(clickable) cls += ' clickable';
    }else if(plot.content_type === 'seed'){
      const seed = seedByKey[plot.content_key];
      const remaining = plot.ready_at ? (new Date(plot.ready_at) - new Date()) : 0;
      if(remaining <= 0) cls += ' ready';
      label = `${seed ? esc(seed.name) : 'Seed'}<br>${formatRemaining(remaining)}`;
      clickable = isOwn && remaining <= 0;
      plotStyle = altarPlotStyle(seed && seed.image_url);
    }else if(plot.content_type === 'decoration'){
      const dec = decoByKey[plot.content_key];
      label = `${dec ? esc(dec.name) : 'Decoration'}${isOwn ? `<button class="secondary pickup-btn" onclick="event.stopPropagation();doRemoveDecoration(${i})">Pick up</button>` : ''}`;
      plotStyle = altarPlotStyle(dec && dec.image_url);
    }
    return `<div class="${cls}"${plotStyle} ${clickable ? `onclick="onAltarPlotClick(${i})"` : ''}>${label}</div>`;
  }).join('');

  let pickerBlock = '';
  if(isOwn && altarPickerPlot !== null){
    const plantRows = (altarData.seedCatalog || []).map(s => `
      <div class="altar-catalog-row">
        <div style="display:flex;align-items:center;gap:8px;">${shopThumb(s.image_url)}<div><div class="aname">${esc(s.name)}</div><div class="adesc">${s.cost_devotion} Devotion · grows in ${formatRemaining(s.grow_hours * 3600 * 1000)} · yields ${s.yield_devotion_min}-${s.yield_devotion_max} Devotion</div></div></div>
        <button class="secondary" ${c.devotion_balance < s.cost_devotion ? 'disabled' : ''} onclick="doPlantSeed('${esc(s.key)}')">Plant</button>
      </div>
    `).join('') || '<p class="hint">No seeds in the catalog.</p>';

    const ownedNotPlaced = (altarData.unlocks || []).filter(u => !placedKeys.has(u.decoration_key));
    const decorateRows = ownedNotPlaced.map(u => {
      const dec = decoByKey[u.decoration_key] || {};
      return `<div class="altar-catalog-row">
        <div style="display:flex;align-items:center;gap:8px;">${shopThumb(dec.image_url)}<div><div class="aname">${esc(dec.name || u.decoration_key)}</div><div class="adesc">${esc(dec.description || '')}</div></div></div>
        <button class="secondary" onclick="doPlaceDecoration('${esc(u.decoration_key)}')">Place</button>
      </div>`;
    }).join('') || `<p class="hint">Nothing in your Circle's inventory yet — buy, find, or unlock a decoration below.</p>`;

    pickerBlock = `
      <div class="altar-picker">
        <div class="choice-row" style="margin-bottom:12px;">
          <div class="choice ${altarPickerTab === 'plant' ? 'selected' : ''}" style="width:130px;" onclick="switchAltarPickerTab('plant')"><div class="label">Plant a Seed</div></div>
          <div class="choice ${altarPickerTab === 'decorate' ? 'selected' : ''}" style="width:130px;" onclick="switchAltarPickerTab('decorate')"><div class="label">Place a Decoration</div></div>
        </div>
        ${altarPickerTab === 'plant' ? plantRows : decorateRows}
      </div>
    `;
  }

  let catalogBlock = '';
  if(isOwn){
    const rows = (altarData.decorationCatalog || []).map(d => {
      const owned = unlockedKeys.has(d.key);
      let action;
      if(owned) action = '<span class="role-badge initiate">Owned</span>';
      else if(d.source === 'buy') action = `<button class="secondary" ${c.devotion_balance < d.cost_devotion ? 'disabled' : ''} onclick="doBuyDecoration('${esc(d.key)}')">Buy — ${d.cost_devotion} Devotion</button>`;
      else if(d.source === 'find') action = '<span class="hint" style="margin:0;">Found by harvesting</span>';
      else action = `<button class="secondary" onclick="doClaimUnlock('${esc(d.key)}')">Claim</button>`;
      return `<div class="altar-catalog-row">
        <div style="display:flex;align-items:center;gap:8px;">${shopThumb(d.image_url)}<div><div class="aname">${esc(d.name)}</div><div class="adesc">${esc(d.description)}</div></div></div>
        <div>${action}</div>
      </div>`;
    }).join('');
    catalogBlock = `<h2 style="margin-top:26px;">Decoration Catalog</h2>${rows}`;
  }

  const guestbookRows = (altarData.offerings || []).map(o => `
    <div class="roster-row"><div class="rname">${esc(o.visitorName)} left ${o.amount} Essence</div><div class="cblurb">${new Date(o.created_at).toLocaleString()}</div></div>
  `).join('') || '<p class="hint">No offerings yet — be the first to visit.</p>';

  const offerForm = !isOwn ? `
    <h2 style="margin-top:26px;">Leave an Offering</h2>
    <p class="hint">Spend your own Essence — it becomes Devotion for this Circle, not yours.</p>
    <div style="display:flex;gap:10px;justify-content:center;align-items:center;">
      <input type="text" inputmode="numeric" id="offerAmountInput" placeholder="Amount" value="${esc(offerAmountDraft)}" oninput="onOfferAmountInput()" style="width:110px;margin:0;">
      <button class="secondary" onclick="doLeaveOffering()">Leave offering</button>
    </div>
  ` : '';

  const circleAltarBg = bgAttr('circleAltar');
  app.innerHTML = `
    <div class="card"${bgAttr('circleAltar', 'text-align:center;')}>
      ${bannerSVG(c.banner_shape, c.banner_primary, c.banner_secondary, 120)}
      <h2>${esc(c.name)}'s Altar</h2>
      <p class="ccount">${altarData.memberCount} members · Devotion: ${c.devotion_balance}</p>
    </div>

    <div class="card"${circleAltarBg}>
      <div class="altar-grid">${gridCells}</div>
      ${pickerBlock}
      <div class="status" id="altarStatus"></div>
      ${catalogBlock}
      <h2 style="margin-top:26px;">Guestbook</h2>
      ${guestbookRows}
      ${offerForm}
      <div style="text-align:center;margin-top:20px;">
        <button class="secondary" onclick="backFromAltar()">Back</button>
      </div>
    </div>
  `;
}

/* =====================================================================
   PERSONAL ALTAR — a solo, per-guardian mirror of the Circle Altar
   above: same plant/grow/harvest/decorate loop, priced in the guardian's
   own Essence instead of a Circle's pooled Devotion, on a smaller 12-slot
   (3x4) grid. No guestbook/offerings — that mechanic is inherently
   social (visiting another Circle) and this altar is explicitly solo.
   ===================================================================== */

async function personalAltarFetch(action, extra){
  try{
    const resp = await fetch(FUNCTIONS_URL + '/personal-altar', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify(Object.assign({ action }, extra || {}))
    });
    return await resp.json();
  }catch(e){
    return { ok: false, error: 'Could not reach the relay: ' + e.message };
  }
}

async function openPersonalAltar(){
  personalAltarView = { step: 'altar' };
  palData = null;
  palPickerPlot = null;
  palPickerTab = 'plant';
  render();
  await refreshPersonalAltar();
  startPersonalAltarTicking();
}

async function refreshPersonalAltar(){
  const data = await personalAltarFetch('view');
  palData = data.ok ? data : null;
  if(personalAltarView) render();
}

function startPersonalAltarTicking(){
  stopPersonalAltarTicking();
  palTickTimer = setInterval(() => {
    if(!personalAltarView){ stopPersonalAltarTicking(); return; }
    render();
  }, 30000);
}
function stopPersonalAltarTicking(){
  if(palTickTimer){ clearInterval(palTickTimer); palTickTimer = null; }
}

function backFromPersonalAltar(){
  stopPersonalAltarTicking();
  personalAltarView = null;
  palData = null;
  render();
}

function setPalStatus(text, ok){
  const el = document.getElementById('palStatus');
  if(!el) return;
  el.className = 'status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  el.textContent = text;
}

function onPalPlotClick(plotIndex){
  if(!palData) return;
  const plot = (palData.plots || []).find(p => p.plot_index === plotIndex) || { content_type: 'empty' };
  if(plot.content_type === 'decoration') return; // use the Pick up button instead
  if(plot.content_type === 'seed'){
    const remaining = plot.ready_at ? (new Date(plot.ready_at) - new Date()) : 0;
    if(remaining <= 0) doPalHarvestPlot(plotIndex);
    return;
  }
  palPickerPlot = (palPickerPlot === plotIndex) ? null : plotIndex;
  palPickerTab = 'plant';
  render();
}

function switchPalPickerTab(tab){ palPickerTab = tab; render(); }

async function doPalPlantSeed(seedKey){
  const data = await personalAltarFetch('plant', { plotIndex: palPickerPlot, seedKey });
  if(!data.ok){ setPalStatus(data.error || 'Could not plant.', false); return; }
  palPickerPlot = null;
  await refreshPersonalAltar();
}

async function doPalPlaceDecoration(decorationKey){
  const data = await personalAltarFetch('place', { plotIndex: palPickerPlot, decorationKey });
  if(!data.ok){ setPalStatus(data.error || 'Could not place.', false); return; }
  palPickerPlot = null;
  await refreshPersonalAltar();
}

async function doPalHarvestPlot(plotIndex){
  const data = await personalAltarFetch('harvest', { plotIndex });
  if(!data.ok){ setPalStatus(data.error || 'Could not harvest.', false); return; }
  const blessingNote = data.blessingBonusName ? ` (${esc(data.blessingBonusName)}'s blessing added a bonus)` : '';
  setPalStatus(`Harvested ${data.essenceGained} Essence.${blessingNote}` + (data.foundDecoration ? ' A new decoration was found!' : ''), true);
  await loadGuardian();
  await refreshPersonalAltar();
}

async function doPalBuyDecoration(key){
  const data = await personalAltarFetch('buy-decoration', { decorationKey: key });
  setPalStatus(data.ok ? 'Purchased.' : (data.error || 'Could not buy.'), data.ok);
  if(data.ok){ await loadGuardian(); await refreshPersonalAltar(); }
}

async function doPalClaimUnlock(key){
  const data = await personalAltarFetch('claim-unlock', { decorationKey: key });
  setPalStatus(data.ok ? 'Unlocked!' : (data.error || 'Not yet.'), data.ok);
  if(data.ok) await refreshPersonalAltar();
}

async function doPalRemoveDecoration(plotIndex){
  const data = await personalAltarFetch('remove', { plotIndex });
  setPalStatus(data.ok ? 'Picked up — place it wherever you like.' : (data.error || 'Could not pick up.'), data.ok);
  if(data.ok) await refreshPersonalAltar();

/* ---------------- circle dragons (Phase 5a) ---------------- */

// Map hub's "Circle Battles Against the Dragons" hotspot needs a direct,
// standalone entry point — openCircleDragon() itself silently no-ops
// without a pre-loaded myCircle.circle, since until now it was only ever
// reached from inside an already-loaded Circle home screen. This mirrors
// openCircle()/loadMyCircle()'s own guard-and-fetch pattern, then hands
// off into the existing dragon view once membership is confirmed —
// otherwise it lands on the Circle browse screen with a friendlier
// message than a silent no-op.
async function openCircleDragonEntry(){
  if(session.user.is_anonymous){
    circleView = { step: 'locked' };
    render();
    return;
  }
  circleView = { step: 'loading' };
  render();
  const data = await circleFetch('my-circle');
  if(!data.ok || !data.circle){
    myCircle = data.ok ? data : myCircle;
    circleStatus = data.ok ? 'Join a Circle first to battle dragons together.' : (data.error || 'Could not load your Circle.');
    circleView = { step: 'browse' };
    await loadBrowseCircles();
    return;
  }
  myCircle = data;
  await loadCircleShopItems();
  await openCircleDragon();
}

async function openCircleDragon(){
  if(!myCircle || !myCircle.circle) return;
  circleView = { step: 'dragon' };
  dragonStatus = null;
  render();
  await refreshDragonStatus();
}

async function refreshDragonStatus(){
  const data = await circleFetch('dragon-status');
  dragonStatus = data.ok ? data : null;
  if(circleView && circleView.step === 'dragon') render();
}

function backFromDragon(){
  circleView = { step: 'home' };
  render();
}

function setDragonActionStatus(text, ok){
  const el = document.getElementById('dragonActionStatus');
  if(!el) return;
  el.className = 'status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  el.textContent = text;
}

async function doDragonAttack(){
  setDragonActionStatus('The blow lands…');
  const data = await circleFetch('dragon-attack');
  if(!data.ok){ setDragonActionStatus(data.error || 'Could not attack.', false); await refreshDragonStatus(); return; }

  if(data.repelled){
    setDragonActionStatus(`Repelled! The dragon hit back for ${data.damageTaken}${data.dragonCrit ? ' (critical!)' : ''} before your strike landed — no damage dealt this time.`, false);
  }else if(data.defeated){
    const bits = [`${esc(data.dragonName)} falls!`, `You dealt ${data.damage}${data.crit ? ' (critical!)' : ''} and took ${data.damageTaken} in return.`, `The Circle gained ${data.rewardDevotion} Devotion and ${data.rewardRank} rank.`];
    if(data.yourShare) bits.push(`You personally earned ${data.yourShare} Essence.`);
    if(data.decorationWon) bits.push('A new Altar decoration was won!');
    setDragonActionStatus(bits.join(' '), true);
  }else{
    setDragonActionStatus(`Hit for ${data.damage}${data.crit ? ' (critical!)' : ''} — took ${data.damageTaken} in return. ${data.hpRemaining}/${data.hpTotal} HP left.`, true);
  }
  await loadGuardian();
  await refreshDragonStatus();
}

function renderCircleDragon(){
  const app = document.getElementById('app');
  if(!dragonStatus){
    app.innerHTML = `<div class="card"><p class="status">Approaching the lair…</p></div>`;
    return;
  }

  const defeatedRows = (dragonStatus.defeatedDragons || []).map(d => `
    <div class="roster-row"><div class="rname">${esc(d.name)}</div><span class="role-badge high_priest">Defeated</span></div>
  `).join('') || '<p class="hint">No dragons defeated yet.</p>';

  let mainBlock;
  if(dragonStatus.ladderComplete){
    mainBlock = '<p class="hint" style="text-align:center;">Your Circle has defeated every dragon on the ladder. Watch this space — more may join it later.</p>';
  }else{
    const fight = dragonStatus.activeFight;
    const nextDragon = dragonStatus.nextDragon;
    if(fight){
      const pct = Math.max(0, Math.round((fight.hp_remaining / fight.hp_total) * 100));
      const remaining = formatRemaining(new Date(fight.closes_at) - new Date());
      mainBlock = `
        <h2 style="text-align:center;">${esc(nextDragon ? nextDragon.name : 'The Dragon')}</h2>
        <div class="hp-row"><span class="hp-name">HP</span><span class="hp-name">${fight.hp_remaining} / ${fight.hp_total}</span></div>
        <div class="hp-bar-track"><div class="hp-bar-fill opponent" style="width:${pct}%;"></div></div>
        <p class="hint" style="text-align:center;">Window closes in ${remaining}.</p>
        <button onclick="doDragonAttack()">Attack</button>
      `;
    }else if(dragonStatus.usedThisPhase){
      mainBlock = `<p class="hint" style="text-align:center;">Your Circle has already used this moon phase's dragon window. Try again next phase.</p>`;
    }else{
      mainBlock = `
        <h2 style="text-align:center;">${esc(nextDragon.name)}</h2>
        <p class="hint" style="text-align:center;">${nextDragon.hp_pool} HP · no window open yet — the first attack opens one.</p>
        <button onclick="doDragonAttack()">Attack</button>
      `;
    }
  }

  const dragonBg = bgAttr('circleDragon');

async function openCircleInvasions(){
  if(!myCircle || !myCircle.circle) return;
  circleView = { step: 'invasions' };
  invasionStatus = null;
  render();
  await refreshInvasionStatus();
}

async function refreshInvasionStatus(){
  const data = await circleFetch('invasion-status');
  invasionStatus = data.ok ? data : null;

  if(data.ok){
    const ids = new Set();
    (data.pending || []).forEach(inv => { ids.add(inv.attacker_circle_id); ids.add(inv.defender_circle_id); });
    (data.history || []).forEach(inv => { ids.add(inv.attacker_circle_id); ids.add(inv.defender_circle_id); });
    if(ids.size){
      const { data: rows } = await supabaseClient.from('circles').select('id, name').in('id', Array.from(ids));
      (rows || []).forEach(r => { invasionCircleNames[r.id] = r.name; });
    }
  }
  if(circleView && circleView.step === 'invasions') render();
}

function backFromInvasions(){
  circleView = { step: 'home' };
  render();
}

function setInvasionActionStatus(text, ok){
  const el = document.getElementById('invasionActionStatus');
  if(!el) return;
  el.className = 'status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  el.textContent = text;
}

async function doDeclareInvasion(targetCircleId){
  circleStatus = 'Declaring invasion…';
  render();
  const data = await circleFetch('invasion-declare', { targetCircleId });
  circleStatus = data.ok ? "Invasion declared — check your Circle's Invasions panel." : (data.error || 'Could not declare invasion.');
  render();
  if(data.ok) await loadMyCircle();
}

async function doCommitInvasion(invasionId){
  const data = await circleFetch('invasion-commit', { invasionId });
  setInvasionActionStatus(data.ok ? `Committed ${Math.round(data.power)} power to the ${data.side === 'attacker' ? 'attack' : 'defense'}.` : (data.error || 'Could not commit.'), data.ok);
  if(data.ok) await refreshInvasionStatus();
}

function renderCircleInvasions(){
  const app = document.getElementById('app');
  if(!invasionStatus){
    app.innerHTML = `<div class="card"><p class="status">Reading the war council's notes…</p></div>`;
    return;
  }

  const myCircleId = myCircle.circle.id;
  const pending = invasionStatus.pending || [];
  const pendingBlocks = pending.length ? pending.map(inv => {
    const asAttacker = inv.attacker_circle_id === myCircleId;
    const oppId = asAttacker ? inv.defender_circle_id : inv.attacker_circle_id;
    const oppName = invasionCircleNames[oppId] || 'an unknown Circle';
    const closesIn = formatRemaining(new Date(inv.resolves_at) - new Date());
    return `
      <div class="card"${bgAttr('circleInvasions')}>
        <h2 style="text-align:center;">${asAttacker ? 'Attacking ' + esc(oppName) : 'Under invasion by ' + esc(oppName)}</h2>
        <p class="hint" style="text-align:center;">Resolves in ${closesIn}. Committing adds your guardian's full power to your side — anyone can, more than once isn't needed.</p>
        <button onclick="doCommitInvasion('${esc(inv.id)}')">Commit your guardian</button>
      </div>
    `;
  }).join('') : `<div class="card"${bgAttr('circleInvasions')}><p class="hint" style="text-align:center;">No invasion in progress.</p></div>`;

  const historyRows = (invasionStatus.history || []).map(inv => {
    const asAttacker = inv.attacker_circle_id === myCircleId;
    const oppId = asAttacker ? inv.defender_circle_id : inv.attacker_circle_id;
    const oppName = invasionCircleNames[oppId] || 'an unknown Circle';
    const won = inv.winner_circle_id === myCircleId;
    return `<div class="roster-row">
      <div><div class="rname">${asAttacker ? 'Attacked' : 'Defended against'} ${esc(oppName)} — ${won ? 'Victory' : 'Defeat'}</div>
      <div class="cblurb">${new Date(inv.resolved_at).toLocaleString()} · ${inv.essence_seized} Essence seized · ${won ? '+' : '-'}${inv.rank_delta} rank</div></div>
    </div>`;
  }).join('') || '<p class="hint">No invasions yet.</p>';

  app.innerHTML = `
    <div class="card"${bgAttr('circleInvasions')}>
      <h2 style="text-align:center;">Invasions</h2>
      <p class="hint" style="text-align:center;">Officers declare from another Circle's listing while browsing. Once a fight is underway, any member on either side can commit.</p>
      <div class="status" id="invasionActionStatus"></div>
    </div>
    ${pendingBlocks}
    <div class="card"${bgAttr('circleInvasions')}>
      <h2>History</h2>
      ${historyRows}
      <button class="secondary" style="margin-top:14px;" onclick="backFromInvasions()">Back to your Circle</button>
    </div>
  `;
}

async function doStartExpedition(artifactKey, fragmentIndex){
  setExpeditionMsg('Setting out…');
  try{
    const resp = await fetch(FUNCTIONS_URL + '/expedition', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'start', guardianId: guardian.id, artifactKey, fragmentIndex })
    });
    const data = await resp.json();
    if(!data.ok){ setExpeditionMsg(data.error || 'Could not start that expedition.', false); return; }
    await Promise.all([loadExpeditionCatalog(), loadExpeditionStatus()]);
    render();
    setExpeditionMsg(`Your guardian set out for ${data.regionName}.`, true);
  }catch(e){
    setExpeditionMsg('Could not reach the relay: ' + e.message, false);
  }
}

async function doAnswerExpedition(choiceIndex){
  if(!expeditionStatus) return;
  setExpeditionMsg('Answering…');
  try{
    const resp = await fetch(FUNCTIONS_URL + '/expedition', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify({ action: 'answer', guardianId: guardian.id, expeditionId: expeditionStatus.id, choiceIndex })
    });
    const data = await resp.json();
    if(!data.ok){ setExpeditionMsg(data.error || 'Could not submit that answer.', false); return; }
    expeditionView = { step: 'result', result: data };
    await loadExpeditionCatalog();
    expeditionStatus = null;
    if(data.artifactCompleted) await loadGuardian();
    render();
  }catch(e){
    setExpeditionMsg('Could not reach the relay: ' + e.message, false);
  }
}

function renderExpedition(){
  const app = document.getElementById('app');

  if(!expeditionCatalog){
    app.innerHTML = `<div class="card"${bgAttr('expeditions', 'text-align:center;')}><h2>Expeditions</h2><p class="hint">Loading…</p></div>`;
    return;
  }

  if(expeditionView.step === 'result'){
    const r = expeditionView.result;
    const correctText = (r.choices || [])[r.correctIndex] ?? '';
    app.innerHTML = `
      <div class="card"${bgAttr('expeditions', 'text-align:center;')}>
        <h2>${r.correct ? 'Found it!' : 'Not quite'}</h2>
        <p class="hint">${esc(r.regionName || '')}</p>
        <p>${r.correct ? 'Correct — the fragment is yours.' : `The correct answer was: <strong>${esc(correctText)}</strong>`}</p>
        <p class="hint">${esc(r.funFact || '')}</p>
        ${r.artifactCompleted ? `<p class="status ok" style="display:block;">Artifact complete — a deity has taken notice of you. Check your pantheon list.</p>` : ''}
        <div class="status" id="expeditionMsg"></div>
        <button class="secondary" onclick="backFromExpeditionResult()">Continue</button>
      </div>
    `;
    return;
  }

  let travelCard = '';
  if(expeditionStatus && !expeditionStatus.ready){
    const readyDate = new Date(expeditionStatus.readyAt);
    travelCard = `
      <div class="card"${bgAttr('expeditions', 'text-align:center;')}>
        <h2>Away exploring</h2>
        <p class="hint">Your guardian is traveling. It'll be ready to report back at ${readyDate.toLocaleString()}.</p>
        <button class="secondary" onclick="refreshExpeditionStatus()">Check now</button>
      </div>`;
  } else if(expeditionStatus && expeditionStatus.ready){
    const choices = expeditionStatus.choices || [];
    travelCard = `
      <div class="card"${bgAttr('expeditions', 'text-align:center;')}>
        <h2>${esc(expeditionStatus.regionName || 'Your guardian has arrived')}</h2>
        <p>${esc(expeditionStatus.clueText || '')}</p>
        <div style="display:flex;flex-direction:column;gap:8px;max-width:420px;margin:10px auto 0;">
          ${choices.map((c, i) => `<button class="secondary" onclick="doAnswerExpedition(${i})">${esc(c)}</button>`).join('')}
        </div>
      </div>`;
  }

  const hasActiveTrip = !!expeditionStatus;
  const capReached = expeditionCatalog.expeditionsRemainingToday <= 0;
  const capNote = `${expeditionCatalog.expeditionsRemainingToday} of ${expeditionCatalog.expeditionsPerDay} expeditions left today.`;

  const artifactCards = (expeditionCatalog.artifacts || []).map(a => {
    const owned = new Set(a.fragmentsOwned || []);
    const complete = owned.size >= a.total_fragments;
    const fragmentButtons = Array.from({ length: a.total_fragments }, (_, i) => i + 1).map(idx => {
      if(owned.has(idx)) return `<span style="display:inline-block;padding:4px 10px;border-radius:12px;background:rgba(255,255,255,0.08);margin:2px;">Fragment ${idx} ✓</span>`;
      const disabled = hasActiveTrip || capReached;
      return `<button class="secondary" style="margin:2px;" ${disabled ? 'disabled' : ''} onclick="doStartExpedition('${esc(a.key)}', ${idx})">Send for Fragment ${idx}</button>`;
    }).join(' ');
    const statusLabel = complete ? (a.deityAlreadyUnlocked ? 'Unlocked' : 'Complete!') : `${owned.size}/${a.total_fragments} fragments`;
    return `<div class="roster-row">
      <div><div class="rname">${esc(a.name)} — ${esc(statusLabel)}</div>
      <div class="cblurb">${esc(a.description || '')}</div></div>
      <div class="ractions" style="flex-wrap:wrap;">${complete ? '' : fragmentButtons}</div>
    </div>`;
  }).join('') || '<p class="hint">No expeditions are available right now — check back later.</p>';

  app.innerHTML = `
    <div class="card"${bgAttr('expeditions', 'text-align:center;')}>
      <h2>Expeditions</h2>
      <p class="hint">Send your guardian to real places in search of ancient artifact fragments. Answer honestly, learn something true either way, and reassemble a full set to draw a deity's attention.</p>
      <p class="hint">${capNote}</p>
      <div class="status" id="expeditionMsg"></div>
    </div>
    ${travelCard}
    <div class="card"${bgAttr('expeditions')}>
      <h2>Artifacts</h2>
      ${artifactCards}
      <button class="secondary" style="margin-top:14px;" onclick="backFromExpedition()">Back to the map</button>
    </div>
  `;
}

      <h2>Bonus Petition Credit</h2>
      <p class="hint">Costs a set number of Shards, decided by the gods — if you can't afford it, the attempt will tell you the price.</p>
      <p class="hint">You currently hold <strong>${guardian.bonus_petition_credits || 0}</strong> bonus credit${guardian.bonus_petition_credits === 1 ? '' : 's'}.</p>
      <button class="secondary" ${(guardian.god_shards || 0) > 0 ? '' : 'disabled'} onclick="doCraftPetition()">Craft a petition credit</button>

function renderKeyOfNightPicker(){
  const app = document.getElementById('app');
  // Not-for-sale deities/pantheons stay off the table too — a Key
  // shouldn't be a back door around the same for_sale flag the Shop and
  // Petition Hall both respect, on top of the season-pool restriction.
  const poolIds = new Set(seasonPool.map(d => d.deity_id));
  const groups = Object.keys(CATALOG).filter(pid => shopPantheonForSale(pid)).map(pid => {
    const rows = CATALOG[pid].deities.filter(([id]) => poolIds.has(id) && shopDeityForSale(id)).map(([id, name]) => `<div class="deity-row" onclick="doRedeemKeyOfNight('${esc(pid)}','${esc(id)}','${esc(name)}')">
      <span class="name">${esc(name)}</span>
    </div>`).join('');
    if(!rows) return '';
    return `<div class="pantheon-group"><h3>${esc(CATALOG[pid].label)}</h3>${rows}</div>`;
  }).join('');

  app.innerHTML = `
    <div class="card"${bgAttr('chainedGods')}>
      <h2 style="text-align:center;">Choose with a Key of Night</h2>
      <p class="hint" style="text-align:center;">Only this season's gods are open to a direct choice.</p>
      <div class="essence-row"><span class="essence-label">Key of Night</span><span class="essence-value">${guardian.key_of_night || 0}</span></div>
      <div id="redeemStatus" class="status"></div>
      ${groups || '<p class="hint" style="text-align:center;">Nothing is in season right now — check back soon.</p>'}
      <button class="secondary" style="margin-top:10px;" onclick="backToRedeemHub()">Back</button>
    </div>
  `;
}

/* ---------------- raw PvP (Phase 5c) ---------------- */

async function pvpFetch(action, extra){
  try{
    const resp = await fetch(FUNCTIONS_URL + '/pvp', {
      method: 'POST',
      headers: await petitionHeaders(),
      body: JSON.stringify(Object.assign({ action }, extra || {}))
    });
    return await resp.json();
  }catch(e){
    return { ok: false, error: 'Could not reach the relay: ' + e.message };
  }
}

async function openPvpArena(){
  if(session.user.is_anonymous){
    pvpView = { step: 'locked' };
    render();
    return;
  }
  pvpView = { step: 'home' };
  pvpStatus = null;
  pvpLastMatch = null;
  render();
  await refreshPvpStatus();
}

async function refreshPvpStatus(){
  const data = await pvpFetch('status');
  pvpStatus = data.ok ? data : null;
  if(data.ok){
    guardian.favor = data.favor;
    guardian.pvp_shield_until = data.shieldUntil;
  }
  if(pvpView && pvpView.step === 'home') render();
}

async function loadArenaShopCatalog(){
  if(arenaShopCatalog.length) return;
  const { data, error } = await supabaseClient.from('arena_shop_items').select('*').eq('active', true).order('cost_favor', { ascending: true });
  if(error){ console.error('arena shop load failed', error); return; }
  arenaShopCatalog = data || [];
}

async function loadArenaInventory(){
  const { data, error } = await supabaseClient
    .from('guardian_arena_items')
    .select('id, item_key, acquired_at, consumed_at')
    .eq('guardian_id', guardian.id)
    .order('acquired_at', { ascending: false });
  if(error){ console.error('arena inventory load failed', error); return; }
  arenaInventory = data || [];
}

function openPvpShop(){
  pvpView = { step: 'shop' };
  render();
  Promise.all([loadArenaShopCatalog(), loadArenaInventory()]).then(() => { if(pvpView && pvpView.step === 'shop') render(); });
}

async function doArenaBuy(itemKey){
  setPvpActionStatus('Purchasing…');
  const data = await pvpFetch('shop-buy', { itemKey });
  if(!data.ok){ setPvpActionStatus(data.error || 'Could not buy that.', false); return; }
  guardian.favor = data.remainingFavor;
  if(data.shieldUntil) guardian.pvp_shield_until = data.shieldUntil;
  await loadArenaInventory();
  render();
  setPvpActionStatus(data.wired ? 'Purchased and applied.' : 'Purchased — recorded, though this effect has no game logic wired to it yet.', true);
}

function backFromPvp(){
  pvpView = null;
  pvpBrowseResults = [];
  pvpBrowseQuery = '';
  render();
}

function backFromPvpSub(){
  pvpView = { step: 'home' };
  render();
}

function setPvpActionStatus(text, ok){
  const el = document.getElementById('pvpActionStatus');
  if(!el) return;
  el.className = 'status' + (ok === true ? ' ok' : ok === false ? ' err' : '');
  el.textContent = text;
}

function openPvpBrowse(){
  pvpView = { step: 'browse' };
  pvpBrowseResults = [];
  pvpBrowseQuery = '';
  render();
  loadPvpLineup();
}

async function loadPvpLineup(){
  const data = await pvpFetch('browse');
  pvpBrowseResults = data.ok ? (data.results || []) : [];
  if(pvpView && pvpView.step === 'browse') render();
}

let pvpSearchTimer = null;
function onPvpSearchInput(){
  const el = document.getElementById('pvpSearchInput');
  pvpBrowseQuery = el ? el.value : '';
  if(pvpSearchTimer) clearTimeout(pvpSearchTimer);
  pvpSearchTimer = setTimeout(async () => {
    if(pvpBrowseQuery.trim().length >= 2){
      const data = await pvpFetch('browse', { query: pvpBrowseQuery.trim() });
      pvpBrowseResults = data.ok ? (data.results || []) : [];
    }else{
      await loadPvpLineup();
      return;
    }
    if(pvpView && pvpView.step === 'browse') render();
  }, 350);
}

async function openPvpLeaderboard(){
  pvpView = { step: 'leaderboard' };
  pvpLeaderboard = [];
  render();
  const data = await pvpFetch('leaderboard');
  pvpLeaderboard = data.ok ? (data.leaderboard || []) : [];
  if(pvpView && pvpView.step === 'leaderboard') render();
}

async function doPvpChallenge(targetUserId){
  const data = await pvpFetch('challenge', { targetUserId });
  if(!data.ok){ setPvpActionStatus(data.error || 'Could not send challenge.', false); return; }
  pvpView = { step: 'home' };
  render();
  setPvpActionStatus('Challenge sent.', true);
  await refreshPvpStatus();
}

async function doPvpRespond(challengeId, decision){
  setPvpActionStatus(decision === 'accept' ? 'The duel begins…' : 'Declining…');
  const data = await pvpFetch('respond', { challengeId, decision });
  if(!data.ok){ setPvpActionStatus(data.error || 'Could not respond.', false); return; }
  if(decision === 'decline'){ setPvpActionStatus('Challenge declined.', true); await refreshPvpStatus(); return; }
  pvpLastMatch = data.match;
  await refreshPvpStatus();
}

async function doPvpCancel(challengeId){
  const data = await pvpFetch('cancel', { challengeId });
  setPvpActionStatus(data.ok ? 'Challenge cancelled.' : (data.error || 'Could not cancel.'), data.ok);
  if(data.ok) await refreshPvpStatus();
}

function dismissPvpMatch(){
  pvpLastMatch = null;
  render();
}

function renderPvpArena(){
  if(pvpView.step === 'locked') return renderPvpLocked();
  if(pvpView.step === 'home') return renderPvpHome();
  if(pvpView.step === 'browse') return renderPvpBrowse();
  if(pvpView.step === 'leaderboard') return renderPvpLeaderboard();
  if(pvpView.step === 'shop') return renderPvpShop();
}

function renderPvpShop(){
  const app = document.getElementById('app');
  const rows = arenaShopCatalog.map(item => {
    const affordable = (guardian.favor || 0) >= item.cost_favor;
    const note = item.category === 'utility' ? `Utility${item.effect_hours ? ' · ' + item.effect_hours + 'h' : ''}` : 'Cosmetic';
    return `<div class="roster-row">
      <div><div class="rname">${esc(item.name)}</div><div class="cblurb">${esc(item.description || '')} — ${esc(note)} — ${item.cost_favor} Favor</div></div>
      <div class="ractions"><button class="secondary" ${affordable ? '' : 'disabled'} onclick="doArenaBuy('${esc(item.key)}')">Buy</button></div>
    </div>`;
  }).join('') || '<p class="hint">The Arena Store is empty right now.</p>';

  const invRows = arenaInventory.map(it => {
    const catalogItem = arenaShopCatalog.find(c => c.key === it.item_key);
    const name = catalogItem ? catalogItem.name : it.item_key;
    return `<div class="roster-row"><div class="rname">${esc(name)}</div></div>`;
  }).join('') || '<p class="hint">Nothing purchased yet.</p>';

  const shieldNote = guardian.pvp_shield_until && new Date(guardian.pvp_shield_until) > new Date()
    ? `<p class="hint">Warded from challenges until ${new Date(guardian.pvp_shield_until).toLocaleString()}.</p>` : '';

  const arenaBg = bgAttr('arena');
  app.innerHTML = `
    <div class="card"${bgAttr('arena', 'text-align:center;')}>
      <h2>Arena Store</h2>
      <p class="hint">Spend Favor earned from duels on PvP utility and guardian cosmetics.</p>
      <div class="essence-row"><span class="essence-label">Favor</span><span class="essence-value">${guardian.favor || 0}</span></div>
      ${shieldNote}
      <div class="status" id="pvpActionStatus"></div>
    </div>
    <div class="card"${arenaBg}>
      <h2>Catalog</h2>
      ${rows}
    </div>
    <div class="card"${arenaBg}>
      <h2>Owned</h2>
      ${invRows}
      <button class="secondary" style="margin-top:14px;" onclick="backFromPvpSub()">Back</button>
    </div>
  `;
}

function renderPvpLocked(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="card"${bgAttr('arena')}>
      <h2 style="text-align:center;">The Arena</h2>
      <p class="hint" style="text-align:center;">Duels need a permanent account — claim this Seeker with an email first (see the card on your guardian's page), then come back.</p>
      <button class="secondary" onclick="backFromPvp()">Back to the map</button>
    </div>
  `;
}

function renderPvpHome(){
  const app = document.getElementById('app');
  if(!pvpStatus){
    app.innerHTML = `<div class="card"><p class="status">Walking the arena floor…</p></div>`;
    return;
  }

  if(pvpLastMatch){
    const m = pvpLastMatch;
    const won = m.winner_user_id === session.user.id;
    const yourOldPos = won ? m.winner_old_position : m.loser_old_position;
    const yourNewPos = won ? m.winner_new_position : m.loser_new_position;
    app.innerHTML = `
      <div class="card verdict-card"${bgAttr('arena')}>
        <div class="verdict-badge ${won ? 'full' : 'partial'}">${won ? 'Victory' : 'Defeat'}</div>
        <p class="verdict-text">${won ? 'You won the duel.' : 'You lost the duel.'}</p>
        <p class="gain-note">${m.swapped ? `Ranks swapped — you moved from #${yourOldPos} to #${yourNewPos}.` : `No change in rank — #${yourOldPos} was already correctly ordered.`}</p>
        <button onclick="dismissPvpMatch()">Continue</button>
      </div>
    `;
    return;
  }

  const outgoing = pvpStatus.outgoing;
  const incoming = pvpStatus.incoming;

  const outgoingBlock = outgoing ? `
    <div class="card"${bgAttr('arena')}>
      <h2>Your Challenge</h2>
      <p class="hint">Waiting for a response — expires if ignored.</p>
      <button class="secondary" onclick="doPvpCancel('${esc(outgoing.id)}')">Cancel</button>
    </div>
  ` : '';

  const incomingBlock = incoming ? `
    <div class="card"${bgAttr('arena')}>
      <h2>Incoming Challenge</h2>
      <p class="hint">Someone has challenged you to a duel. Accepting resolves it immediately.</p>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button onclick="doPvpRespond('${esc(incoming.id)}','accept')">Accept</button>
        <button class="secondary" onclick="doPvpRespond('${esc(incoming.id)}','decline')">Decline</button>
      </div>
    </div>
  ` : '';

  const historyRows = (pvpStatus.history || []).map(m => {
    const won = m.winner_user_id === session.user.id;
    return `<div class="roster-row">
      <div><div class="rname">${won ? 'Victory' : 'Defeat'}</div>
      <div class="cblurb">${new Date(m.resolved_at).toLocaleString()}${m.swapped ? ' · ranks swapped' : ''}</div></div>
    </div>`;
  }).join('') || '<p class="hint">No duels yet.</p>';

  app.innerHTML = `
    <div class="card"${bgAttr('arena', 'text-align:center;')}>
      <h2>The Arena</h2>
      <p class="hint">Your ladder position: <strong style="color:var(--gold-bright);">${pvpStatus.ladderPosition ? '#' + pvpStatus.ladderPosition : 'unranked — play a duel to join the ladder'}</strong></p>
      <p class="hint">Favor: <strong style="color:var(--gold-bright);">${guardian.favor || 0}</strong></p>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button onclick="openPvpBrowse()">Find an opponent</button>
        <button class="secondary" onclick="openPvpLeaderboard()">Leaderboard</button>
        <button class="secondary" onclick="openPvpShop()">Arena Store</button>
      </div>
      <div class="status" id="pvpActionStatus"></div>
    </div>
    ${outgoingBlock}
    ${incomingBlock}
    <div class="card"${bgAttr('arena')}>
      <h2>Recent Duels</h2>
      ${historyRows}
      <button class="secondary" style="margin-top:14px;" onclick="backFromPvp()">Back to the map</button>
    </div>
  `;
}

function renderPvpBrowse(){
  const app = document.getElementById('app');
  const rows = pvpBrowseResults.map(r => `
    <div class="roster-row">
      <div class="rname">${esc(r.name)}${r.ladder_position ? ' <span class="role-badge initiate">#' + r.ladder_position + '</span>' : ''}</div>
      <div class="ractions"><button class="secondary" onclick="doPvpChallenge('${esc(r.owner_user_id)}')">Challenge</button></div>
    </div>
  `).join('') || '<p class="hint">No one found.</p>';

  app.innerHTML = `
    <div class="card"${bgAttr('arena')}>
      <h2 style="text-align:center;">Find an Opponent</h2>
      <p class="hint" style="text-align:center;">Search by guardian name, or leave it blank to browse the ladder near your own position.</p>
      <input type="text" id="pvpSearchInput" placeholder="Search by guardian name…" value="${esc(pvpBrowseQuery)}" oninput="onPvpSearchInput()">
      ${rows}
      <div class="status" id="pvpActionStatus"></div>
      <button class="secondary" style="margin-top:14px;" onclick="backFromPvpSub()">Back</button>
    </div>
  `;
}

function renderPvpLeaderboard(){
  const app = document.getElementById('app');
  const rows = (pvpLeaderboard || []).map(g => `
    <div class="roster-row"><div class="rname">#${g.ladder_position} ${esc(g.name)}</div></div>
  `).join('') || '<p class="hint">The ladder is empty so far — be the first to duel.</p>';

  app.innerHTML = `
    <div class="card"${bgAttr('arena')}>
      <h2 style="text-align:center;">The Ladder</h2>
      ${rows}
      <button class="secondary" style="margin-top:14px;" onclick="backFromPvpSub()">Back</button>
    </div>
  `;
}

boot();
</script>
</body>
</html>
