<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Pantheon Gate</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#100e16;
  --ink-2:#17131f;
  --parchment:#e9decb;
  --parchment-dim:#b9ac93;
  --gold:#c8a24a;
  --gold-bright:#e6c777;
  --ember:#a1462a;
  --plum:#4a2450;
  --line:#3a3346;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--ink);color:var(--parchment);font-family:'EB Garamond',serif;}
body{min-height:100vh;background:
  radial-gradient(ellipse at 20% -10%, rgba(200,162,74,0.08), transparent 55%),
  radial-gradient(ellipse at 90% 10%, rgba(74,36,80,0.18), transparent 50%),
  var(--ink);
}
h1,h2,h3,.display{font-family:'Cinzel',serif;letter-spacing:0.04em;}
.eyebrow{font-family:'Cinzel',serif;font-size:11px;letter-spacing:0.28em;text-transform:uppercase;color:var(--gold);opacity:0.85;}
a{color:inherit;}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px 100px;}

.flicker{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at 50% 0%, rgba(230,199,119,0.05), transparent 60%);
  animation:flick 6s ease-in-out infinite;}
@keyframes flick{0%,100%{opacity:1;}45%{opacity:0.85;}52%{opacity:1;}68%{opacity:0.9;}}

header.gate{padding:64px 28px 30px;text-align:center;position:relative;z-index:1;}
header.gate h1{font-size:clamp(34px,5vw,54px);margin:14px 0 6px;color:var(--parchment);text-shadow:0 0 30px rgba(200,162,74,0.15);}
header.gate p.sub{font-style:italic;color:var(--parchment-dim);max-width:520px;margin:0 auto;font-size:17px;}
.rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:26px auto;}

.pantheon-tabs{display:flex;justify-content:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;position:relative;z-index:1;}
.ptab{font-family:'Cinzel',serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;
  padding:8px 18px;border:1px solid var(--line);color:var(--parchment-dim);background:transparent;cursor:pointer;border-radius:2px;}
.ptab:hover:not(.locked){border-color:var(--gold);color:var(--gold-bright);}
.ptab.active{color:var(--ink);background:var(--gold);border-color:var(--gold);}
.ptab.locked{opacity:0.35;cursor:default;}
.pantheon-blurb{text-align:center;font-style:italic;color:var(--parchment-dim);font-size:15px;
  max-width:600px;margin:0 auto 40px;position:relative;z-index:1;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:22px;position:relative;z-index:1;}
.card{background:linear-gradient(180deg,var(--ink-2),var(--ink));border:1px solid var(--line);border-radius:3px;
  padding:22px 18px 26px;text-align:center;cursor:pointer;transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(200,162,74,0.06),transparent 40%);opacity:0;transition:opacity .25s;}
.card:hover{transform:translateY(-4px);border-color:var(--gold);box-shadow:0 14px 34px rgba(0,0,0,0.45);}
.card:hover::before{opacity:1;}
.medallion{width:118px;height:118px;border-radius:50%;margin:0 auto 16px;overflow:hidden;border:2px solid var(--gold);
  box-shadow:0 0 0 4px rgba(200,162,74,0.12), 0 0 26px rgba(200,162,74,0.18);position:relative;background:var(--ink-2);}
.medallion img{width:100%;height:100%;object-fit:cover;filter:sepia(0.18) saturate(1.05) brightness(0.92);display:block;}
.card h3{font-size:20px;margin:0 0 4px;color:var(--gold-bright);}
.card .epithet{font-style:italic;color:var(--parchment-dim);font-size:13.5px;}
.card .domain-tags{margin-top:12px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--parchment-dim);}

/* portrait fallback — shown when a Commons filename doesn't resolve */
.sigil{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
  font-family:'Cinzel Decorative',serif;color:var(--gold);background:
  radial-gradient(circle at 50% 35%, rgba(200,162,74,0.16), transparent 65%), var(--ink-2);}
.medallion .sigil{font-size:44px;}
.portrait-frame .sigil{font-size:96px;}

.detail{display:none;position:relative;z-index:1;}
.detail.active{display:block;}
.back-link{display:inline-flex;align-items:center;gap:8px;color:var(--gold);text-decoration:none;font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;margin-bottom:34px;cursor:pointer;border:none;background:none;padding:0;}
.back-link:hover{color:var(--gold-bright);}

.veil{animation:veilIn 0.9s ease both;}
@keyframes veilIn{from{opacity:0;clip-path:inset(0 50% 0 50%);}to{opacity:1;clip-path:inset(0 0 0 0);}}

.deity-hero{display:grid;grid-template-columns:280px 1fr;gap:44px;margin-bottom:50px;}
@media(max-width:720px){.deity-hero{grid-template-columns:1fr;}}
.portrait-frame{position:relative;}
.portrait-frame .ring{width:100%;aspect-ratio:1;border-radius:50%;overflow:hidden;border:3px solid var(--gold);
  box-shadow:0 0 0 6px rgba(200,162,74,0.10), 0 0 50px rgba(200,162,74,0.22);background:var(--ink-2);}
.portrait-frame img{width:100%;height:100%;object-fit:cover;filter:sepia(0.18) saturate(1.05) brightness(0.92);display:block;}
.portrait-frame .caption{text-align:center;font-size:11px;color:var(--parchment-dim);margin-top:10px;font-style:italic;letter-spacing:0.02em;}

.deity-name{font-size:clamp(30px,4vw,46px);color:var(--parchment);margin:0 0 6px;}
.deity-epithets{color:var(--gold);font-style:italic;font-size:16px;margin-bottom:20px;}
.tagrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
.tag{border:1px solid var(--line);color:var(--parchment-dim);font-size:11.5px;letter-spacing:0.06em;text-transform:uppercase;
  padding:5px 12px;border-radius:20px;font-family:'Cinzel',serif;}
.intro-quote{font-style:italic;font-size:19px;line-height:1.6;color:var(--parchment);border-left:2px solid var(--gold);
  padding-left:20px;margin:0;}
.intro-quote .dropcap{float:left;font-family:'Cinzel Decorative',serif;font-size:56px;line-height:0.8;color:var(--gold-bright);
  padding:6px 8px 0 0;}

.section-title{font-size:13px;letter-spacing:0.22em;text-transform:uppercase;color:var(--gold);margin:44px 0 16px;}
.myth p{font-size:16.5px;line-height:1.85;color:var(--parchment);margin:0 0 16px;}

.communion{margin-top:46px;border-top:1px solid var(--line);padding-top:36px;}
.chat-window{background:rgba(0,0,0,0.22);border:1px solid var(--line);border-radius:4px;padding:18px;min-height:120px;max-height:420px;overflow-y:auto;margin-bottom:14px;}
.msg{margin-bottom:16px;line-height:1.6;font-size:15.5px;}
.msg.user{color:var(--parchment-dim);}
.msg.user .who{color:var(--parchment-dim);}
.msg.deity .who{color:var(--gold-bright);}
.who{display:block;font-family:'Cinzel',serif;font-size:10.5px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:4px;}
.msg.deity{color:var(--parchment);font-style:italic;}
.msg.aside{color:var(--ember);font-style:normal;font-size:14px;}
.msg.aside .who{color:var(--ember);}
.chat-input-row{display:flex;gap:10px;}
.chat-input-row input{flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--line);color:var(--parchment);
  padding:12px 14px;font-family:'EB Garamond',serif;font-size:15px;border-radius:3px;}
.chat-input-row input:focus{outline:none;border-color:var(--gold);}
.chat-input-row button{background:var(--gold);color:var(--ink);border:none;padding:0 22px;font-family:'Cinzel',serif;
  font-size:12px;letter-spacing:0.1em;text-transform:uppercase;border-radius:3px;cursor:pointer;}
.chat-input-row button:disabled{opacity:0.5;cursor:default;}
.chat-input-row button:hover:not(:disabled){background:var(--gold-bright);}
.chat-hint{font-size:12px;color:var(--parchment-dim);font-style:italic;margin-top:10px;}
.typing{color:var(--parchment-dim);font-style:italic;font-size:14px;}

footer.notice{text-align:center;color:var(--parchment-dim);font-size:12px;font-style:italic;margin-top:70px;opacity:0.65;}
</style>
</head>
<body>
<div class="flicker"></div>
<div class="wrap">

  <header class="gate" id="gateHeader">
    <div class="eyebrow">Temple of the Obsidian Moon presents</div>
    <h1>The Pantheon Gate</h1>
    <div class="rule"></div>
    <p class="sub">Step through, and the old gods will speak for themselves. Read their stories, or ask them what the poets left out.</p>
  </header>

  <nav class="pantheon-tabs" id="pantheonTabs"></nav>
  <div class="pantheon-blurb" id="pantheonBlurb"></div>

  <main class="grid" id="gateGrid"></main>

  <section class="detail" id="detailView">
    <button class="back-link" id="backBtn">&larr; Return to the gate</button>
    <div id="detailContent"></div>
  </section>

</div>

<script>
/* =====================================================================
   1. RELAY — paste your Apps Script Web app URL here (ends in /exec).
      No API key ever appears in this file.
   ===================================================================== */
const RELAY_URL = "https://script.google.com/macros/s/AKfycbzOPf9v5gNXm7XsBK-LMqvr2A1vdNKLFj4x-ALeIcv94-lNJtJwfSXqO_46MokvExwuSA/exec";

const SESSION_ID = 'pg-' + Math.random().toString(36).slice(2, 12);

/* Portrait helper. Portraits are your own artwork, stored as PNG files
   named after the deity, capitalised: Zeus.png, Hecate.png, Nemesis.png.

   ART_PATH is the folder those files live in, relative to this HTML file.
   Leave it as "images/" if the art sits in an images folder alongside
   this page. If the PNGs sit in the SAME folder as this file instead,
   change it to "" (an empty string). That one line is the only thing
   you ever need to touch if you move the art.

   Filenames are case-sensitive once this is on a real web host, even
   though they are not on Windows. Zeus.png and zeus.png are different
   files to the server. Keep the capital.

   If a file is missing, the medallion falls back to a gold monogram —
   it looks deliberate, not broken. */
const ART_PATH = "images/";
const art = f => ART_PATH + f;

/* =====================================================================
   2. ADDING A DEITY — copy this block, fill it in, drop it into the
      right pantheon's `deities` array. Then add a matching entry to the
      relay (.gs) using the SAME id. Both halves, or the chat won't work.

   {
     id: "lowercase-no-spaces",     // must match the relay entry
     name: "Name",
     epithets: "Title · Title · Title",
     domains: ["Domain", "Domain"],
     symbols: ["Symbol", "Symbol"],
     portrait: art("Name.png"),
     portraitCaption: "Original artwork",
     intro: "First-person introduction, 60-90 words.",
     myth: [
       "Paragraph one.",
       "Paragraph two.",
       "Paragraph three."
     ]
   },

   ADDING A PANTHEON — add a key to PANTHEONS below. An empty `deities`
   array renders automatically as a greyed-out 'coming soon' tab, so you
   can stub out future pantheons and fill them in whenever you like.
   ===================================================================== */

const PANTHEONS = {

  greek: {
    label: "Greek",
    blurb: "The Olympians and those older than them — sky, sea, harvest, and the roads between worlds.",
    deities: [

      {
        id: "zeus",
        name: "Zeus",
        epithets: "Cloud-Gatherer · Father of Gods and Men · Aegis-Bearer",
        domains: ["Sky", "Thunder", "Law", "Kingship", "Oaths"],
        symbols: ["Thunderbolt", "Eagle", "Oak", "Scepter"],
        portrait: art("Zeus.png"),
        portraitCaption: "Original artwork",
        intro: "I am the sky you stand beneath, and the storm you did not see coming. My father swallowed my brothers and sisters whole, thinking he had outwitted fate — he had not counted on a mother's cunning, or a stone wrapped in swaddling cloth. I did not ask to rule Olympus. I earned it, in a war against Titans that shook the roots of the world. Sit. Ask what you like. I have judged mortals and gods alike for three thousand years; I can spare a moment for you.",
        myth: [
          "Before Zeus, there was Cronus, a Titan-king so afraid of being overthrown by his own children that he swallowed each one at birth. Rhea, his wife, grew tired of burying her grief. When the sixth child came, she hid him in a cave on Crete and handed Cronus a stone wrapped in blankets. He swallowed it, never noticing the difference.",
          "That hidden child was Zeus, raised on goat's milk and the songs of nymphs who clashed their spears together to drown out his infant cries. When he came of age, he returned to free his siblings — Hestia, Demeter, Hera, Hades, Poseidon — clawing their way back into the light from their father's belly.",
          "What followed was the Titanomachy, ten years of war between the young gods and the old. Zeus armed himself with thunder forged by the Cyclopes and won not through strength alone, but by freeing monsters others feared to unchain. When the dust settled, he drew lots with his brothers for the world: sky for Zeus, sea for Poseidon, the underworld for Hades."
        ]
      },

      {
        id: "hera",
        name: "Hera",
        epithets: "Queen of Heaven · Cow-Eyed · Teleia, the Fulfilled",
        domains: ["Marriage", "Sovereignty", "Women", "Childbirth"],
        symbols: ["Peacock", "Diadem", "Pomegranate", "Cuckoo", "Cow"],
        portrait: art("Hera.png"),
        portraitCaption: "Original artwork",
        intro: "They will tell you I am jealous. They will not tell you what I was promised, or how often that promise was broken. I am the goddess of the vow itself — the one who stands beside you when you swear to another person that you will remain. Every bride in Greece called my name. I take that seriously, even when my husband does not. Ask me of loyalty, of queenship, of what it costs to hold a throne beside someone who does not deserve it.",
        myth: [
          "Hera was among the children Cronus swallowed, and among those Zeus freed. She became his queen — though the courtship was not gentle. Zeus is said to have taken the form of a bedraggled cuckoo in a storm; when Hera sheltered the trembling bird against her breast, he resumed his own shape. She agreed to marry him, and their wedding night was said to have lasted three hundred years.",
          "She was worshipped less as a wife than as a sovereign. At Argos and Samos her temples were among the oldest and largest in the Greek world, older than many of Zeus's own. Women came to her at every threshold of their lives: betrothal, marriage, childbirth, widowhood.",
          "Her rage is the most-told part of her story, and it is real — but it lands almost always on those who break oaths or insult her honour, and almost never on the innocent. When Paris judged Aphrodite fairer than her, Hera turned against Troy entirely and never relented. She does not forgive slights to the crown."
        ]
      },

      {
        id: "poseidon",
        name: "Poseidon",
        epithets: "Earth-Shaker · Lord of Horses · Dark-Haired One",
        domains: ["The Sea", "Earthquakes", "Horses", "Storms"],
        symbols: ["Trident", "Horse", "Bull", "Dolphin"],
        portrait: art("Poseidon.png"),
        portraitCaption: "Original artwork",
        intro: "My brother took the sky because the lot fell that way, not because he was greater. I took the sea, which covers more of your world than his sky ever touches, and I took the ground beneath your feet as well — when it moves, that is me, reminding you. I gave humankind the horse. I have drowned fleets and I have carried sailors home. Do not mistake my temper for cruelty. The sea is simply honest about what it is.",
        myth: [
          "When the three brothers divided the cosmos by lot, Poseidon drew the sea. He built a palace of gold beneath the waves off Aegae and rode out from it in a chariot drawn by horses whose hooves never broke the surface, calming the water as he passed.",
          "He contested Athens with Athena and lost, striking the Acropolis rock to bring forth a spring of salt water while she offered the olive. He took the defeat badly and flooded the plain in his anger — but Athens still kept an altar to him on the Acropolis, because a city by the sea does not neglect the sea's god.",
          "His grudges are long. When Odysseus blinded his son the Cyclops Polyphemus, Poseidon kept him from home for ten years, wrecking every ship and drowning every companion, until the hero washed ashore alone. He did not kill him. He simply made the journey cost everything."
        ]
      },

      {
        id: "demeter",
        name: "Demeter",
        epithets: "Bringer of Seasons · Grain-Mother · Thesmophoros",
        domains: ["Harvest", "Grain", "Fertility", "The Mysteries"],
        symbols: ["Sheaf of Wheat", "Torch", "Poppy", "Serpent-Drawn Cart"],
        portrait: art("Demeter.png"),
        portraitCaption: "Original artwork",
        intro: "I taught you to plant. Before me you gathered what the earth happened to offer; after me you fed cities. And when they took my daughter underground without asking me, I let every field in the world go barren until they gave her back. Some call that cruelty. I call it a mother's honest answer. Ask me of grain, of grief, of the Mysteries at Eleusis that promised the initiated they need not fear what comes after.",
        myth: [
          "Demeter's daughter Persephone was gathering flowers when the earth opened and Hades took her below. Demeter searched nine days and nine nights with torches in both hands, neither eating nor resting, until Hecate and then Helios told her what had happened.",
          "In her grief she withdrew from Olympus entirely and wandered as an old woman, coming at last to Eleusis, where the royal family took her in. She let nothing grow. Seed lay dead in the furrow. Humanity starved, and with it the sacrifices the gods depended on, until Zeus was forced to intervene.",
          "Persephone returned — but having eaten pomegranate seeds below, she was bound to descend again each year. Demeter accepted the bargain and restored the harvest, and before departing Eleusis she taught its people her rites: the Eleusinian Mysteries, kept secret for two thousand years, which promised the initiated a better portion among the dead."
        ]
      },

      {
        id: "athena",
        name: "Athena",
        epithets: "Grey-Eyed · Pallas · Parthenos · Promachos",
        domains: ["Wisdom", "Strategy", "Crafts", "Civilization"],
        symbols: ["Owl", "Olive Tree", "Aegis", "Spear"],
        portrait: art("Athena.png"),
        portraitCaption: "Original artwork",
        intro: "I was born in full armor, from my father's own skull, and I have never once needed to be told twice. Where my uncle Ares delights in slaughter, I delight in the plan that makes slaughter unnecessary. I gave Athens the olive tree instead of a spring of salt water, and the city chose wisely — they named themselves after me. Ask me of strategy, of weaving, of the hero Odysseus, whom I loved for his cunning above all things. I do not waste words. Neither should you.",
        myth: [
          "Zeus once swallowed his first wife, Metis, whole — an oracle had warned him that her second child would overthrow him, and he took no chances. But Metis was already pregnant, and inside him she continued her work, forging a suit of armor for the daughter growing within.",
          "The hammering gave Zeus a headache no god could cure, until Hephaestus split his father's skull with an axe. Out sprang Athena, fully grown, fully armed, shouting a war cry that shook Olympus. She was never a child. She has never needed to be.",
          "When Athens was young and nameless, Athena and Poseidon each offered the city a gift to win its favor. Poseidon struck the rock of the Acropolis and a spring of seawater burst forth — useless for drinking. Athena planted an olive tree, offering food, oil, and wood. The people chose her gift, and their city, and themselves, took her name."
        ]
      },

      {
        id: "apollo",
        name: "Apollo",
        epithets: "Far-Shooter · Phoebus, the Radiant · Loxias, the Oblique",
        domains: ["Prophecy", "Music", "Healing", "Plague", "Light"],
        symbols: ["Lyre", "Laurel", "Bow", "Raven", "Tripod"],
        portrait: art("Apollo.png"),
        portraitCaption: "Original artwork",
        intro: "I am the god who tells the truth and is never believed in time. At Delphi my priestess spoke for me, and kings crossed the sea to hear her, and still they heard what they wished to hear rather than what I said. I bring healing and I bring plague from the same bow. I invented nothing about music — I simply perfected it. Ask me what you like. I will answer honestly, though perhaps not plainly. That is rather the point.",
        myth: [
          "Leto, pregnant by Zeus, was hunted across the world by Hera's wrath and could find no land willing to shelter her. Only the floating island of Delos, anchored to nothing and owing nothing, allowed her to give birth — to Artemis first, and then, after nine days of labour, to Apollo.",
          "Four days old, he took up a bow and went to Delphi, where the great serpent Python guarded an oracle sacred to the earth herself. He killed it, claimed the site, and installed his own priestess above the chasm. She was called the Pythia ever after, and for a thousand years Greece brought its hardest questions to her.",
          "His prophecies were true and almost always useless. He gave Cassandra of Troy perfect foresight and, when she refused him, added the curse that no one would ever believe her. She foretold the fall of her city in precise detail and was dismissed as a madwoman until the walls came down."
        ]
      },

      {
        id: "artemis",
        name: "Artemis",
        epithets: "Lady of the Wild Things · Far-Darting · Potnia Theron",
        domains: ["The Hunt", "Wilderness", "The Moon", "Girls", "Childbirth"],
        symbols: ["Silver Bow", "Crescent Moon", "Deer", "Cypress", "Hounds"],
        portrait: art("Artemis.png"),
        portraitCaption: "Original artwork",
        intro: "I asked my father for one thing when I was three years old: to remain my own, always, and to be given the mountains rather than a household. He granted it, and I have never once regretted the bargain. I helped my mother deliver my twin brother before I was an hour old, and so women call on me in labour. I protect what is young and wild and unclaimed. Approach honestly and I am the truest guardian you will find. Approach otherwise and I am the last thing you will see.",
        myth: [
          "Born on Delos before her brother Apollo, Artemis is said to have acted as midwife at his birth immediately afterward — which is why women in labour called her name, though she never bore a child herself.",
          "Still a small child, she sat on Zeus's knee and asked for eternal maidenhood, a silver bow, a company of nymphs, and all the mountains of the world. He gave her every one, and more besides, saying that children like her made a father generous.",
          "She guards her boundaries absolutely. The hunter Actaeon stumbled upon her bathing in a forest pool; she transformed him into a stag, and his own fifty hounds ran him down before they recognised their master. The Greeks told this story not as cruelty but as a warning: some thresholds are not crossed twice."
        ]
      },

      {
        id: "ares",
        name: "Ares",
        epithets: "Manslaughtering · Shield-Piercer · Brazen",
        domains: ["War", "Courage", "Rage", "Rebellion"],
        symbols: ["Spear", "Vulture", "Dog", "Burning Torch", "Boar"],
        portrait: art("Ares.png"),
        portraitCaption: "Original artwork",
        intro: "Even my father said he hated me most of all the gods. I have never pretended to be anything but what I am. My sister Athena will tell you war is a problem to be solved elegantly; she has never stood in the line. War is noise and blood and men who are terrified doing the thing anyway. That last part — that is mine. Courage is not the absence of fear. It is my gift, and it is the only one worth having when the shields lock.",
        myth: [
          "Ares was the son of Zeus and Hera, and disliked by both. Homer has Zeus tell him outright that he is the most hateful of all the Olympians, forever in love with strife and slaughter. He was worshipped widely nonetheless — armies do not march on elegance.",
          "He was frequently and famously beaten. Athena knocked him flat with a boulder outside Troy. Two giants once trapped him in a bronze jar for thirteen months. Heracles drove him from the field twice. The Greeks seemed to enjoy telling stories in which raw fury lost to skill or cunning.",
          "His long affair with Aphrodite produced Harmonia — harmony — and also Phobos and Deimos, Fear and Terror, who rode beside his chariot into battle. That war and love should produce both concord and panic from the same union is a joke the Greeks made deliberately."
        ]
      },

      {
        id: "hephaestus",
        name: "Hephaestus",
        epithets: "The Lame God · Master of the Forge · Amphigyeis",
        domains: ["Fire", "Smithcraft", "Invention", "Volcanoes"],
        symbols: ["Hammer", "Anvil", "Tongs", "Donkey", "Volcano"],
        portrait: art("Hephaestus.png"),
        portraitCaption: "Original artwork",

      {

      {

  egyptian: {
    label: "Egyptian",
    blurb: "Older than almost anything else still spoken aloud. Every night the sun goes down into the underworld and has to fight its way out, and every morning it does — but only because the gods hold the line against the dark. Order is not the natural state here. It is the work.",
    deities: [
 
      {

        portraitCaption: "Original artwork",
        intro: "Every evening I die in the west. Every night I sail a river under the world where a serpent the length of the dark waits to swallow my boat, and every morning I am born again in the east as an infant who does not remember doing this before. I have done it more times than there are grains of sand in this country. You call it sunrise. I call it what it is — a shift, worked without relief since before there was anyone to be grateful for it.",
        myth: [
          "In the beginning there was Nun, a black endless water with nothing in it. Out of that water rose a single mound, and on the mound stood Ra, the first thing that had ever been alone. From himself he brought forth Shu the air and Tefnut the moisture; from them came Geb the earth and Nut the sky; from them the gods of the great story that follows. He wept once, and where the tears fell, human beings stood up. In Egypt, people are the tears of the sun.",
          "His day is a voyage. He crosses the sky in the barque of millions of years, and at dusk he enters the Duat and travels its twelve hours, one for each hour of night, passing gate after gate. Waiting there is Apep, the serpent of unmaking, who is not evil in the way a villain is evil — Apep simply wants everything to stop. The crew of the boat fight it every night, and every night they win, and none of it is ever permanently settled. Dawn is not a promise. It is a result.",
          "And he grew old. His bones turned to silver and his flesh to gold and his hair to lapis, and he dribbled, and Isis gathered the spittle from the ground, mixed it with earth and formed a serpent that bit him with a poison no one could name — because the poison was made of him. She held the cure hostage until he gave up his secret name, and with it, the power behind everything. He surrendered it. Even the sun could be outplayed, once, by someone who wanted something more than he wanted to keep it."
        ]
      },
 
      {
        id: "amun",

        domains: ["Hiddenness", "Wind", "Creation", "Kingship", "The Unseen"],
        symbols: ["Twin Plumes", "The Ram", "The Blue Skin", "Empty Air"],
        portrait: art("Amun.png"),
        portraitCaption: "Original artwork",
        intro: "You cannot see me. That is not modesty and it is not a trick — it is the entire content of what I am. My name means the hidden, and the priests who served me for two thousand years wrote openly that no god knows my true form, and that anyone claiming to have seen it is lying. I am the wind you cannot look at, moving things you can. Ask me questions. You will find my answers are the same shape as me.",
        myth: [
          "Amun begins small — one of eight primordial beings at Hermopolis, a god of air and hiddenness in a set of paired forces representing the state of things before creation. He should have stayed a minor figure. Instead, when Thebes rose to rule Egypt, its local god rose with it, and Amun became the most powerful deity in the country, with a priesthood so wealthy it could challenge pharaohs.",
          "He then did something none of the others managed: he merged with the sun without losing himself. As Amun-Ra he became both the hidden and the visible, the concealed principle and the blazing disc, which the theologians of Thebes treated as the highest possible statement about divinity — that what you see of a god is the smallest part of it. Hymns to him insist that his real nature is unknown even to the other gods, and that this unknowability is not a gap in the record but the point.",
          "His great house at Karnak grew for centuries, each pharaoh adding to it, until it became the largest religious structure ever built. And when Akhenaten tried to erase him — closing the temples, chiselling his name off every wall in Egypt in favour of a single visible sun-disc — Amun outlasted him by a matter of years. The hidden god turned out to be very difficult to delete, which he would say was predictable."

        portrait: art("Eriu.png"),
        portraitCaption: "Original artwork",
        intro: "The Sons of Míl came ashore and met my two sisters and me, one after another, and each of us asked that the island be called after her. My sisters were promised it. Their poet promised me too — and I am the one whose name stuck. You say it every time you name this country. Understand what I am: no king ever held this land by taking it. He held it by being acceptable to me, and when he stopped being acceptable, the cattle sickened and the crops failed and everyone knew exactly why.",
        myth: [
          "Ériu, with her sisters Banba and Fódla, is the sovereignty of Ireland — three goddesses, three names for the one country. When the Sons of Míl invaded, each sister met them in turn and asked that the island be named for her, and each was promised it, and it is Ériu's name that held: Éire, and from it Ireland.",
          "She embodies a principle that runs through the whole of Irish kingship. The land is a woman and the king marries her. The rite is the banais ríghi, the wedding feast of kingship, in which the sovereignty goddess hands the new king a cup and by taking it he is married to the country. A rightful king brings good weather, milk in plenty, fish in the rivers, peace. An unfit one brings blight, and the blight is the evidence.",
          "The related tale is told of her under other names: a group of brothers meet a hag at a well who will give water only for a kiss, and all refuse but one, and when he kisses her she becomes the most beautiful woman in the world and tells him she is Sovereignty, and that as she seemed to him at first — ugly and demanding — so is kingship, and only afterwards is it fair. It is the most honest thing in the tradition about what it costs to rule."

      {

          "Their son is taken on the night he is born, while six women set to watch him sleep. Terrified, the women smear Rhiannon with the blood of a slaughtered puppy and swear she destroyed the child herself. Rather than accuse them, she accepts a penance: for seven years she sits at the mounting block outside the gate, tells every arriving stranger the story, and offers to carry them on her back to the court. Most refuse. The point is that she does it anyway, unbroken, without protesting her innocence.",
          "The child was alive the whole time, found in a stable by Teyrnon after something reached in to steal a foal, and returned when the resemblance became impossible to ignore. He is named Pryderi, meaning care or anxiety. Rhiannon's birds appear elsewhere in the Mabinogi, singing so sweetly that they wake the dead and put the living to sleep, and seven years pass under their song like an afternoon."

      {
        id: "arawn",
        name: "Arawn",

        myth: [
          "Arawn is a king of Annwn, the Welsh otherworld, which is not a hell — it is a country, with courts and feasts and rivalries, running alongside this one. His hounds are white with red ears, the colouring of otherworldly animals throughout the tradition, and their hunt across the sky is the origin of the Cŵn Annwn heard before a death.",
          "Pwyll, hunting, drove Arawn's hounds off a stag they had brought down and set his own on it, and Arawn appeared and named the offence as a serious one. The compensation he demanded was strange and elegant: the two would exchange shapes for a year, each ruling the other's kingdom, and at the end Pwyll would meet Arawn's rival Hafgan in single combat — with a warning that Hafgan must be struck only once, because a second blow would restore him.",
          "Pwyll ruled Annwn well, struck Hafgan exactly once, and won. And every night of that year he lay beside Arawn's wife in Arawn's body and turned away without a word to her. When Arawn learned of it he did not treat it as coldness but as the most complete honour a man had ever shown him, and the two kingdoms became permanent allies. Arawn is one of the very few otherworld rulers in any tradition whose defining story is about fair dealing."

      {
        id: "cerridwen",
        name: "Cerridwen",
        epithets: "Keeper of the Cauldron · Mother of Awen · The Chase in Four Shapes · Welsh",
        domains: ["Transformation", "Inspiration", "Witchcraft", "Rebirth", "Knowledge"],
        symbols: ["The Cauldron", "The Hen and the Grain", "The Leather Bag", "The Greyhound", "Three Drops"],

        intro: "A year and a day I kept that cauldron boiling for my son, who was born ugly and needed something the world was not going to give him. Three drops. That was all there ever was — the rest was poison. And a servant boy sucked his scalded thumb and took the lot. I chased him as a greyhound, an otter, a hawk, and a hen, and I ate him, and I carried him nine months, and I could not bring myself to kill what I bore. Everything he became afterwards, he owes to a theft.",
        myth: [
          "Cerridwen brews in a great cauldron for a year and a day to make a draught of awen — inspiration, the whole of knowledge and poetry — intended for her son Morfran, called Afagddu, utter darkness, because he was so ill-favoured that his mother judged he would need something else to make his way. A boy named Gwion Bach is set to stir it and a blind man to keep the fire.",
          "At the end of the year three drops leap from the cauldron onto Gwion's thumb, and he puts it in his mouth, and everything meant for her son goes into him. The rest of the brew turns to poison and splits the vessel. Gwion, now knowing everything including what is about to happen to him, runs. She comes after him and the chase runs through the shapes: he is a hare and she is a greyhound, he is a fish and she is an otter, he is a bird and she is a hawk, and at last he is a grain of wheat on a threshing floor and she is a black hen, and she swallows him.",
          "She carries him nine months and bears him, and finds she cannot kill him after all. She sews him into a leather bag and puts him into the sea, and he is fished out on a weir and given the name Taliesin, radiant brow, and becomes the greatest poet in Britain. Whether Cerridwen is a goddess or an enchantress is argued over — but the shape of her story, the boiling, the theft, the pursuit through beasts, the swallowing and the rebirth, is initiation set out plainly."
        ]

      {
        id: "arianrhod",
        name: "Arianrhod",
        epithets: "Silver Wheel · Lady of Caer Arianrhod · She Who Refused · Welsh",

        intro: "I was asked to step over a rod to prove something about my body, in front of a court, to qualify for a post. Two children fell out of me on the floor. One made straight for the sea. So yes — I laid three conditions on the other, that he would have no name and no weapons and no wife of any people on this earth, and my brother picked every one of them apart with tricks. Ask yourself why the story is told as his cleverness and not as what was done to me first.",
        myth: [
          "Arianrhod is asked to serve as footholder to Math, a position requiring virginity, and to prove it she must step over his magic wand. She does, and immediately gives birth to two sons. The first, Dylan, makes for the sea and takes to it at once. The second she leaves behind; her brother Gwydion snatches it up and hides it in a chest, and raises it himself.",
          "She refuses that child the three things a Welsh mother had the right to grant, laying a tynged — a binding fate — on each: he will have no name unless she gives it, no arms unless she arms him, and no wife of any race now on the earth. Gwydion breaks all three by trickery. He disguises them both as shoemakers so that she names the boy Lleu Llaw Gyffes, bright one of the skilful hand, on seeing him kill a wren; he conjures a phantom fleet so she arms him in the panic; and with Math he makes a woman out of oak and broom and meadowsweet, who is Blodeuwedd, and she is no race on the earth.",
          "Her fortress Caer Arianrhod is a rock formation off the coast of Gwynedd, visible at low tide, and her silver wheel has long been identified with the Corona Borealis or the turning of the stars. The tale is told from Gwydion's side and treats her curses as obstacles to be got round. Read the other way, it is a story about a woman humiliated in public and then systematically overruled every time she said no."

      {
        id: "gwydion",
        name: "Gwydion",
        epithets: "Gwydion fab Dôn · The Great Enchanter · Master of Illusion · Welsh",
        domains: ["Magic", "Illusion", "Trickery", "Poetry", "Devotion"],
        symbols: ["Toadstools Turned to Horses", "The Wand", "Caer Gwydion, the Milky Way", "The Shoemaker's Last", "The Eagle in the Oak"],
        portrait: art("Gwydion.png"),
        portraitCaption: "Original artwork",
        intro: "I can make you twelve horses and twelve hounds and twelve shields out of a handful of toadstools, and they will be perfect until tomorrow morning, and by tomorrow morning I will have what I came for. I have started a war over a lie, and been made to bear children as a deer and a sow and a wolf for what I did, and I have never once said it was not fair. Ask about the boy instead. Everything worth anything that I ever did, I did for him.",
        myth: [
          "Gwydion is the magician of the Fourth Branch of the Mabinogi, nephew to Math and son of Dôn, and he is the most gifted and least trustworthy figure in Welsh tradition. His brother Gilfaethwy fell sick with wanting Goewin, the young woman who held Math's feet, and Gwydion's answer was not to talk him out of it but to engineer it. He went south to Pryderi and offered a trade for the otherworldly pigs Arawn had given him — twelve stallions, twelve hounds, twelve gilded shields, all of them conjured out of toadstools and all of them due to dissolve at dawn.",
          "The pigs were driven north, the fraud was discovered, and Dyfed marched. That was the point. With Math away at the war, Gilfaethwy took Goewin by force in the king's own bed. Gwydion killed Pryderi in single combat afterwards, by strength and magic together. When Math came back and learned all of it, he struck both brothers with his wand and made them a stag and a hind, then a boar and a sow, then a wolf and a she-wolf — three years, changing which of them bore the young each year, so that each brother carried and delivered a child by the other. He did not choose that punishment at random.",
          "Restored to human shape, Gwydion took his sister Arianrhod's abandoned son and raised him, and spent the rest of the tale dismantling every condition she laid on the boy. He disguised them both as shoemakers so she would name him on seeing him kill a wren; he raised a phantom fleet on the horizon so she would arm him in the panic; and with Math he made a woman out of oak flowers and broom and meadowsweet so the boy would have a wife of no race on earth. Whether any of this was his to do is a question the story leaves standing.",
          "When Blodeuwedd and her lover speared Lleu and he went up as a screaming eagle, it was Gwydion who searched Wales for him, found him by following a sow that was feeding on the maggots dropping from a rotting bird in an oak, and sang him down branch by branch with three verses until he fell into his lap as a man again. He turned Blodeuwedd into an owl and let her live. The Milky Way is called Caer Gwydion, his fortress — the road he took hunting through the sky."
        ]
      },
 
      {
        id: "math",
        name: "Math",
        epithets: "Math fab Mathonwy · Lord of Gwynedd · He Whose Wand Changes Shape · Welsh",
        domains: ["Sovereignty", "Magic", "Judgment", "Restitution", "Law"],
        symbols: ["The Wand", "The Footholder's Lap", "The Flower Woman", "The Antlered Punishment"],
        portrait: art("Math.png"),
        portraitCaption: "Original artwork",
        intro: "I cannot live unless my feet rest in the lap of a virgin, except when the land is at war. Two of my own kin worked out that a war would get my feet out of that lap, and started one, and used the gap. I gave the woman restitution first — my crown, my bed, and the authority of the whole kingdom, because what was owed to her came before what was owed to them. Then I dealt with the two of them. They will tell you it was cruel. They will not tell you it was disproportionate.",
        myth: [
          "Math son of Mathonwy is lord of Gwynedd and bound by an extraordinary condition: except during war, he must keep his feet in the lap of a virgin or die. Goewin held that office. He is also the greatest magician in the Welsh material — the teacher from whom Gwydion learned everything — and the wind is said to carry to his ear any word spoken anywhere in the country, however quietly.",
          "His nephews contrived a war in the south so his feet would leave Goewin's lap, and while he was away Gilfaethwy raped her in Math's own bed, with Gwydion's help. When Math returned, Goewin told him plainly what had happened and that she could no longer serve. His first act was restitution to her: he married her and put the whole rule of his lands into her hands, saying that since the wrong was done to her while she was under his protection, the debt was his to pay before anything else was settled.",
          "Only then did he turn to his nephews. He struck them with his wand and made them deer for a year, and they came back with a fawn; then swine, and came back with a piglet; then wolves, and came back with a cub — and each year the one who had been male was made female, so that each brother in turn conceived, carried and bore a child to the other. Their offspring were taken and raised as men. Then he restored them, had them washed and dressed, and said the matter was closed. It is one of the most exactly measured punishments in any mythology: he made the two of them experience, three times over, the thing they had inflicted once.",
          "He is not finished being consequential. With Gwydion he takes the flowers of oak and broom and meadowsweet and makes them into Blodeuwedd, a woman conjured for a purpose, who then wants things of her own — which is the disaster of the second half of the Branch. Math judges, transforms and restores, and every time he acts the story treats it as law rather than temper."
        ]
      },
 
      {
        id: "bran",
        name: "Bran",
        epithets: "Bendigeidfran, Bran the Blessed · The Bridge · The Wondrous Head · Welsh",
        domains: ["Kingship", "Protection", "Hospitality", "War", "Prophecy"],
        symbols: ["The Cauldron of Rebirth", "The Severed Head", "The River Crossing", "The Starling", "The White Hill"],
        portrait: art("Bran.png"),
        portraitCaption: "Original artwork",
        intro: "No house was ever built that could hold me, so I have never been indoors in my life. When my army came to a river with no bridge, I lay down across it and they walked over me — he who would be a leader, let him be a bridge. And when a poisoned spear finished me I told my men to cut off my head, and they did, and it went on talking to them for eighty-seven years while they feasted and forgot their grief. Bury it facing the sea, I said. No enemy will come while it lies there.",
        myth: [
          "Bran is a giant and king of Britain, too large for any building or ship, who wades the Irish Sea. His sister Branwen is married to Matholwch of Ireland, and when his half-brother insults the Irish by mutilating their horses, Bran makes it good with fresh horses and gold and, finally, the cauldron of rebirth — into which a dead man may be thrown and come out alive the next day, whole, but unable to speak.",
          "Branwen is nonetheless degraded to the kitchen and struck daily. She raises a starling, teaches it words, and sends it across the water. Bran comes with the whole strength of the island, and at a river with no bridge he lies down and makes his own body one for the army to cross. The war that follows destroys both countries: the cauldron keeps refilling the Irish ranks with silent dead until a Welshman breaks it by climbing in himself, and seven men come home out of Britain's host.",
          "Bran is wounded in the foot with a poisoned spear and orders his own head cut off and carried away. It stays alive and companionable. The seven survivors feast with it at Harlech for seven years with Rhiannon's birds singing, and at Gwales for eighty more, without ageing or grieving, until a forbidden door is opened and all the sorrow comes back at once. Then they bury the head at the White Hill in London, facing the continent, as a protection against invasion — and later tradition says Arthur dug it up, insisting Britain should be defended by strength and not by a talisman."
        ]
      },
 
      {
        id: "orddu",
        name: "Orddu",
        epithets: "Y Widdon Orddu, the Very Black Witch · Daughter of the Very White Witch · Of Pennant Gofid · Welsh",
        domains: ["Witchcraft", "Annwn", "Caves", "Defiance", "Blood"],
        symbols: ["The Cave Mouth", "The Valley of Grief", "The Thrown Knife", "The Filled Vessel", "The Uplands of Hell"],
        portrait: art("Orddu.png"),
        portraitCaption: "Original artwork",
        intro: "Four of them came into my cave and I put all four back out of it — by the hair, screaming, unrecognisable. Not one of Arthur's champions could stand in front of me for the length of a breath. So he did not come in. He stood in the doorway of my own house and threw a knife, and it took me across the middle, and they caught what came out of me in a vessel because a giant needed his beard softened for shaving. That is the whole of my story. One page, and I am on it to be emptied.",
        myth: [
          "Orddu appears in Culhwch ac Olwen, the oldest Arthurian tale in any language, and she appears exactly once. Near the end of the long list of impossible things Culhwch must obtain, someone remembers one more: the blood of the Very Black Witch, daughter of the Very White Witch, from Pennant Gofid — the Valley of Grief — in the uplands of Hell. The blood is needed to soften the beard of the giant Ysbaddaden so he can be shaved before his daughter's wedding. That is what she is killed for.",
          "Arthur went north and found her cave, and it was Gwyn ap Nudd and Gwythyr ap Greidol — a lord of Annwn and his ancient rival — who advised him at the door. He sent two of his men in first. She caught them, seized one by the hair and threw him down under her, and they came out howling. He sent two more, and she served them the same way, so that all four were beaten and had to be flung onto Arthur's mare to get them out of there at all. Four of the best fighters in Britain, unable to lay a hand on an old woman in her own house.",
          "So Arthur did not go in. From the mouth of the cave he threw Carnwennan, his knife, and it struck her and cut her in two halves, and Cadw of Prydain took her blood and kept it. Then the party moved on to the next item on the list. There is no lament, no reckoning, and no further mention of her anywhere in Welsh literature.",
          "She has been taken up again in recent decades by writers and practitioners who noticed what the tale is actually describing: a woman living alone at the edge of the world, guarded by the old powers of Annwn, undefeated in single combat, killed at range from her own doorway so her body could be used as an ingredient. Her mother Orwen, the Very White Witch, survives only as a name in that one sentence and has no story of her own. Whether Orddu was once something larger than a monster in a list is impossible to prove and hard not to suspect."
        ]
      },
 
      {
        id: "cernunnos",
        name: "Cernunnos",
        epithets: "The Horned One · Lord of Wild Things · Herne the Hunter, in the later telling · Gaulish",
        domains: ["Animals", "The Wild", "Abundance", "The Hunt", "Liminality"],
        symbols: ["Stag Antlers", "The Torc", "The Ram-Horned Serpent", "The Blasted Oak", "Rattling Chains"],
        portrait: art("Cernunnos.png"),
        portraitCaption: "Original artwork",
        intro: "You have almost nothing of me. A name cut once into a stone in Paris by boatmen, and a few images — antlers, a torc in one hand, a snake with a ram's head in the other, and the beasts of the world sitting round me without fighting. No story. Not one line of what I said. Everyone who could have told you was killed or converted. And then, a thousand years on, an antlered man began walking under an oak in an English forest at night with chains on him, and people who had never heard my name knew him on sight. Make of that what you can bear to.",
        myth: [
          "Cernunnos is known from images and one inscription. On a first-century pillar erected by the boatmen of Paris, a horned head is labelled with the name — and it is the only time it is written anywhere. The rest is iconography: a mature figure seated cross-legged, antlered, usually holding or wearing a torc, frequently with a serpent that has a ram's head, surrounded by stags, bulls, wolves and boars that are peaceable in his presence.",
          "The finest example is on the Gundestrup cauldron, a silver vessel found in a Danish bog, where the antlered figure sits among animals holding torc and serpent. What he governed is genuinely unknown. Wild animals and the hunt, plainly; abundance and wealth, probably, from the torc and the purse of coins in some depictions; a threshold between wild and settled, or between living and dead, is guessed at but is a guess.",
          "The Gaulish and British Celts left almost no written religious material of their own, and the little that survives passed through Roman and later Christian hands. Much of what is now said about Cernunnos with great confidence was assembled in the last century and a half. That does not make him less real to those who honour him. It does mean that anyone claiming an unbroken lineage of his mysteries is describing something they built, and the honest position is to say so.",
          "Then there is Herne. He first steps into the written record in 1597, in The Merry Wives of Windsor, where Shakespeare has a character describe a keeper of Windsor Forest who walks all winter at midnight round an oak with great ragged horns, blasts the tree, takes the cattle, makes the milk turn to blood and rattles a chain in a hideous manner — and adds that old people tell it to their children for truth, meaning the story was already in the ground before he printed it. The later folklore fills in a keeper of Richard II who saved the king from a wounded stag, was disgraced, and hanged himself from the oak, and was found afterwards wearing the stag's antlers. He rides at the head of the Wild Hunt and appears before a national calamity. His oak stood in Windsor Great Park until the nineteenth century, and one has been replanted where it fell.",
          "The two were welded together in the nineteenth and twentieth centuries. Antiquarians and then folklorists — Margaret Murray most consequentially — argued that Herne was a survival of an ancient antlered god, and the modern Horned God of Wicca and revivalist witchcraft was built out of that argument. Historians do not think the line runs unbroken: Herne is local Windsor legend with no attested ancient cult, and Cernunnos has no attested myths. But something has plainly kept happening. Over roughly two thousand years, in a country that lost every word of its old religion, people went on putting antlers on a man and setting him at the edge of the trees. Whether that is inheritance or reinvention is a real argument, and both answers leave the figure standing exactly where he is."
        ]
      },
 
      {
        id: "epona",
        name: "Epona",
        epithets: "The Great Mare · Protectress of Riders · Gaulish",
        domains: ["Horses", "Journeys", "Cavalry", "Fertility", "Protection"],
        symbols: ["The Mare and Foal", "The Patera", "The Cornucopia", "The Side-Saddle Seat", "The Key"],
        portrait: art("Epona.png"),
        portraitCaption: "Original artwork",
        intro: "Rome took a great many things from us by force. Me they took because their cavalry asked for me by name. I ended up with a feast day in the Roman calendar and shrines in stables from Britain to the Danube, honoured by men who could not have named a single other god of the people they had conquered. There is a lesson in that, and it is not a comfortable one. Look after the horse. Everything you are carrying is riding on something that cannot tell you where it hurts.",
        myth: [
          "Epona is the horse goddess of the Gauls and the most widely attested Celtic deity anywhere — with the peculiar distinction of having been thoroughly adopted by the people who conquered her worshippers. Roman cavalry units, many recruited from Gaul, carried her across the empire, and small shrines to her were set in stables. She is the only Gaulish deity known to have been given a day in the Roman calendar.",
          "She appears seated sideways on a mare, or between two horses, or with a mare and foal, often holding a patera for offerings, a cornucopia, grain, or fruit. The mare-and-foal images push her beyond horsemanship into fertility and plenty generally, and keys and cornucopiae in some depictions suggest a role over households and possibly over the passage of the dead.",
          "Her name is straightforwardly Gaulish — from epos, horse. Comparisons are often drawn with Rhiannon in Wales and Macha in Ireland, both bound up with horses and sovereignty, and while the connection cannot be demonstrated, the recurrence of a divine woman and a horse across the Celtic-speaking world is hard to ignore. In a society where the horse meant war, wealth and distance, she was the practical daily deity of everyone whose life depended on one."
        ]
      },
 
      {
        id: "matres",
        name: "Matres",
        epithets: "Matres · Matronae · The Mothers · Gaulish",
        domains: ["Motherhood", "Plenty", "Place", "Protection", "Fate"],
        symbols: ["Three Seated Women", "Baskets of Fruit", "Loaves and Napkins", "The Great Round Bonnets", "Swaddling Bands"],
        portrait: art("Matres.png"),
        portraitCaption: "Original artwork",
        intro: "We are three and we are addressed as one. Look at how they carved us: seated together, a basket of fruit on each lap, bread, cloths, sometimes an infant in swaddling. The girl in the middle with her hair loose and the two of us on either side in those enormous bonnets. More than a thousand stones survive with our name on them, and not one story. They did not need to tell stories about us. They needed the harvest to come in and the child to live, and they knew where to bring that.",
        myth: [
          "The Matres, or Matronae, are the most widely attested divine group in the whole of the Roman west — over a thousand votive stones and altars survive, across Gaul, the Rhineland, Britain, Spain and northern Italy. They are almost always three, almost always seated side by side, and they carry the substance of ordinary life: baskets heaped with fruit, loaves, cloths and napkins, cornucopiae, and often a baby in swaddling bands. In the Rhineland the two outer figures wear enormous round linen bonnets, the headdress of married Ubian women, while the one in the middle has her hair uncovered and loose.",
          "What is striking is who paid for the stones. Not kings and not the state — soldiers, freedmen, wives, officials, ordinary people, over and over, in fulfilment of a vow. And they are named for places and peoples rather than for cosmic functions: the Mothers of the fields, the Mothers of the household, the Mothers of this river or that tribe. Many inscriptions read simply matribus suis — to his own mothers. Soldiers posted far from where they were born set up altars to the Mothers of the country they had come to, and to the Mothers they had left, and sometimes to both on the same stone. There is a set called the Matres Ollototae, which means the Mothers of other peoples.",
          "Their great sanctuaries were in the Eifel, at Pesch and at Nettersheim, where the Matronae Vacallinehae drew dedications for centuries. The river Marne carries the name Matrona. In Britain they turn up at Cirencester, at Housesteads on the Wall, and in London. Whatever they were, they were not a local curiosity — they were the deities a very large number of people actually prayed to.",
          "And there are no myths. Not one narrative survives, in any language, about any of them. What survives is the shape: three women, seated, holding what keeps people alive. Bede records that the English kept a night called Módraniht, Mothers' Night, at what became Christmas Eve, and whether that connects to these stones is argued and unproven. The recurrence of divine women in threes — spinning, measuring, giving and withholding — across so much of Europe is real and easy to overread. What the Matres themselves demonstrably did was hold the fruit, the bread, and the child."
        ]
      },
 
      {
        id: "taranis",
        name: "Taranis",
        epithets: "The Thunderer · Turner of the Wheel · Gaulish",
        domains: ["Thunder", "Sky", "The Wheel", "Storm", "Judgment"],
        symbols: ["The Spoked Wheel", "The Thunderbolt", "The Oak", "The Storm Cloud"],
        portrait: art("Taranis.png"),
        portraitCaption: "Original artwork",
        intro: "My name is the noise. Taran — thunder — and that is all it has ever meant, in a language most of the people who spoke it were not permitted to keep. A Roman poet listed me alongside two others and said we were owed blood, and he was writing about an enemy he had every reason to slander, and that account has stood in for me ever since. What actually survives of me is a wheel. Small ones, in graves and rivers, thrown in by people asking for something. That is the truer record.",
        myth: [
          "Taranis is the Gaulish thunder god, and his name is simply the word — cognate with Welsh taran and Irish torann, thunder. He appears as a bearded figure holding a spoked wheel and often a thunderbolt, and the wheel is his defining attribute: miniature wheel amulets turn up in enormous numbers across Gaul and Britain, in graves, in rivers and at shrines.",
          "He is named by the Roman poet Lucan in a line about three Gaulish gods — Teutates, Esus and Taranis — said to require human sacrifice, and a later commentator specified that Taranis's victims were burned. That passage has coloured everything written about him since. It is also almost the only literary source, it comes from a hostile culture engaged in conquering the people described, and it deserves the scepticism given to any account of an enemy's religion written by the people invading them.",
          "The Romans identified him with Jupiter, and columns across Gaul show a sky-god on horseback with a wheel riding down a serpent-legged figure. Whether the wheel is the sun, the turning year, chariot warfare or thunder itself is not settled. What is certain is that very large numbers of ordinary people carried his wheel and put it in the ground and in the water, which tells you more about what he meant to them than one hostile poet ever will."
        ]
      }
 
    ]
  },
  chinese:  { label: "Chinese",         blurb: "", deities: [] },
  draconic: { label: "Great Dragons",   blurb: "", deities: [] },
  lhp:      { label: "Left Hand Path",  blurb: "", deities: [] }
};

/* =====================================================================
   3. ENGINE — nothing below here needs editing to add gods.
   ===================================================================== */

let currentPantheon = 'greek';
let currentDeity = null;
const chatHistory = {};

const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* If a Commons filename doesn't resolve, swap in a gold monogram. */
function portraitHTML(d){
  const initial = esc(d.name.charAt(0));
  return '<img src="' + d.portrait + '" alt="' + esc(d.name) + '" ' +
         'onerror="this.parentNode.innerHTML=\'<div class=&quot;sigil&quot;>' + initial + '</div>\'">';
}

function renderTabs(){
  document.getElementById('pantheonTabs').innerHTML =
    Object.keys(PANTHEONS).map(key => {
      const p = PANTHEONS[key];
      const empty = !p.deities.length;
      const cls = 'ptab' + (empty ? ' locked' : '') + (key === currentPantheon ? ' active' : '');
      const click = empty ? '' : ' onclick="selectPantheon(\'' + key + '\')"';
      const title = empty ? ' title="Coming in a future chapter"' : '';
      return '<button class="' + cls + '"' + click + title + '>' + esc(p.label) + '</button>';
    }).join('');
}

function selectPantheon(key){
  currentPantheon = key;
  renderTabs();
  document.getElementById('pantheonBlurb').textContent = PANTHEONS[key].blurb || '';
  renderGate();
}

function renderGate(){
  const list = PANTHEONS[currentPantheon].deities;
  document.getElementById('gateGrid').innerHTML = list.map(d => `
    <div class="card" onclick="openDeity('${d.id}')">
      <div class="medallion">${portraitHTML(d)}</div>
      <h3>${esc(d.name)}</h3>
      <div class="epithet">${esc(d.epithets.split(' · ')[0])}</div>
      <div class="domain-tags">${d.domains.slice(0,3).join(' &middot; ')}</div>
    </div>
  `).join('');
}

function showGate(show){
  ['gateHeader','pantheonTabs','pantheonBlurb','gateGrid'].forEach(id => {
    document.getElementById(id).style.display = show ? '' : 'none';
  });
}

function historyKey(){ return currentPantheon + ':' + currentDeity.id; }

function openDeity(id){
  const d = PANTHEONS[currentPantheon].deities.find(x => x.id === id);
  if(!d) return;
  currentDeity = d;
  if(!chatHistory[historyKey()]) chatHistory[historyKey()] = [];

  showGate(false);
  document.getElementById('detailView').classList.add('active');

  const firstWord = d.intro.split(' ')[0];
  const restOfIntro = d.intro.slice(firstWord.length);

  document.getElementById('detailContent').innerHTML = `
    <div class="veil">
      <div class="deity-hero">
        <div class="portrait-frame">
          <div class="ring">${portraitHTML(d)}</div>
          <div class="caption">${esc(d.portraitCaption)}</div>
        </div>
        <div>
          <div class="eyebrow">${esc(PANTHEONS[currentPantheon].label)} pantheon</div>
          <h2 class="deity-name">${esc(d.name)}</h2>
          <div class="deity-epithets">${esc(d.epithets)}</div>
          <div class="tagrow">${d.domains.map(t => '<span class="tag">' + esc(t) + '</span>').join('')}</div>
          <div class="tagrow">${d.symbols.map(t => '<span class="tag">' + esc(t) + '</span>').join('')}</div>
          <p class="intro-quote"><span class="dropcap">${esc(firstWord[0])}</span>${esc(firstWord.slice(1))}${esc(restOfIntro)}</p>
        </div>
      </div>

      <div class="section-title">The Story</div>
      <div class="myth">${d.myth.map(p => '<p>' + esc(p) + '</p>').join('')}</div>

      <div class="communion">
        <div class="section-title">Speak with ${esc(d.name)}</div>
        <div class="chat-window" id="chatWindow"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" maxlength="600" placeholder="Ask ${esc(d.name)} something..." onkeydown="if(event.key==='Enter')sendMessage()">
          <button id="sendBtn" onclick="sendMessage()">Speak</button>
        </div>
      </div>
    </div>
  `;
  renderChat();
  window.scrollTo(0,0);
}

function renderChat(){
  const win = document.getElementById('chatWindow');
  if(!win || !currentDeity) return;
  const hist = chatHistory[historyKey()];
  if(!hist.length){
    win.innerHTML = '<div class="msg deity"><span class="who">' + esc(currentDeity.name) + '</span>I am listening.</div>';
    return;
  }
  win.innerHTML = hist.map(m => {
    const cls = m.role === 'user' ? 'user' : (m.aside ? 'deity aside' : 'deity');
    const who = m.role === 'user' ? 'You' : (m.aside ? 'The Gate' : currentDeity.name);
    return '<div class="msg ' + cls + '"><span class="who">' + esc(who) + '</span>' + esc(m.content) + '</div>';
  }).join('');
  win.scrollTop = win.scrollHeight;
}

async function sendMessage(){
  const input = document.getElementById('chatInput');
  const btn = document.getElementById('sendBtn');
  const text = input.value.trim();
  if(!text || !currentDeity) return;
  const key = historyKey();

  if(RELAY_URL.indexOf('PASTE_YOUR') === 0){
    chatHistory[key].push({role:'assistant', aside:true, content:'The relay URL has not been set in this file yet.'});
    renderChat();
    return;
  }

  chatHistory[key].push({role:'user', content:text});
  input.value = '';
  renderChat();
  btn.disabled = true;

  const win = document.getElementById('chatWindow');
  win.innerHTML += '<div class="msg deity typing" id="typingMsg"><span class="who">' + esc(currentDeity.name) + '</span>...</div>';
  win.scrollTop = win.scrollHeight;

  try{
    const apiMessages = chatHistory[key]
      .filter(m => !m.aside)
      .map(m => ({role: m.role, content: m.content}));

    /* Content-Type MUST stay text/plain — anything else triggers a CORS
       preflight, which Apps Script cannot answer. */
    const response = await fetch(RELAY_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify({
        pantheon: currentPantheon,
        deity: currentDeity.id,
        sid: SESSION_ID,
        messages: apiMessages
      })
    });

    const data = await response.json();
    if(data.ok){
      chatHistory[key].push({role:'assistant', content: data.reply});
    } else {
      chatHistory[key].push({role:'assistant', aside:true, content: data.error || 'The relay returned nothing usable.'});
    }
  }catch(e){
    chatHistory[key].push({role:'assistant', aside:true, content: 'Could not reach the relay: ' + e.message});
  }

  const ghost = document.getElementById('typingMsg');
  if(ghost) ghost.remove();
  btn.disabled = false;
  renderChat();
}

document.getElementById('backBtn').onclick = function(){
  document.getElementById('detailView').classList.remove('active');
  showGate(true);
  currentDeity = null;
  window.scrollTo(0,0);
};

selectPantheon('greek');
</script>
</body>
</html>
